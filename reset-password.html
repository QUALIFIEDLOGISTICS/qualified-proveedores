<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qualified Logistics · Nueva contraseña</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#FFFFFF; --panel2:#EAF0FB; --border:#DCE4F2;
    --text:#1B2430; --muted:#5B6472; --mutedFaint:#9AA2AB;
    --danger:#C1443D;
    --primary:#173E8C; --primary-dark:#0C2657; --primary-text:#FFFFFF;
    --display: 'Montserrat', 'Arial', sans-serif;
    --body: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--text);font-family:var(--body);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(135deg, #1E4FB0 0%, #123B85 55%, #0A2255 100%);
  }
  .login-card{width:100%;max-width:400px;background:var(--panel);border-radius:16px;padding:44px 40px 36px;box-shadow:0 24px 60px rgba(6,15,40,0.35);}
  .login-logo-row{display:flex;align-items:center;justify-content:center;gap:12px;}
  .login-mark{width:44px;height:44px;flex-shrink:0;}
  .login-wordmark{text-align:left;}
  .login-word-main{font-family:var(--display);font-weight:800;font-size:21px;color:var(--primary-dark);letter-spacing:.2px;line-height:1.15;}
  .login-word-sub{font-family:var(--display);font-weight:700;font-size:9.5px;color:#5B7099;letter-spacing:1.4px;line-height:1.4;}
  .login-rule{width:44px;height:3px;background:var(--primary);margin:16px auto 20px;border-radius:2px;}
  .login-title{font-family:var(--display);font-weight:700;font-size:15px;color:var(--primary);text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:10px;}
  .login-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:26px;line-height:1.5;}
  .field{margin-bottom:18px;}
  .field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:7px;}
  .field-hint{font-size:11.5px;color:var(--mutedFaint);margin-top:6px;line-height:1.4;}
  input{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:12px 13px;color:var(--text);font-family:var(--body);font-size:14.5px;outline:none;}
  input:focus{border-color:var(--primary);}
  button{cursor:pointer;font-family:var(--body);}
  .btn-primary{width:100%;background:var(--primary);color:var(--primary-text);font-weight:700;font-size:14.5px;letter-spacing:.4px;border-radius:7px;padding:13px 16px;border:none;margin-top:8px;text-transform:uppercase;text-align:center;text-decoration:none;display:block;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .login-error{color:var(--danger);font-size:12.5px;margin-bottom:10px;min-height:1px;}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo-row">
      <img class="login-mark" src="logo-mark.png" alt="Qualified Logistics" />
      <div class="login-wordmark">
        <div class="login-word-main">QUALIFIED</div>
        <div class="login-word-sub">LOGISTICS &amp; TRANSPORT</div>
      </div>
    </div>
    <div class="login-rule"></div>
    <div class="login-title">Nueva contraseña</div>
    <div class="login-sub" id="rp-sub">Comprobando el enlace…</div>

    <form id="rp-form" style="display:none;">
      <div class="field">
        <label for="rp-password">Nueva contraseña</label>
        <input type="password" id="rp-password" autocomplete="new-password" required minlength="8" maxlength="128" />
        <div class="field-hint">Mínimo 8 caracteres, con mayúsculas, minúsculas, números y un carácter especial.</div>
      </div>
      <div class="field">
        <label for="rp-password2">Repite la contraseña</label>
        <input type="password" id="rp-password2" autocomplete="new-password" required minlength="8" maxlength="128" />
      </div>
      <div class="login-error" id="rp-error"></div>
      <button type="submit" class="btn-primary" id="rp-submit">Guardar contraseña</button>
    </form>

    <div id="rp-invalid" style="display:none;text-align:center;">
      <div class="login-sub">Este enlace no es válido o ha caducado. Solicita uno nuevo desde la pantalla de inicio de sesión.</div>
      <a href="index.html" class="btn-primary">Volver al inicio</a>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-init.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    const rp = {
      sub: document.getElementById('rp-sub'),
      form: document.getElementById('rp-form'),
      password: document.getElementById('rp-password'),
      password2: document.getElementById('rp-password2'),
      submit: document.getElementById('rp-submit'),
      error: document.getElementById('rp-error'),
      invalid: document.getElementById('rp-invalid'),
    };

    let recoveryReady = false;

    function showForm(){
      if (recoveryReady) return;
      recoveryReady = true;
      rp.sub.textContent = 'Elige una nueva contraseña para tu cuenta.';
      rp.form.style.display = 'block';
    }

    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') showForm();
    });

    (async function checkSession(){
      const { data } = await supabaseClient.auth.getSession();
      if (data && data.session) showForm();
      setTimeout(() => {
        if (!recoveryReady) {
          rp.sub.style.display = 'none';
          rp.invalid.style.display = 'block';
        }
      }, 3000);
    })();

    rp.form.addEventListener('submit', async (e) => {
      e.preventDefault();
      rp.error.textContent = '';
      if (rp.password.value !== rp.password2.value) {
        rp.error.textContent = 'Las dos contraseñas no coinciden.';
        return;
      }
      if (!isStrongPassword(rp.password.value)) {
        rp.error.textContent = PASSWORD_POLICY_MESSAGE;
        return;
      }
      rp.submit.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password: rp.password.value });
      if (error) {
        rp.error.textContent = authErrorMessage(error);
        rp.submit.disabled = false;
        return;
      }
      rp.sub.textContent = '¡Contraseña actualizada! Entrando…';
      rp.form.style.display = 'none';
      setTimeout(() => { window.location.href = 'panel.html'; }, 1200);
    });
  </script>
</body>
</html>
