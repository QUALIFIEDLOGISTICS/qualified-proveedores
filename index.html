<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qualified Logistics · Acceso Proveedores</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#173E8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#FFFFFF; --panel2:#EAF0FB; --border:#DCE4F2;
    --text:#1B2430; --muted:#5B6472; --mutedFaint:#9AA2AB;
    --danger:#C1443D;
    --primary:#173E8C; --primary-dark:#0C2657; --primary-text:#FFFFFF;
    --display: 'Montserrat', 'Arial', sans-serif;
    --body: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;color:var(--text);font-family:var(--body);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(135deg, #1E4FB0 0%, #123B85 55%, #0A2255 100%);
  }
  .login-card{width:100%;max-width:400px;background:var(--panel);border-radius:16px;padding:44px 40px 36px;box-shadow:0 24px 60px rgba(6,15,40,0.35);}
  .login-logo-row{display:flex;align-items:center;justify-content:center;gap:12px;}
  .login-mark{width:44px;height:44px;flex-shrink:0;}
  .login-wordmark{text-align:left;}
  .login-word-main{font-family:var(--display);font-weight:800;font-size:21px;color:var(--primary-dark);letter-spacing:.2px;line-height:1.15;}
  .login-word-sub{font-family:var(--display);font-weight:700;font-size:9.5px;color:#5B7099;letter-spacing:1.4px;line-height:1.4;}
  .login-rule{width:44px;height:3px;background:var(--primary);margin:16px auto 20px;border-radius:2px;}
  .login-title{font-family:var(--display);font-weight:700;font-size:15px;color:var(--primary);text-transform:uppercase;letter-spacing:1px;text-align:center;margin-bottom:28px;}
  .field{margin-bottom:18px;}
  .field label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:7px;}
  input{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:12px 13px;color:var(--text);font-family:var(--body);font-size:14.5px;outline:none;}
  input:focus{border-color:var(--primary);}
  button{cursor:pointer;font-family:var(--body);}
  .btn-primary{width:100%;background:var(--primary);color:var(--primary-text);font-weight:700;font-size:14.5px;letter-spacing:.4px;border-radius:7px;padding:13px 16px;border:none;margin-top:8px;text-transform:uppercase;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .login-error{color:var(--danger);font-size:12.5px;margin-bottom:10px;min-height:1px;}
  .login-note{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.5;}
  .login-footer{margin-top:22px;text-align:center;font-size:11.5px;color:var(--mutedFaint);}
  .login-link{display:block;text-align:right;font-size:12.5px;color:var(--primary);text-decoration:none;margin:-8px 0 4px;cursor:pointer;}
  .login-link:hover{text-decoration:underline;}
  .login-back{display:block;text-align:center;font-size:12.5px;color:var(--muted);text-decoration:none;margin-top:14px;cursor:pointer;}
  .login-back:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo-row">
      <img class="login-mark" src="logo-mark.png" alt="Qualified Logistics" />
      <div class="login-wordmark">
        <div class="login-word-main">QUALIFIED</div>
        <div class="login-word-sub">LOGISTICS &amp; TRANSPORT</div>
      </div>
    </div>
    <div class="login-rule"></div>
    <div class="login-title" id="mode-title">Acceso Proveedores</div>

    <div id="login-mode">
      <div class="field"><label for="login-email">Correo electrónico</label><input id="login-email" type="email" autocomplete="username" /></div>
      <div class="field"><label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" /></div>
      <a class="login-link" onclick="showRecoverMode()">¿Has olvidado la contraseña?</a>
      <div class="login-error" id="login-error"></div>
      <button class="btn-primary" id="login-btn">Iniciar sesión</button>
    </div>

    <div id="recover-mode" style="display:none;">
      <div class="login-note">Introduce tu correo y te enviaremos un enlace para crear una nueva contraseña.</div>
      <div class="field"><label for="recover-email">Correo electrónico</label><input id="recover-email" type="email" autocomplete="username" /></div>
      <div class="login-error" id="recover-error"></div>
      <button class="btn-primary" id="recover-btn">Enviar enlace</button>
      <a class="login-back" onclick="showLoginMode()">← Volver a iniciar sesión</a>
    </div>

    <div class="login-footer">Portal Proveedor &copy; Qualified Logistics</div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-init.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    // Si el enlace de recuperación de contraseña aterriza aquí en vez de en
    // reset-password.html (p.ej. por caché o configuración de Site URL),
    // reenviamos ahí mismo en vez de dejar que redirectIfLoggedIn() nos
    // meta directo en el panel. Dos comprobaciones porque Supabase puede
    // usar formatos distintos de enlace (#access_token=... o ?code=...):
    // una rápida mirando la URL, y otra fiable escuchando el evento real
    // que dispara el SDK al reconocer un enlace de recuperación.
    let isRecoveryFlow = window.location.hash.includes('type=recovery') || window.location.search.includes('code=');
    if (isRecoveryFlow) {
      window.location.replace('reset-password.html' + window.location.search + window.location.hash);
    }
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        isRecoveryFlow = true;
        window.location.href = 'reset-password.html';
      }
    });

    async function attemptLogin(){
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.textContent = '';
      if (!email || !password) { errEl.textContent = 'Introduce correo y contraseña.'; return; }
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      const { error } = await doLogin(email, password);
      if (error) {
        errEl.textContent = authErrorMessage(error);
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
        return;
      }
      window.location.href = 'panel.html';
    }
    document.getElementById('login-btn').addEventListener('click', attemptLogin);
    document.getElementById('login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });

    function showRecoverMode(){
      document.getElementById('login-mode').style.display = 'none';
      document.getElementById('recover-mode').style.display = 'block';
      document.getElementById('mode-title').textContent = 'Recuperar contraseña';
      document.getElementById('recover-error').textContent = '';
      document.getElementById('recover-email').value = document.getElementById('login-email').value;
    }
    function showLoginMode(){
      document.getElementById('recover-mode').style.display = 'none';
      document.getElementById('login-mode').style.display = 'block';
      document.getElementById('mode-title').textContent = 'Acceso Proveedores';
    }
    async function attemptRecover(){
      const email = document.getElementById('recover-email').value.trim();
      const errEl = document.getElementById('recover-error');
      const btn = document.getElementById('recover-btn');
      errEl.textContent = '';
      if (!email) { errEl.textContent = 'Introduce tu correo electrónico.'; return; }
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      const { error } = await doPasswordReset(email);
      btn.disabled = false;
      btn.textContent = 'Enviar enlace';
      if (error) { errEl.textContent = authErrorMessage(error); return; }
      errEl.style.color = 'var(--muted)';
      errEl.textContent = 'Si ese correo tiene una cuenta, te hemos enviado un enlace para restablecer la contraseña.';
    }
    document.getElementById('recover-btn').addEventListener('click', attemptRecover);

    (async function redirectIfLoggedIn(){
      if (isRecoveryFlow) return;
      const session = await getCurrentSession();
      if (isRecoveryFlow) return;
      if (session) window.location.href = 'panel.html';
    })();
  </script>
</body>
</html>
