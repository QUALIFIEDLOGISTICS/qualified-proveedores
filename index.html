<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qualified Logistics · Acceso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F8; --panel:#FFFFFF; --panel2:#F0F2F5; --border:#E1E5EA;
    --text:#1B2430; --muted:#69727C; --mutedFaint:#9AA2AB;
    --danger:#C1443D;
    --primary:#1B3A6B; --primary-text:#FFFFFF;
    --display: 'Montserrat', 'Arial', sans-serif;
    --body: 'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:32px 28px;box-shadow:0 4px 24px rgba(27,58,107,0.08);}
  .login-title{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.4px;text-align:center;margin-bottom:4px;}
  .login-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:26px;}
  .field{margin-bottom:16px;}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  input{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:11px 12px;color:var(--text);font-family:var(--body);font-size:14px;outline:none;}
  input:focus{border-color:var(--primary);}
  button{cursor:pointer;font-family:var(--body);}
  .btn-primary{width:100%;background:var(--primary);color:var(--primary-text);font-weight:600;font-size:14px;border-radius:6px;padding:11px 16px;border:none;margin-top:6px;}
  .btn-primary:hover{filter:brightness(1.15);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .login-error{color:var(--danger);font-size:12.5px;margin-bottom:10px;min-height:1px;}
</style>
</head>
<body>
  <div class="login-card">
    <div class="login-title">Qualified Logistics</div>
    <div class="login-sub">Panel de proveedores — acceso restringido</div>
    <div class="field"><label for="login-email">Correo electrónico</label><input id="login-email" type="email" autocomplete="username" /></div>
    <div class="field"><label for="login-password">Contraseña</label><input id="login-password" type="password" autocomplete="current-password" /></div>
    <div class="login-error" id="login-error"></div>
    <button class="btn-primary" id="login-btn">Entrar</button>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-init.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    async function attemptLogin(){
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      errEl.textContent = '';
      if (!email || !password) { errEl.textContent = 'Introduce correo y contraseña.'; return; }
      btn.disabled = true;
      btn.textContent = 'Entrando…';
      const { error } = await doLogin(email, password);
      if (error) {
        errEl.textContent = authErrorMessage(error);
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return;
      }
      window.location.href = 'panel.html';
    }
    document.getElementById('login-btn').addEventListener('click', attemptLogin);
    document.getElementById('login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });

    (async function redirectIfLoggedIn(){
      const session = await getCurrentSession();
      if (session) window.location.href = 'panel.html';
    })();
  </script>
</body>
</html>
