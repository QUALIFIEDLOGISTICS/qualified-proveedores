// Semanas que cruzan de mes: si hay fichajes diarios de respaldo, se
// reparte esa semana en un trozo por mes (días, km y horas SOLO de
// ese mes; el máximo de km/horas extra se prorratea a esos días, no a
// la semana completa) para que la liquidación mensual sea correcta.
// Si no hay fichajes de respaldo (semana metida a mano) no hay manera
// de saber qué días caen en qué mes, así que se deja como hasta ahora
// (la semana entera cuenta para el mes del jueves de esa semana).
function buildMonthRows(driverId, year, month){
  const weeksForYear = weeklyEntries.filter(e=>e.driverId===driverId && e.year===year);
  if (month === 'todos') return weeksForYear.slice().sort((a,b)=>a.week-b.week);
  const targetMonth = Number(month);
  const rows = [];
  weeksForYear.forEach(e => {
    const { monday, sunday } = weekDateRange(e.year, e.week);
    const mondayMonth = new Date(monday+'T00:00:00').getMonth();
    const sundayMonth = new Date(sunday+'T00:00:00').getMonth();
    if (mondayMonth === sundayMonth) {
      if (mondayMonth === targetMonth) rows.push(e);
      return;
    }
    const weekFichajes = dailyEntries.filter(f => f.driverId===driverId && f.status==='cerrada' && f.date>=monday && f.date<=sunday);
    if (weekFichajes.length === 0) {
      if (weekMonth(e.year, e.week) === targetMonth) rows.push(e);
      return;
    }
    const monthAllFichajes = weekFichajes.filter(f => Number(f.date.slice(5,7))-1 === targetMonth).sort((a,b)=>a.date.localeCompare(b.date));
    if (monthAllFichajes.length === 0) return;
    rows.push({
      ...e,
      daysWorked: monthAllFichajes.filter(f=>!f.excludeDays).length,
      daysCount: monthAllFichajes.filter(f=>!f.excludeDays || f.manualAmount).length,
      km: Math.round(monthAllFichajes.reduce((s,f)=> s + (f.excludeKm ? 0 : Number(f.km||0)), 0)*10)/10,
      hours: Math.round(monthAllFichajes.reduce((s,f)=> s + (f.excludeHours ? 0 : fichajeHours(f)), 0)*100)/100,
      manualAmount: Math.round(monthAllFichajes.reduce((s,f)=>s+Number(f.manualAmount||0),0)*100)/100,
      _splitMonth: targetMonth,
      _rateDate: monthAllFichajes[0].date,
    });
  });
  return rows.sort((a,b)=>a.week-b.week);
}

/* ============================= AUTÓNOMOS: FICHA DETALLE ============================= */
function openDriverDetail(id){
  currentTab='autonomos'; window.__autonomosView='detalle'; window.__autonomosDriverId=id;
  // Se entra viendo el último periodo con datos registrados — fichajes
  // diarios para conductores Plaza, facturación mensual para Piso Móvil —
  // no siempre el mes en curso, que puede no tener nada todavía — y no se
  // queda pegado a lo último que se hubiera elegido para otro conductor.
  const d = drivers.find(x=>x.id===id);
  let lastYear = null, lastMonth = null;
  if (d && d.modality === 'piso_movil') {
    const entries = monthlyBillingEntries.filter(e=>e.driverId===id);
    if (entries.length) {
      const latest = entries.reduce((max,e)=> (e.year>max.year || (e.year===max.year && e.month>max.month)) ? e : max, entries[0]);
      lastYear = latest.year; lastMonth = latest.month;
    }
  } else {
    const driverEntries = dailyEntries.filter(f=>f.driverId===id);
    if (driverEntries.length) {
      const lastDate = driverEntries.reduce((max,f)=> f.date>max?f.date:max, driverEntries[0].date);
      lastYear = Number(lastDate.slice(0,4)); lastMonth = Number(lastDate.slice(5,7))-1;
    }
  }
  window.__autonomosYear = lastYear !== null ? lastYear : new Date().getFullYear();
  window.__autonomosMonth = lastMonth !== null ? lastMonth : new Date().getMonth();
  window.__autonomosWeek = 'todas';
  renderHeader(); renderTab();
}
function backToDriversList(){ window.__autonomosView='lista'; window.__autonomosDriverId=null; renderTab(); }

  const co = companies.find(c=>c.id===d.companyId);

  const driverIndexed = getRatesForDate(d.id, today()).hasIndexation !== false;
  const year = window.__autonomosYear;

  const years = [...new Set([
    ...weeklyEntries.filter(e=>e.driverId===d.id).map(e=>e.year),
    ...indexationEntries.filter(x=>x.driverId===d.id).map(x=>x.year),
    year, systemYear, systemYear + 1, // siempre puedes preparar el año que viene, aunque todavía no tenga semanas
  ])];
  years.sort();

  let entries = buildMonthRows(d.id, year, month).map(e => ({ ...e }));
  const availableWeeks = [...new Set(entries.map(e=>e.week))].sort((a,b)=>a-b);
  const weekFilter = window.__autonomosWeek === undefined ? 'todas' : window.__autonomosWeek;
  if (weekFilter !== 'todas') entries = entries.filter(e => e.week === Number(weekFilter));
  entries.forEach(e => {
    const m = e._splitMonth;
    e.gasoil = Math.round(computeGasoilForWeek(d.id, e.year, e.week, m) * 100) / 100;
    e.supplements = Math.round(computeSupplementsForWeek(d.id, e.year, e.week, m) * 100) / 100;
    e.peajes = Math.round(computeExpenseForWeek(d.id, e.year, e.week, 'peaje', m) * 100) / 100;
    e.otros = Math.round(computeExpenseForWeek(d.id, e.year, e.week, 'otro', m) * 100) / 100;
    // Las jornadas mostradas se recalculan siempre al vuelo desde los
    // fichajes (no desde el valor guardado en weekly_entries), para que
    // nunca se queden desactualizadas por una semana sin recalcular.
    e.daysCount = computeDaysCountForWeek(d.id, e.year, e.week, m);

  const rows = entries.map(e => ({ e, c: computeWeek(getRatesForDate(d.id, e._rateDate || weekDateRange(e.year,e.week).monday), e) }));

      if (!byMonth.has(m)) byMonth.set(m, []);
      byMonth.get(m).push(r);
    });
    const sumGroup = (group, fn) => group.reduce((s,r)=>s+fn(r),0);
    monthRows = [...byMonth.keys()].sort((a,b)=>a-b).map(m => {
      const group = byMonth.get(m);
      const daysCount = sumGroup(group, r=>r.e.daysCount);
      const km = sumGroup(group, r=>r.e.km);
      const hours = sumGroup(group, r=>r.e.hours);
      const kmExtra = sumGroup(group, r=>r.c.kmExtra);
      const hoursExtra = sumGroup(group, r=>r.c.hoursExtra);
      const dayAmount = sumGroup(group, r=>r.c.dayAmount);

    });
  }

                const tags = [f.excludeDays?'Días':null, f.excludeKm?'Km':null, f.excludeHours?'Horas':null].filter(Boolean);

                if (readOnly) return active ? `<span style="color:var(--primary);font-size:10.5px;">${label}</span>` : `<span style="color:var(--mutedFaint);font-size:10.5px;">—</span>`;
                return `<button onclick="openExclusionModal('${f.id}')" title="Excluir días/km/horas de este día del cálculo normal y/o pagar un importe manual" style="background:none;border:1px solid var(--border);border-radius:5px;color:${active?'var(--primary)':'var(--muted)'};font-size:10.5px;padding:3px 7px;white-space:nowrap;">${label}</button>`;
              })()}
            </td>
            <td>${photoThumb(f.photoIn)}</td>
            <td>${photoThumb(f.photoOut)}</td>
            <td style="white-space:nowrap;">
              ${readOnly ? '' : `
              <button onclick="openEditFichajeModal('${f.id}')" title="Corregir" style="background:none;border:none;color:var(--primary);padding:4px;border-radius:6px;display:inline-flex;align-items:center;">${homeIcon(HOME_ICON_PATHS.edit, 15, 'currentColor', 2)}</button>
              <button onclick="deleteFichaje('${f.id}')" title="Eliminar" style="background:none;border:none;color:var(--mutedFaint);">🗑</button>
              `}
            </td>
          </tr>`; }).join('') || `<tr><td colspan="13" style="color:var(--mutedFaint);text-align:center;padding:20px;">Sin fichajes registrados en ${MONTH_NAMES[month]} de ${year}</td></tr>`}
      </tbody></table>
    </div>
    `}

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
      <div style="font-family:var(--display);text-transform:uppercase;font-size:12.5px;color:var(--muted);letter-spacing:.4px;">Tabla resumen liquidación de ${month==='todos' ? year : MONTH_NAMES[month].charAt(0).toUpperCase()+MONTH_NAMES[month].slice(1)+' '+year}</div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;">

      ${kpi('Horas trabajadas', fmtHoursMin(totalHoras), null, true)}
      ${kpi('Ingresos', eur2(totalIngreso), null, true)}
      ${kpi('Descuentos', totalGastos ? '−'+eur2(totalGastos) : '—', null, true)}
      ${driverIndexed ? kpi('Indexación', indexAmount ? eurSigned(indexAmount) : '—', null, true) : ''}
      ${kpi('Neto', eur2(totalNeto), null, true)}
      ${kpi('€/Km', totalKm ? eur2((totalIngreso+indexAmount)/totalKm) : '—', null, true)}
    </div>

    <div class="card" style="padding:0;overflow-x:auto;">
      <table class="fin-table">
        <thead>
          <tr class="fin-group-row">
            <th class="fin-first"></th>
            <th colspan="5" class="fin-g-jornada">Jornada</th>
            <th colspan="5" class="fin-g-ingresos">Ingresos</th>
            <th colspan="4" class="fin-g-gastos">Descuentos</th>

            <th colspan="2" class="fin-neto">Neto</th>
          </tr>
          <tr class="fin-col-row">
            <th class="fin-first fin-center th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="${monthRows ? 'Mes del año (1-12).' : 'Número de semana del año (calendario ISO).'}">${monthRows ? 'Mes' : 'Semana'}<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-center fin-g-jornada fin-g-start th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Jornadas trabajadas ${monthRows?'ese mes':'esa semana'} — incluye los días con importe manual aunque estén excluidos del €/día. El €/día se calcula solo sobre los días no excluidos.">Días<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-jornada th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Kilómetros totales recorridos ${monthRows?'ese mes':'esa semana'}.">Km<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-jornada th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Horas totales trabajadas ${monthRows?'ese mes':'esa semana'}.">Horas<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-jornada th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Km − (máx. km/día × días trabajados). Positivo si se ha superado el máximo permitido.">Km extra<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-jornada th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Horas − (máx. horas/día × días trabajados). Positivo si se ha superado el máximo permitido.">H. extra<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-ingresos fin-g-start th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Días trabajados × precio/día de la tarifa vigente ${monthRows?'ese mes':'esa semana'}.">€/día<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-ingresos th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Se coge el valor más alto entre el importe de km extra y el de horas extra de cada semana. Nunca se suman los dos, solo se cobra el mayor.">Extra<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-ingresos th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Suma de los suplementos registrados ${monthRows?'ese mes':'esa semana'} (fecha, importe y motivo).${monthRows?'':' Haz clic para ver el detalle.'}">Suplem.<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-ingresos th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Importe manual de los días marcados como excluidos del cálculo normal (ver Fichajes diarios). Se paga tal cual, en vez de €/día y km/h extra para esos días.">Manual<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-ingresos th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="€/día + Extra + Suplementos + Manual.">Ingreso<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-gastos fin-g-start th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Suma de los repostajes registrados ${monthRows?'ese mes':'esa semana'} (litros × precio/litro).${monthRows?'':' Haz clic para ver el detalle.'}">Gasoil<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-gastos th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Suma de los peajes registrados ${monthRows?'ese mes':'esa semana'} (fecha, importe y motivo).${monthRows?'':' Haz clic para ver el detalle.'} Se descuenta del ingreso.">Peajes<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-gastos th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Suma de otros gastos registrados ${monthRows?'ese mes':'esa semana'} (fecha, importe y motivo).${monthRows?'':' Haz clic para ver el detalle.'} Se descuenta del ingreso.">Otros<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-g-gastos th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Gasoil + Peajes + Otros. Se descuenta del ingreso.">Total<span class="th-sort-arrow">⇅</span></th>
            ${driverIndexed ? `<th class="fin-num fin-g-ajustes fin-g-start th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Importe por días × % de indexación del mes al que pertenece cada semana. Puede subir o bajar el neto.">Indexación<span class="th-sort-arrow">⇅</span></th>` : ''}
            <th class="fin-num fin-neto th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="Ingreso − Gastos + Indexación. Lo que queda finalmente ${monthRows?'ese mes':'esa semana'}.">Neto<span class="th-sort-arrow">⇅</span></th>
            <th class="fin-num fin-eurkm th-sort" data-sort-type="number" onclick="sortTableByHeader(this)" title="(Ingreso + Indexación) ÷ Km recorridos ${monthRows?'ese mes':'esa semana'}. Lo que se saca por cada kilómetro.">€/Km<span class="th-sort-arrow">⇅</span></th>
          </tr>
        </thead>
        <tbody>
          ${monthRows ? monthRows.map(r => `

              <td class="fin-num fin-g-jornada" style="color:var(--muted);" data-sort-value="${r.kmExtra}">${r.kmExtra>0?'+':''}${r.kmExtra.toFixed(1)}</td>
              <td class="fin-num fin-g-jornada" style="color:var(--muted);" data-sort-value="${r.hoursExtra}">${r.hoursExtra>0?'+':''}${fmtHoursMin(r.hoursExtra)}</td>
              <td class="fin-num fin-g-ingresos fin-g-start" style="color:var(--muted);" data-sort-value="${r.dayAmount}">${eur2(r.dayAmount)}</td>
              <td class="fin-num fin-g-ingresos" data-sort-value="${r.extraCharge}">${r.extraCharge>0 ? `<span class="fin-pill" style="background:rgba(63,143,95,0.12);color:var(--success);">+${eur2(r.extraCharge)}</span>` : `<span style="color:var(--mutedFaint);">—</span>`}</td>
              <td class="fin-num fin-g-ingresos" style="color:${r.supplements?'var(--muted)':'var(--mutedFaint)'};" data-sort-value="${r.supplements||0}">${r.supplements ? eur2(r.supplements) : '—'}</td>
              <td class="fin-num fin-g-ingresos" style="color:${r.manualAmount?'var(--primary)':'var(--mutedFaint)'};font-weight:600;" data-sort-value="${r.manualAmount||0}">${r.manualAmount ? eur2(r.manualAmount) : '—'}</td>
              <td class="fin-num fin-g-ingresos" style="font-weight:700;" data-sort-value="${r.totalIngreso}">${eur2(r.totalIngreso)}</td>
              <td class="fin-num fin-g-gastos fin-g-start" style="color:${r.gasoil?'var(--danger)':'var(--mutedFaint)'};" data-sort-value="${r.gasoil||0}">${r.gasoil ? eur2(r.gasoil) : '—'}</td>
              <td class="fin-num fin-g-gastos" style="color:${r.peajes?'var(--danger)':'var(--mutedFaint)'};" data-sort-value="${r.peajes||0}">${r.peajes ? eur2(r.peajes) : '—'}</td>
              <td class="fin-num fin-g-gastos" style="color:${r.otros?'var(--danger)':'var(--mutedFaint)'};" data-sort-value="${r.otros||0}">${r.otros ? eur2(r.otros) : '—'}</td>
              <td class="fin-num fin-g-gastos" style="color:${r.gastosTotal?'var(--danger)':'var(--mutedFaint)'};font-weight:600;" data-sort-value="${r.gastosTotal?-r.gastosTotal:0}">${r.gastosTotal ? '−'+eur2(r.gastosTotal) : '—'}</td>
              ${driverIndexed ? `<td class="fin-num fin-g-ajustes fin-g-start" style="color:${r.idxAmount<0?'var(--danger)':r.idxAmount>0?'var(--success)':'var(--mutedFaint)'};font-weight:600;" data-sort-value="${r.idxAmount||0}" title="${r.idxPct}% sobre ${eur2(r.dayAmount)}">${r.idxAmount ? eurSigned(r.idxAmount) : '—'}</td>` : ''}
              <td class="fin-num fin-neto" style="font-weight:800;color:var(--primary);font-size:13.5px;" data-sort-value="${r.neto}">${eur2(r.neto)}</td>
              <td class="fin-num fin-eurkm" style="color:var(--muted);font-weight:600;" data-sort-value="${r.km ? (r.totalIngreso+r.idxAmount)/r.km : ''}">${r.km ? eur2((r.totalIngreso+r.idxAmount)/r.km) : '—'}</td>
            </tr>`).join('') || `<tr><td colspan="${driverIndexed?18:17}" style="color:var(--mutedFaint);text-align:center;padding:24px;">Sin datos registrados en ${year}</td></tr>`
          : rows.map(({e,c}) => {
            const idxPct = driverIndexed ? getIndexPercent(d.id, e.year, e._splitMonth !== undefined ? e._splitMonth : weekMonth(e.year, e.week)) : 0;
            const idxAmount = driverIndexed ? c.dayAmount * (idxPct/100) : 0;
            const rowNeto = c.neto + idxAmount;
            return `
            <tr class="fin-row">
              <td class="fin-first fin-center" style="font-weight:600;" data-sort-value="${e.week}" ${e._splitMonth!==undefined?`title="Semana repartida entre dos meses — aquí solo se cuentan los días de ${MONTH_NAMES[e._splitMonth]}."`:''}>${e.week}${e._splitMonth!==undefined?' ✂️':''}</td>
              <td class="fin-num fin-center fin-g-jornada fin-g-start" style="color:var(--muted);" data-sort-value="${e.daysCount}" onclick="event.stopPropagation();">${e.daysCount}</td>
              <td class="fin-num fin-g-jornada" style="color:var(--muted);" data-sort-value="${e.km}" onclick="event.stopPropagation();">${e.km}</td>
              <td class="fin-num fin-g-jornada" style="color:var(--muted);" data-sort-value="${e.hours}" onclick="event.stopPropagation();">${fmtHoursMin(e.hours)}</td>
              <td class="fin-num fin-g-jornada" style="color:${c.extraCharge>0 && c.kmExtraAmount===c.extraCharge?'var(--success)':'var(--muted)'};font-weight:${c.extraCharge>0 && c.kmExtraAmount===c.extraCharge?'700':'400'};" data-sort-value="${c.kmExtra}" onclick="event.stopPropagation();" title="${c.extraCharge>0 && c.kmExtraAmount===c.extraCharge?'Esto es lo que se está pagando en Total Extra.':''}">${c.kmExtra>0?'+':''}${c.kmExtra.toFixed(1)}</td>
              <td class="fin-num fin-g-jornada" style="color:${c.extraCharge>0 && c.hoursExtraAmount===c.extraCharge?'var(--success)':'var(--muted)'};font-weight:${c.extraCharge>0 && c.hoursExtraAmount===c.extraCharge?'700':'400'};" data-sort-value="${c.hoursExtra}" onclick="event.stopPropagation();" title="${c.extraCharge>0 && c.hoursExtraAmount===c.extraCharge?'Esto es lo que se está pagando en Total Extra.':''}">${c.hoursExtra>0?'+':''}${fmtHoursMin(c.hoursExtra)}</td>
              <td class="fin-num fin-g-ingresos fin-g-start" style="color:var(--muted);" data-sort-value="${c.dayAmount}" onclick="event.stopPropagation();">${eur2(c.dayAmount)}</td>
              <td class="fin-num fin-g-ingresos" data-sort-value="${c.extraCharge}" onclick="event.stopPropagation();">${c.extraCharge>0 ? `<span class="fin-pill" style="background:rgba(63,143,95,0.12);color:var(--success);">+${eur2(c.extraCharge)}</span>` : `<span style="color:var(--mutedFaint);">—</span>`}</td>
              <td class="fin-num fin-g-ingresos" data-sort-value="${e.supplements||0}" ${readOnly?'':`style="color:var(--primary);text-decoration:underline;cursor:pointer;" onclick="event.stopPropagation(); openSupplementModal('${d.id}', ${e.year}, ${e.week});"`}>${e.supplements ? eur2(e.supplements) : '—'}</td>
              <td class="fin-num fin-g-ingresos" style="color:${e.manualAmount?'var(--primary)':'var(--mutedFaint)'};font-weight:600;" data-sort-value="${e.manualAmount||0}" onclick="event.stopPropagation();">${e.manualAmount ? eur2(e.manualAmount) : '—'}</td>
              <td class="fin-num fin-g-ingresos" style="font-weight:700;" data-sort-value="${c.totalIngreso}" onclick="event.stopPropagation();">${eur2(c.totalIngreso)}</td>
              <td class="fin-num fin-g-gastos fin-g-start" style="color:${e.gasoil?'var(--danger)':'var(--mutedFaint)'};${readOnly?'':'text-decoration:underline;cursor:pointer;'}" data-sort-value="${e.gasoil||0}" ${readOnly?'':`onclick="event.stopPropagation(); openFuelModal('${d.id}', ${e.year}, ${e.week});"`}>${e.gasoil ? eur2(e.gasoil) : '—'}</td>
              <td class="fin-num fin-g-gastos" style="color:${e.peajes?'var(--danger)':'var(--mutedFaint)'};${readOnly?'':'text-decoration:underline;cursor:pointer;'}" data-sort-value="${e.peajes||0}" ${readOnly?'':`onclick="event.stopPropagation(); openExpenseModal('${d.id}', ${e.year}, ${e.week}, 'peaje');"`}>${e.peajes ? eur2(e.peajes) : '—'}</td>
              <td class="fin-num fin-g-gastos" style="color:${e.otros?'var(--danger)':'var(--mutedFaint)'};${readOnly?'':'text-decoration:underline;cursor:pointer;'}" data-sort-value="${e.otros||0}" ${readOnly?'':`onclick="event.stopPropagation(); openExpenseModal('${d.id}', ${e.year}, ${e.week}, 'otro');"`}>${e.otros ? eur2(e.otros) : '—'}</td>
              <td class="fin-num fin-g-gastos" style="color:${c.gastosTotal?'var(--danger)':'var(--mutedFaint)'};font-weight:600;" data-sort-value="${c.gastosTotal?-c.gastosTotal:0}" onclick="event.stopPropagation();">${c.gastosTotal ? '−'+eur2(c.gastosTotal) : '—'}</td>
              ${driverIndexed ? `<td class="fin-num fin-g-ajustes fin-g-start" style="color:${idxAmount<0?'var(--danger)':idxAmount>0?'var(--success)':'var(--mutedFaint)'};font-weight:600;" data-sort-value="${idxAmount||0}" title="${idxPct}% sobre ${eur2(c.dayAmount)}" onclick="event.stopPropagation();">${idxAmount ? eurSigned(idxAmount) : '—'}</td>` : ''}
              <td class="fin-num fin-neto" style="font-weight:800;color:var(--primary);font-size:13.5px;" data-sort-value="${rowNeto}" onclick="event.stopPropagation();">${eur2(rowNeto)}</td>
              <td class="fin-num fin-eurkm" style="color:var(--muted);font-weight:600;" data-sort-value="${e.km ? (c.totalIngreso+idxAmount)/e.km : ''}" onclick="event.stopPropagation();">${e.km ? eur2((c.totalIngreso+idxAmount)/e.km) : '—'}</td>

          }).join('') || `<tr><td colspan="${driverIndexed?18:17}" style="color:var(--mutedFaint);text-align:center;padding:24px;">Sin semanas registradas en ${year}</td></tr>`}
        </tbody>
        ${(monthRows ? monthRows.length : rows.length) ? `
        <tfoot>
          <tr class="fin-total-row">
            <td class="fin-first fin-center" style="text-transform:uppercase;letter-spacing:.3px;">Total</td>
            <td class="fin-num fin-center">${totalDias}</td>
            <td class="fin-num">${totalKm}</td>
            <td class="fin-num">${fmtHoursMin(totalHoras)}</td>

            <td class="fin-num">${eur2(totalDiaAmount)}</td>
            <td></td><td></td>
            <td class="fin-num">${totalManual ? eur2(totalManual) : '—'}</td>
            <td class="fin-num">${eur2(totalIngreso)}</td>
            <td></td><td></td><td></td>
            <td class="fin-num">${totalGastos ? '−'+eur2(totalGastos) : '—'}</td>
            ${driverIndexed ? `<td class="fin-num">${indexAmount ? eurSigned(indexAmount) : '—'}</td>` : ''}
            <td class="fin-num fin-neto" style="color:var(--primary);font-size:14px;font-weight:800;">${eur2(totalNeto)}</td>
            <td class="fin-num fin-eurkm">${totalKm ? eur2((totalIngreso+indexAmount)/totalKm) : '—'}</td>
          </tr>
        </tfoot>` : ''}

    ${tplAnotacionesSection(d.id, driverNotes.filter(n=>n.driverId===d.id && n.date.startsWith(String(year))
        && (month==='todos' || Number(n.date.slice(5,7))-1===Number(month))
        && (weekFilter==='todas' || getISOWeek(n.date).week===Number(weekFilter))
      ), readOnly)}`;
}
function tplAnotacionesSection(driverId, filteredNotes, readOnly){
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;margin-top:22px;flex-wrap:wrap;">
      <div style="font-family:var(--display);text-transform:uppercase;font-size:12.5px;color:var(--muted);letter-spacing:.4px;">Anotaciones</div>

    </div>
    ${readOnly ? '' : `
    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">

        <div class="field" style="flex:1 1 260px;margin-bottom:0;"><label>Nota</label><input id="note-text" placeholder="Escribe una anotación…" onkeydown="if(event.key==='Enter'){event.preventDefault(); addDriverNote('${driverId}');}" /></div>
        <button class="btn btn-primary" onclick="addDriverNote('${driverId}')">+ Añadir</button>
      </div>
      <div id="note-error" style="color:var(--danger);font-size:12.5px;margin-top:8px;"></div>
    </div>
    `}
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${filteredNotes.map(n => (!readOnly && window.__editingNoteId===n.id) ? `
        <div class="card" style="padding:10px 14px;">
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
            <div class="field" style="flex:0 0 160px;margin-bottom:0;"><label>Fecha</label><input id="note-edit-date-${n.id}" type="date" value="${n.date}" /></div>
            <div class="field" style="flex:1 1 260px;margin-bottom:0;"><label>Nota</label><input id="note-edit-text-${n.id}" value="${esc(n.note)}" onkeydown="if(event.key==='Enter'){event.preventDefault(); saveDriverNoteEdit('${n.id}','${driverId}');} if(event.key==='Escape'){window.__editingNoteId=null; renderTab();}" /></div>
            <button class="btn btn-ghost" onclick="window.__editingNoteId=null; renderTab();">Cancelar</button>
            <button class="btn btn-primary" onclick="saveDriverNoteEdit('${n.id}','${driverId}')">Guardar</button>
          </div>
          <div id="note-edit-error-${n.id}" style="color:var(--danger);font-size:12.5px;margin-top:8px;"></div>
        </div>` : `

/* ============================= AUTÓNOMOS: FICHA DETALLE (PISO MÓVIL) =============================
   Modalidad distinta a Plaza: no ficha, no tiene tarifa por día/km/hora.
   Cada mes se apunta la facturación de sus viajes y se le descuenta
   un % de comisión sobre esa facturación — nada de fichajes, semanas,
   km/horas extra ni indexación. */
function tplPisoMovilDetail(d){
  const co = companies.find(c=>c.id===d.companyId);
  const readOnly = d.archived;
  const year = window.__autonomosYear;
  const month = window.__autonomosMonth === undefined ? 'todos' : window.__autonomosMonth;
  const systemYear = new Date().getFullYear();
  const years = [...new Set([
    ...monthlyBillingEntries.filter(e=>e.driverId===d.id).map(e=>e.year),
    year, systemYear, systemYear + 1,
  ])];
  years.sort();

  const entries = monthlyBillingEntries.filter(e=>e.driverId===d.id && e.year===year && (month==='todos' || e.month===Number(month))).sort((a,b)=>b.month-a.month);
  const rows = entries.map(e => {
    const commissionPercent = getCommissionForDate(d.id, `${e.year}-${String(e.month+1).padStart(2,'0')}-01`);
    const commission = e.billingAmount * (commissionPercent/100);
    const total = e.billingAmount - commission;
    const eurPerKm = e.km ? e.billingAmount / e.km : null;
    const eurPerKmNeto = e.km ? total / e.km : null;
    return { e, commissionPercent, commission, total, eurPerKm, eurPerKmNeto };
  });
  const totalBilling = rows.reduce((s,r)=>s+r.e.billingAmount, 0);
  const totalCommission = rows.reduce((s,r)=>s+r.commission, 0);
  const totalToPay = rows.reduce((s,r)=>s+r.total, 0);
  const totalKm = rows.reduce((s,r)=>s+r.e.km, 0);

        <select onchange="window.__autonomosYear=Number(this.value); renderTab();" style="width:100px;">

      ${kpi('Comisión', totalCommission ? '−'+eur2(totalCommission) : '—', null, true)}
      ${kpi('Total a cobrar', eur2(totalToPay), null, true)}

      ${kpi('€/Km Neto', avgEurPerKmNeto!=null ? eur2(avgEurPerKmNeto) : '—', null, true)}

      <table><thead><tr>${thSort('Mes','number')}${thSort('Facturación','number')}${thSort('Km','number')}${thSort('€/Km Fact.','number','title="Facturación ÷ Km."')}${thSort('% Comisión','number')}${thSort('Comisión','number')}${thSort('Total a cobrar','number')}${thSort('€/Km Neto','number','title="(Facturación − Comisión) ÷ Km."')}<th></th></tr></thead><tbody>

async function submitBilling(driverId, editId){
  const errEl = document.getElementById('bill-error');
  const year = Number(document.getElementById('bill-year').value||0);
  const month = Number(document.getElementById('bill-month').value);
  const billingAmount = Number(document.getElementById('bill-amount').value||0);
  const km = Number(document.getElementById('bill-km').value||0);
  if (!year) { errEl.textContent = 'Indica el año.'; return; }
  const dup = monthlyBillingEntries.find(e=>e.driverId===driverId && e.year===year && e.month===month && e.id!==editId);
  if (dup) { errEl.textContent = 'Ya hay una facturación para ese mes. Edítala en vez de duplicarla.'; return; }
  const data = { driverId, year, month, billingAmount, km };
  const dbData = { driver_id: driverId, year, month, billing_amount: billingAmount, km };
  if (editId) {
    await supabaseClient.from('monthly_billing_entries').update(dbData).eq('id', editId);
    const idx = monthlyBillingEntries.findIndex(e=>e.id===editId);
    monthlyBillingEntries[idx] = { id: editId, ...data };
  } else {
    const { data: row, error } = await supabaseClient.from('monthly_billing_entries').insert(dbData).select().single();
    if (error || !row) { errEl.textContent = 'No se pudo guardar.'; return; }
    monthlyBillingEntries.push({ id: row.id, ...data });
  }
  window.__autonomosYear = year;
  closeModal(); renderTab();
}
async function deleteBilling(id){
  await supabaseClient.from('monthly_billing_entries').delete().eq('id', id);
  monthlyBillingEntries = monthlyBillingEntries.filter(e=>e.id!==id);
  closeModal(); renderTab();
}

async function submitCommissionRate(driverId, editId){
  const validFrom = document.getElementById('cm-from').value;
  const errEl = document.getElementById('cm-error');
  if (!validFrom) { errEl.textContent = 'Indica la fecha desde la que se aplica.'; return; }

async function unarchiveDriver(id){

function openKiosk(driverId){
  window.__kioskMode = true;
  window.__kioskDriverId = driverId;
  window.__kioskStep = 'home';
  window.__kioskHistoryMonth = null;
  window.__kioskPhotoDraft = null;
  renderTab();
}
function closeKiosk(){
  window.__kioskMode = false;
  renderTab();
}
function openTodayEntry(driverId){
  return dailyEntries.find(f => f.driverId===driverId && f.date===today() && f.status==='abierta');
}
// Historial del conductor: por defecto el mes en curso; se puede retroceder
// hasta el primer mes con jornadas cerradas y volver hasta el mes actual.
function kioskHistoryBounds(driverId){
  const current = today().slice(0,7);
  const months = dailyEntries.filter(f=>f.driverId===driverId && f.status==='cerrada').map(f=>f.date.slice(0,7));
  const earliest = months.length ? months.reduce((m,x)=>x<m?x:m, months[0]) : current;
  const month = window.__kioskHistoryMonth || current;
  return { month, earliest: earliest < current ? earliest : current, current };
}
function kioskShiftHistoryMonth(delta){
  const { month, earliest, current } = kioskHistoryBounds(window.__kioskDriverId);
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  const next = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  if (next < earliest || next > current) return;
  window.__kioskHistoryMonth = next;
  renderTab();
}
function tplKiosk(){
  const d = drivers.find(x=>x.id===window.__kioskDriverId);
  if (!d) { window.__kioskMode=false; return `<div class="card" style="text-align:center;color:var(--mutedFaint);padding:32px;">Conductor no encontrado.</div>`; }
  const openEntry = openTodayEntry(d.id);
  const closedToday = dailyEntries.find(f=>f.driverId===d.id && f.date===today() && f.status==='cerrada');
  const step = window.__kioskStep || 'home';

  const shell = (inner) => `
    <div style="max-width:420px;margin:0 auto;position:relative;">
      ${isDriverOnlyAccount() ? '' : `<button onclick="closeKiosk()" style="position:absolute;top:0;right:0;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;">✕ Salir</button>`}
      <div style="text-align:center;margin-bottom:24px;padding-top:${isDriverOnlyAccount() ? '0' : '38px'};">
        <div style="font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.3px;">${esc(d.name)}</div>
        <div style="font-size:13px;color:var(--muted);">${new Date().toLocaleDateString('es-ES',{weekday:'long', day:'2-digit', month:'long'})}</div>
      </div>
      ${inner}
    </div>`;

  if (step === 'start') return shell(tplKioskForm('start', d));
  if (step === 'close') return shell(tplKioskForm('close', openEntry ? d : d));
  if (step === 'history') {
    const { month, earliest, current } = kioskHistoryBounds(d.id);
    const closedEntries = dailyEntries.filter(f=>f.driverId===d.id && f.status==='cerrada' && f.date.startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
    const totalHours = closedEntries.reduce((s,f)=>s+fichajeHours(f), 0);
    const totalKm = closedEntries.reduce((s,f)=>s+(Number(f.km)||0), 0);
    const [my, mm] = month.split('-').map(Number);
    const monthLabel = (s => s.charAt(0).toUpperCase()+s.slice(1))(new Date(my, mm-1, 1).toLocaleDateString('es-ES',{month:'long', year:'numeric'}));
    const arrowStyle = (disabled) => `background:none;border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:15px;color:${disabled?'var(--mutedFaint)':'var(--text)'};cursor:${disabled?'default':'pointer'};opacity:${disabled?.4:1};`;
    return shell(`
      <button onclick="window.__kioskStep='home'; renderTab();" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;">← Volver</button>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
        <button ${month<=earliest?'disabled':''} onclick="kioskShiftHistoryMonth(-1)" title="Mes anterior" style="${arrowStyle(month<=earliest)}">←</button>
        <div style="text-align:center;">
          <div style="font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.3px;">${esc(monthLabel)}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">${closedEntries.length} jornada${closedEntries.length!==1?'s':''} · ${fmtHoursMin(totalHours)} · ${totalKm.toLocaleString('es-ES')} km</div>
        </div>
        <button ${month>=current?'disabled':''} onclick="kioskShiftHistoryMonth(1)" title="Mes siguiente" style="${arrowStyle(month>=current)}">→</button>
      </div>
      <div class="card" style="padding:0;overflow-x:auto;">
        <table><thead><tr>${thSort('Fecha','date')}${thSort('Entrada','text')}${thSort('Salida','text')}${thSort('Horas','number')}${thSort('Km','number')}</tr></thead><tbody>
          ${closedEntries.map(f => `
            <tr>
              <td data-sort-value="${esc(f.date||'')}">${fmtDate(f.date)}</td>
              <td style="color:var(--muted);">${f.timeIn}</td>
              <td style="color:var(--muted);">${f.timeOut}</td>
              <td data-sort-value="${fichajeHours(f)}">${fmtHoursMin(fichajeHours(f))}</td>
              <td style="font-weight:600;" data-sort-value="${f.km}">${f.km} km</td>
            </tr>`).join('') || `<tr><td colspan="5" style="color:var(--mutedFaint);text-align:center;padding:20px;">${month===current ? 'Todavía no tienes jornadas cerradas este mes.' : 'No hay jornadas cerradas este mes.'}</td></tr>`}
        </tbody></table>
      </div>`);
  }

  const historyLink = `<div style="text-align:center;margin-top:16px;"><button onclick="window.__kioskStep='history'; window.__kioskHistoryMonth=null; renderTab();" style="background:none;border:none;color:var(--primary);font-size:12.5px;cursor:pointer;padding:0;">Ver mi historial →</button></div>`;

  // HOME: un único botón grande según el estado del día
  if (closedToday && !openEntry) {
    return shell(`
      <div class="card" style="text-align:center;">
        <div style="font-size:32px;margin-bottom:10px;">✅</div>
        <div style="font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.3px;">Jornada de hoy ya fichada</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:8px;">${closedToday.timeIn} – ${closedToday.timeOut} · ${closedToday.km} km</div>
        <div style="font-size:12px;color:var(--mutedFaint);margin-top:10px;">Vuelve mañana para iniciar la siguiente jornada.</div>
      </div>` + historyLink);
  }
  if (!openEntry) {
    return shell(`
      <button onclick="window.__kioskStep='start'; window.__kioskPhotoDraft=null; renderTab();"
        style="width:100%;padding:40px 20px;border-radius:16px;border:none;background:var(--primary);color:var(--primary-text);cursor:pointer;">
        <div style="font-size:40px;margin-bottom:10px;">▶</div>
        <div style="font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.4px;">Iniciar jornada</div>
        <div style="font-size:12.5px;opacity:.85;margin-top:6px;">Foto del tacógrafo + km inicial</div>
      </button>` + historyLink);
  } else {
    return shell(`
      <div class="card" style="margin-bottom:18px;text-align:center;">
        <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">Jornada en curso</div>
        <div style="font-family:var(--display);font-size:24px;">Iniciada a las ${openEntry.timeIn}</div>
        <div style="font-size:12.5px;color:var(--mutedFaint);margin-top:4px;">Km inicial: ${openEntry.kmStart}</div>
      </div>
      <button onclick="window.__kioskStep='close'; window.__kioskPhotoDraft=null; renderTab();"
        style="width:100%;padding:40px 20px;border-radius:16px;border:none;background:var(--danger);color:#fff;cursor:pointer;">
        <div style="font-size:40px;margin-bottom:10px;">⏹</div>
        <div style="font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.4px;">Cerrar jornada</div>
        <div style="font-size:12.5px;opacity:.85;margin-top:6px;">Foto del tacógrafo + km final</div>
      </button>` + historyLink);
  }
}

async function addKioskPhoto(file){
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Solo se admiten imágenes.'); return; }
  const path = `fichajes/${nextId()}-${file.name}`;
  const { error } = await supabaseClient.storage.from(DOCS_BUCKET).upload(path, file);
  if (error) { alert('No se pudo subir la foto.'); return; }
  const url = await signedUrl(path);
  window.__kioskPhotoDraft = { name: file.name, storage_path: path, url };
  document.getElementById('ks-photo-preview').innerHTML = `✅ Foto tomada <span style="color:var(--mutedFaint);">(toca para repetirla)</span>`;
}
async function submitKioskStart(driverId){
  const km = document.getElementById('ks-km').value;
  const errEl = document.getElementById('ks-error');
  if (km === '') { errEl.textContent = 'Indica el km inicial.'; return; }
  if (!window.__kioskPhotoDraft) { errEl.textContent = 'Haz la foto del tacógrafo antes de confirmar.'; return; }
  if (openTodayEntry(driverId)) { errEl.textContent = 'Ya hay una jornada abierta hoy.'; return; }
  if (dailyEntries.some(f=>f.driverId===driverId && f.date===today() && f.status==='cerrada')) { errEl.textContent = 'Hoy ya has fichado una jornada completa.'; return; }
  const timeIn = new Date().toTimeString().slice(0,5);
  const { data, error } = await supabaseClient.from('daily_entries').insert({
    driver_id: driverId, date: today(), status: 'abierta', time_in: timeIn,
    km_start: Number(km), photo_in_path: window.__kioskPhotoDraft.storage_path,
  }).select().single();
  if (error || !data) { errEl.textContent = 'No se pudo guardar.'; return; }
  dailyEntries.push({
    id: data.id, driverId, date: today(), status: 'abierta',
    timeIn, timeOut: null, kmStart: Number(km), kmEnd: null, km: null,
    photoIn: window.__kioskPhotoDraft, photoOut: null,
  });
  window.__kioskStep = 'home'; renderTab();
}
async function submitKioskClose(driverId){
  const km = document.getElementById('ks-km').value;
  const errEl = document.getElementById('ks-error');
  const entry = openTodayEntry(driverId);
  if (!entry) { errEl.textContent = 'No hay ninguna jornada abierta.'; return; }
  if (km === '') { errEl.textContent = 'Indica el km final.'; return; }
  if (Number(km) < entry.kmStart) { errEl.textContent = 'El km final no puede ser menor que el inicial.'; return; }
  if (!window.__kioskPhotoDraft) { errEl.textContent = 'Haz la foto del tacógrafo antes de confirmar.'; return; }
  const timeOut = new Date().toTimeString().slice(0,5);
  const kmEnd = Number(km);
  const kmTotal = Math.round((kmEnd - entry.kmStart)*10)/10;
  await supabaseClient.from('daily_entries').update({
    time_out: timeOut, km_end: kmEnd, km: kmTotal, status: 'cerrada', photo_out_path: window.__kioskPhotoDraft.storage_path,
  }).eq('id', entry.id);
  entry.timeOut = timeOut;
  entry.kmEnd = kmEnd;
  entry.km = kmTotal;
  entry.photoOut = window.__kioskPhotoDraft;
  entry.status = 'cerrada';
  const { year: wYear, week: wWeek } = getISOWeek(entry.date);
  await recalcWeeksFromFichajes(driverId, wYear);
  window.__autonomosYear = wYear;
  window.__autonomosMonth = weekMonth(wYear, wWeek);
  // Cerrar la jornada no es lo mismo que salir del kiosco: una cuenta de
  // solo conductor nunca debe acabar viendo el panel completo de
  // Autónomos (con el resto de conductores y sus tarifas) — se queda en
  // su pantalla de fichaje. Solo el personal que abrió el kiosco desde
  // dentro del panel ("📱 Pantalla de fichaje") vuelve a su vista normal.
  if (isDriverOnlyAccount()) { window.__kioskStep = 'home'; renderTab(); }
  else closeKiosk();
}
async function deleteFichaje(id){
  const f = dailyEntries.find(x=>x.id===id);
  await supabaseClient.from('daily_entries').delete().eq('id', id);
  dailyEntries = dailyEntries.filter(f=>f.id!==id);
  if (f) {
    const { year, week } = getISOWeek(f.date);
    await recalcWeeksFromFichajes(f.driverId, year, { year, week });
  }
  renderTab();
}

async function submitAddFichaje(driverId){
  const errEl = document.getElementById('af-error');
  const btn = document.getElementById('af-submit-btn');
  errEl.textContent = '';
  const date = document.getElementById('af-date').value;
  const timeIn = document.getElementById('af-timein').value;
  const timeOut = document.getElementById('af-timeout').value || null;
  const kmStartRaw = document.getElementById('af-kmstart').value;
  const kmEndRaw = document.getElementById('af-kmend').value;
  if (!date) { errEl.textContent = 'Indica la fecha.'; return; }
  if (!timeIn) { errEl.textContent = 'Indica la hora de entrada.'; return; }
  if (kmStartRaw === '') { errEl.textContent = 'Indica el km inicial.'; return; }
  if (dailyEntries.some(f=>f.driverId===driverId && f.date===date)) { errEl.textContent = 'Ya existe un fichaje de este conductor en esa fecha. Corrígelo desde la tabla en vez de crear otro.'; return; }

  const status = (timeOut && kmEnd != null) ? 'cerrada' : 'abierta';

      km_start: kmStart, km_end: kmEnd, km,

    if (error) throw error;

async function recalcWeeksFromFichajes(driverId, year, touchedWeek){
  const fichajes = dailyEntries.filter(f=>f.driverId===driverId && f.status==='cerrada');
  const byWeek = {};
  fichajes.forEach(f => {
    const { year: y, week } = getISOWeek(f.date);
    const key = y+'-'+week;
    if (!byWeek[key]) byWeek[key] = { year: y, week, days: 0, daysCount: 0, km: 0, hours: 0, manualAmount: 0 };
    // Cada día puede excluirse por partes (días trabajados, km, horas —
    // p.ej. una jornada parcial donde solo interesa excluir las horas) más
    // un importe manual opcional que se suma siempre al ingreso, se haya
    // excluido algo o no. "days" son los días que cuentan para el €/día
    // (los no excluidos); "daysCount" son las jornadas que se muestran como
    // trabajadas — incluye también los días excluidos que llevan un importe
    // manual, para que la semana refleje los días realmente trabajados.
    const eff = effectiveDayValues(f);
    if (!f.excludeDays) byWeek[key].days += 1;
    if (!f.excludeDays || f.manualAmount) byWeek[key].daysCount += 1;
    if (!f.excludeKm) byWeek[key].km += eff.km;
    if (!f.excludeHours) byWeek[key].hours += eff.hours;
    byWeek[key].manualAmount += Number(f.manualAmount||0);
  });
  const rows = Object.values(byWeek).map(w => ({
    driver_id: driverId, year: w.year, week: w.week,
    days_worked: w.days, days_count: w.daysCount, km: Math.round(w.km*10)/10, hours: Math.round(w.hours*100)/100,
    manual_amount: Math.round(w.manualAmount*100)/100,
  }));
  if (rows.length) {
    await supabaseClient.from('weekly_entries').upsert(rows, { onConflict: 'driver_id,year,week' });
  }
  // Si la semana que se acaba de tocar (borrar/editar un fichaje) se ha
  // quedado sin ningún fichaje cerrado, su fila en weekly_entries no
  // aparece en byWeek y el upsert de arriba nunca la toca — se queda
  // como un resto fantasma con datos viejos si no se borra aquí.
  if (touchedWeek && !byWeek[touchedWeek.year+'-'+touchedWeek.week]) {
    await supabaseClient.from('weekly_entries').delete()
      .eq('driver_id', driverId).eq('year', touchedWeek.year).eq('week', touchedWeek.week);
  }
  // Sin semana concreta (botón "Recalcular semanas"): repaso completo
  // del año — cualquier semana ya guardada que ya no tenga ningún
  // fichaje cerrado detrás se borra, para limpiar restos fantasma
  // acumulados antes de este arreglo.
  if (!touchedWeek) {
    const orphaned = weeklyEntries.filter(e => e.driverId===driverId && e.year===year && !byWeek[e.year+'-'+e.week]);
    for (const e of orphaned) {
      await supabaseClient.from('weekly_entries').delete()
        .eq('driver_id', driverId).eq('year', e.year).eq('week', e.week);
    }
  }
  await loadWeeklyEntries();
  window.__autonomosYear = year;
  renderTab();
}

const PERM_ROLES = {
  admin: { label: 'Administrador', hint: 'Ve y puede hacerlo todo, incluida esta pantalla.' },
  organizador: { label: 'Organizador de almacén', tabs: ['clientes','citas','documentos'], schedule: true, hint: 'Gestiona el día a día del almacén: clientes, franjas y documentos, y puede cambiar el horario.' },
  trafico: { label: 'Tráfico', tabs: ['trafico','autonomos','fichajes'], hint: 'Tráfico (DECA), autónomos y fichajes.' },
  administracion: { label: 'Administración', tabs: ['administracion'], hint: 'Contactos, direcciones y flota.' },

  custom: { label: 'Personalizado', hint: 'Elige a mano qué módulos ve.' },
};
function permState(p){ return { isAdmin: !!p.isAdmin, allowedTabs: (p.allowedTabs||[]).slice(), canEditSchedule: !!p.canEditSchedule, driverId: p.driverId || null }; }
function permDetectRole(s){
  if (s.isAdmin) return 'admin';
  const tabs = [...s.allowedTabs].sort().join(',');
  if (!tabs && (s.driverId || s.wantsFichaje)) return 'fichaje';
  for (const k of ['organizador','trafico','administracion']) {
    const r = PERM_ROLES[k];
    if ([...r.tabs].sort().join(',') === tabs && !!r.schedule === !!s.canEditSchedule) return k;
  }
  return 'custom';
}
function permRoleLabel(s){
  const role = permDetectRole(s);
  return role === 'custom' && !s.allowedTabs.length ? 'Sin permisos' : PERM_ROLES[role].label;
}
function permApplyRole(d, role){
  d.isAdmin = role === 'admin';
  const r = PERM_ROLES[role];
  if (r && r.tabs) { d.allowedTabs = r.tabs.slice(); d.canEditSchedule = !!r.schedule; }
}
function permModuleGroups(){
  const groups = [];
  TABS.forEach(t => {
    let g = groups.find(x => x.name === t.group);
    if (!g) { g = { name: t.group, items: [] }; groups.push(g); }
    g.items.push(t);
  });
  return groups;
}
function permHasTab(s, id){ return s.isAdmin || s.allowedTabs.includes(id); }
// El módulo "administracion" da acceso a Contactos, Direcciones y Flota.
function permLabel(t){ return t.id === 'administracion' ? 'Administración' : t.label; }
function permDesc(t){ return t.id === 'administracion' ? 'Contactos, direcciones y flota.' : ((HOME_MODULES[t.id]||{}).description || ''); }
function permAvatar(p, size){
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:var(--primary);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:${Math.round(size*0.42)}px;font-weight:700;flex-shrink:0;">${esc((p.email||'?').trim().charAt(0).toUpperCase())}</div>`;
}
function adminCurrentUser(){ return window.__adminUserId ? ALL_PROFILES.find(x=>x.id===window.__adminUserId) : null; }
function adminConfirmLeave(){
  if (window.__adminView === 'ficha' && window.__adminEditMode && window.__adminFormDirty) {
    return confirm('Tienes cambios sin guardar. ¿Seguro que quieres salir sin guardar?');

}

}

/* ---- historial de cambios de permisos ---- */
let adminHistorialCache = {};
let adminHistorialUnavailable = false;
async function loadAdminHistorial(profileId){
  const { data, error } = await supabaseClient.from('profile_historial').select('*').eq('profile_id', profileId).order('created_at', { ascending: false });
  adminHistorialUnavailable = !!error;
  return (data||[]).map(h => ({ id: h.id, createdAt: h.created_at, usuario: h.usuario || '', resumen: h.resumen }));
}
async function logAdminHistorial(profileId, resumen){
  if (!resumen) return;
  const usuario = currentUserEmail();
  const { data, error } = await supabaseClient.from('profile_historial').insert({ profile_id: profileId, usuario, resumen }).select().single();
  if (error || !data) return;
  adminHistorialCache[profileId] = [{ id: data.id, createdAt: data.created_at, usuario, resumen }, ...(adminHistorialCache[profileId]||[])];
}
function adminHistorialBodyHtml(){
  const h = window.__adminHistorial;
  if (adminHistorialUnavailable) return `<div style="color:var(--mutedFaint);font-size:12.5px;">El historial todavía no está activado: falta ejecutar en Supabase el SQL <b>permisos-historial-schema.sql</b>.</div>`;
  if (h === null || h === undefined) return `<div style="color:var(--mutedFaint);font-size:12.5px;">Cargando…</div>`;
  if (!h.length) return `<div style="color:var(--mutedFaint);font-size:12.5px;">Todavía no hay cambios registrados.</div>`;
  return h.map(x => `
    <div style="padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="font-size:11px;color:var(--mutedFaint);margin-bottom:3px;">${fmtDateHora(x.createdAt)}${x.usuario?' · '+esc(x.usuario):''}</div>
      <div style="font-size:12.5px;color:var(--text);white-space:pre-line;">${esc(x.resumen)}</div>
    </div>`).join('');
}
function adminChangeSummary(before, after){
  const lines = [];
  const rb = permRoleLabel(before), ra = permRoleLabel(after);
  if (rb !== ra) lines.push(`Rol: "${rb}" → "${ra}"`);
  const label = id => { const t = TABS.find(x=>x.id===id); return t ? permLabel(t) : id; };
  const added = after.allowedTabs.filter(t => !before.allowedTabs.includes(t)).map(label);
  const removed = before.allowedTabs.filter(t => !after.allowedTabs.includes(t)).map(label);
  if (added.length) lines.push(`Módulos añadidos: ${added.join(', ')}`);
  if (removed.length) lines.push(`Módulos quitados: ${removed.join(', ')}`);
  const sb = before.allowedTabs.includes('citas') && before.canEditSchedule, sa = after.allowedTabs.includes('citas') && after.canEditSchedule;
  if (sb !== sa) lines.push(`Puede editar el horario del almacén: ${sa ? 'sí' : 'no'}`);
  if ((before.driverId||null) !== (after.driverId||null)) {
    const nm = id => id ? driverLabel(drivers.find(d=>d.id===id) || { name: '—', companyId: null }) : '—';
    lines.push(`Conductor vinculado: "${nm(before.driverId)}" → "${nm(after.driverId)}"`);
  }
  return lines;
}

/* ---- ficha de usuario ---- */
function openAdminUser(id, keepNav){
  if (!keepNav) window.__adminNavIds = adminFilteredList().map(p=>p.id);
  window.__adminView = 'ficha';
  window.__adminUserId = id;
  window.__adminEditMode = false;
  window.__adminFormDirty = false;
  window.__adminDraft = null;
  window.__adminHistorial = adminHistorialCache[id] || null;
  renderHeader(); renderTab();
  window.scrollTo(0, 0);
  loadAdminHistorial(id).then(list => {
    adminHistorialCache[id] = list;
    if (window.__adminView === 'ficha' && window.__adminUserId === id) {
      window.__adminHistorial = list;
      const el = document.getElementById('admin-historial-body');
      if (el) el.innerHTML = adminHistorialBodyHtml();
    }
  });
}
function adminNavGoto(offset){
  const ids = window.__adminNavIds || [];
  const idx = ids.indexOf(window.__adminUserId);
  if (idx === -1 || !ids.length) return;
  if (!adminConfirmLeave()) return;
  openAdminUser(ids[(idx + offset + ids.length) % ids.length], true);
}
function adminEnterEdit(){
  const p = adminCurrentUser();
  if (!p) return;
  window.__adminDraft = permState(p);
  window.__adminEditMode = true;
  window.__adminFormDirty = false;
  renderTab();
}
function adminExitEdit(){
  if (!adminConfirmLeave()) return;
  window.__adminEditMode = false;
  window.__adminFormDirty = false;
  window.__adminDraft = null;
  renderTab();
}
function adminDraftRole(role){ permApplyRole(window.__adminDraft, role); window.__adminDraft.wantsFichaje = role === 'fichaje'; window.__adminFormDirty = true; renderTab(); }
function adminDraftTab(tabId, checked){
  const d = window.__adminDraft;
  d.wantsFichaje = false;
  d.allowedTabs = checked ? [...new Set([...d.allowedTabs, tabId])] : d.allowedTabs.filter(t => t !== tabId);
  if (tabId === 'citas' && !checked) d.canEditSchedule = false;
  window.__adminFormDirty = true; renderTab();
}
function adminDraftSchedule(checked){ window.__adminDraft.canEditSchedule = checked; window.__adminFormDirty = true; renderTab(); }
function adminDraftDriver(id){ window.__adminDraft.driverId = id || null; window.__adminFormDirty = true; renderTab(); }
async function adminSaveUser(){
  const p = adminCurrentUser(), d = window.__adminDraft;
  const errEl = document.getElementById('admin-error');
  if (!p || !d) return;
  if (errEl) errEl.textContent = '';
  if (permDetectRole(d) === 'fichaje' && !d.driverId) { showFormError(errEl, 'Un usuario "solo fichaje" necesita un conductor vinculado.'); return; }
  if (p.id === CURRENT_USER_ID && p.isAdmin && !d.isAdmin && !confirm('Te vas a quitar a ti mismo el permiso de administrador y perderás el acceso a esta pantalla. ¿Seguro?')) return;
  const update = { is_admin: d.isAdmin, allowed_tabs: d.allowedTabs, can_edit_schedule: d.allowedTabs.includes('citas') ? d.canEditSchedule : false, driver_id: d.driverId };
  const btns = [...document.querySelectorAll('.admin-save-btn')];
  btns.forEach(b => b.disabled = true);
  const { data, error } = await supabaseClient.from('profiles').update(update).eq('id', p.id).select();
  if (error || !data || !data.length) {
    showFormError(errEl, 'No se pudo guardar: ' + (error && error.message ? error.message : 'sin permiso.'));
    btns.forEach(b => b.disabled = false);
    return;
  }
  const before = permState(p);
  const after = { ...d, canEditSchedule: update.can_edit_schedule };
  const lines = adminChangeSummary(before, after);
  if (lines.length) await logAdminHistorial(p.id, lines.join('\n'));
  Object.assign(p, { isAdmin: d.isAdmin, allowedTabs: d.allowedTabs.slice(), canEditSchedule: update.can_edit_schedule, driverId: d.driverId });
  if (p.id === CURRENT_USER_ID) Object.assign(PROFILE, { isAdmin: p.isAdmin, allowedTabs: p.allowedTabs.slice(), canEditSchedule: p.canEditSchedule, driverId: p.driverId });
  window.__adminHistorial = adminHistorialCache[p.id] || window.__adminHistorial;
  window.__adminEditMode = false;
  window.__adminFormDirty = false;
  window.__adminDraft = null;
  renderTab();
}

    document.getElementById('wh-title-row').innerHTML = '';

    return;
  }

  await Promise.all([loadWarehouseModuleData(), loadAutonomosModuleData(), loadDecaDocuments(), loadContactos(), loadDirecciones(), loadFlota()]);
  await autoCloseStaleFichajes();
  // Si el usuario recarga la página sin haber cerrado sesión, se queda en
  // la misma pestaña (y almacén) donde estaba, en vez de volver a Inicio.
  // Tras un login nuevo (después de cerrar sesión) no hay nada guardado
  // — ahí sí se entra siempre en la pantalla de inicio, como hasta ahora.
  const allowed = visibleTabs().map(t=>t.id);
  const last = readLastTab();
  if (last && last.tab && (last.tab === 'inicio' || allowed.includes(last.tab))) {
    currentTab = last.tab;
    if (last.warehouseId && WAREHOUSES.some(w=>w.id===last.warehouseId)) currentWarehouseId = last.warehouseId;
  } else {
    currentTab = allowed.length ? 'inicio' : null;
  }
  document.getElementById('app-root').style.display = '';
  if (currentTab) { renderHeader(); renderTab(); }
  else { document.getElementById('tab-content').innerHTML = '<div class="card" style="text-align:center;color:var(--mutedFaint);padding:32px;">Tu cuenta todavía no tiene ninguna pestaña activada. Contacta con el administrador.</div>'; }
})();

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') window.location.href = 'index.html';
  if (event === 'PASSWORD_RECOVERY') { isRecoveryFlow = true; window.location.href = 'reset-password.html'; }
});
</script>
</body>
</html>
