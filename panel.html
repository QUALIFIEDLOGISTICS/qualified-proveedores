// Una fila por camión del día (hora y duración de cada uno). Al cambiar el
// número de camiones se conservan los valores ya elegidos; los nuevos
// empiezan justo cuando acaba el anterior.
function renderQuickTruckRows(){
  const box = document.getElementById('qu-trucks');
  if (!box) return;
  const count = Math.max(0, Math.min(20, parseInt(document.getElementById('qu-count').value, 10) || 0));
  const times = quickCreateTimeOptions();
  if (!times.length) { box.innerHTML = '<div style="color:var(--danger);font-size:12.5px;">El almacén no tiene ningún horario abierto.</div>'; return; }
  const prev = [];
  for (let i = 0; i < count; i++) {
    const s = document.getElementById('qu-t-start-' + i), d = document.getElementById('qu-t-dur-' + i);
    prev.push(s && d ? { start: s.value, dur: d.value } : null);
  }
  let nextMin = times.includes(480) ? 480 : times[0];
  const rows = [];
  for (let i = 0; i < count; i++) {
    let start, dur;
    if (prev[i]) { start = prev[i].start; dur = prev[i].dur; }
    else {
      dur = i > 0 ? rows[i-1].dur : '60';
      const m = times.includes(nextMin) ? nextMin : (times.find(t => t >= nextMin) ?? times[times.length - 1]);
      start = minToTime(m);
    }
    rows.push({ start, dur });
    nextMin = timeToMin(start) + Number(dur);
  }
  box.innerHTML = rows.map((r, i) => `
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="width:62px;flex-shrink:0;font-size:12.5px;color:var(--muted);font-weight:600;">Camión ${i+1}</div>
      <div class="field" style="flex:1;">
        <select id="qu-t-start-${i}" onchange="refreshQuickCreatePreview()">${times.map(m => `<option value="${minToTime(m)}" ${minToTime(m)===r.start?'selected':''}>${minToTime(m)}</option>`).join('')}</select>
      </div>
      <div class="field" style="flex:1;">
        <select id="qu-t-dur-${i}" onchange="refreshQuickCreatePreview()">
          <option value="30" ${r.dur==='30'?'selected':''}>30 min</option>
          <option value="60" ${r.dur==='60'?'selected':''}>1 hora</option>
          <option value="120" ${r.dur==='120'?'selected':''}>2 horas</option>
        </select>
      </div>
    </div>`).join('');
}
// Calcula qué se va a crear. Sin hora: `count` camiones sueltos por día. Con
// hora: una reserva por cada camión del día, con la hora y duración que se
// haya puesto a cada uno; cada una se comprueba contra el horario de ESE día
// y contra las reservas que ya hay (máximo LANES a la vez), y las que no
// caben se omiten y se cuentan aparte.
function quickCreatePlan(){
  const from = document.getElementById('qu-from').value;
  const to = document.getElementById('qu-to').value;
  const count = Math.max(0, Math.min(20, parseInt(document.getElementById('qu-count').value, 10) || 0));
  const weekdays = [...document.querySelectorAll('.qu-day:checked')].map(el=>Number(el.value));
  const withTime = document.getElementById('qu-mode').value === 'conhora';
  const dates = []; let closedSkipped = 0; let tooLong = false;
  if (from && to && from <= to) {
    const d = new Date(from + 'T00:00:00');
    const last = new Date(to + 'T00:00:00');
    for (let i = 0; d <= last; i++, d.setDate(d.getDate()+1)) {
      if (i >= 92) { tooLong = true; break; }
      if (!weekdays.includes(d.getDay())) continue;
      const ds = toDateStr(d);
      if (!daySchedule(currentWarehouseId, ds).open) { closedSkipped++; continue; }
      dates.push(ds);
    }
  }
  const plan = { dates, count, closedSkipped, tooLong, withTime, valid: !!(from && to && from <= to), items: [], skippedFit: 0, skippedFull: 0 };
  if (!withTime) {
    dates.forEach(date => { for (let i = 0; i < count; i++) plan.items.push({ date }); });
    return plan;
  }
  const trucks = [];
  for (let i = 0; i < count; i++) {
    const s = document.getElementById('qu-t-start-' + i), d = document.getElementById('qu-t-dur-' + i);
    if (s && s.value) trucks.push({ min: timeToMin(s.value), dur: Number(d && d.value) || 60 });
  }
  if (!trucks.length) return plan;
  dates.forEach(date => {
    const sched = daySchedule(currentWarehouseId, date);
    const busy = appointments[currentWarehouseId].filter(a => a.date === date).map(a => ({ s: timeToMin(a.start), e: timeToMin(a.start) + a.duration }));
    trucks.forEach(t => {
      const s = t.min, e = s + t.dur;
      if (!fitsInARange(sched.ranges, s, e)) { plan.skippedFit++; return; }
      const overlap = busy.filter(b => s < b.e && e > b.s).length;
      if (overlap >= LANES) { plan.skippedFull++; return; }
      busy.push({ s, e });
      plan.items.push({ date, start: minToTime(s), duration: t.dur });
    });
  });
  return plan;
}
function refreshQuickCreatePreview(){
  document.querySelectorAll('.qu-day').forEach(el => {
    const lbl = el.parentElement;
    lbl.style.background = el.checked ? 'var(--primary)' : 'var(--panel2)';
    lbl.style.color = el.checked ? 'var(--primary-text)' : 'var(--text)';
    lbl.style.borderColor = el.checked ? 'var(--primary)' : 'var(--border)';
  });
  const hourBox = document.getElementById('qu-hour-box');
  if (hourBox) hourBox.style.display = document.getElementById('qu-mode').value === 'conhora' ? 'block' : 'none';
  const plan = quickCreatePlan();
  const total = plan.items.length;
  const btn = document.getElementById('qu-submit');
  const word = plan.withTime ? ['reserva','reservas'] : ['camión','camiones'];
  let msg;
  if (!plan.valid) msg = 'Elige un rango de fechas válido.';
  else if (!plan.dates.length) msg = 'Ningún día del rango coincide con los días marcados y con el almacén abierto.';
  else if (!total) msg = 'No se puede crear ninguna con esa hora: no cabe en el horario de esos días o las franjas ya están llenas.';
  else msg = `Se crearán <b>${total}</b> ${total!==1?word[1]:word[0]}: ${plan.count} al día durante ${plan.dates.length} día${plan.dates.length!==1?'s':''}.`;
  if (plan.valid && plan.dates.length) {
    if (plan.closedSkipped) msg += ` (${plan.closedSkipped} día${plan.closedSkipped!==1?'s':''} con el almacén cerrado omitido${plan.closedSkipped!==1?'s':''}.)`;
    if (plan.skippedFit) msg += ` <span style="color:var(--danger);">${plan.skippedFit} omitida${plan.skippedFit!==1?'s':''} por no caber en el horario del día.</span>`;
    if (plan.skippedFull) msg += ` <span style="color:var(--danger);">${plan.skippedFull} omitida${plan.skippedFull!==1?'s':''} porque ya hay ${LANES} camiones a esa hora.</span>`;
    if (plan.tooLong) msg += ' Solo se cubren los primeros 92 días.';
  }
  document.getElementById('qu-preview').innerHTML = msg;
  if (btn) {
    btn.disabled = !document.getElementById('qu-client').value || !total || total > QUICK_UNSCHED_MAX_ROWS;
    btn.textContent = total ? `Crear ${total}` : 'Crear';
  }
  if (total > QUICK_UNSCHED_MAX_ROWS) document.getElementById('qu-preview').innerHTML += ` <span style="color:var(--danger);">Máximo ${QUICK_UNSCHED_MAX_ROWS} de una vez.</span>`;
}
async function submitQuickCreate(){
  const errEl = document.getElementById('qu-error');
  errEl.textContent = '';
  const clientId = document.getElementById('qu-client').value;
  const plan = quickCreatePlan();
  if (!clientId || !plan.items.length) return;
  const type = document.getElementById('qu-type').value;
  const notes = document.getElementById('qu-notes').value.trim();
  if (plan.items.length > QUICK_UNSCHED_MAX_ROWS) return;
  const common = { warehouse_id: currentWarehouseId, client_id: clientId, status: 'planificado', carrier: '', plate: '', trailer_plate: '', cargo_ref: '', type, notes };
  const btn = document.getElementById('qu-submit');
  btn.disabled = true;
  let error;
  if (plan.withTime) {
    const rows = plan.items.map(it => ({ ...common, date: it.date, start_time: it.start, duration_min: it.duration }));
    ({ error } = await supabaseClient.from('appointments').insert(rows));
  } else {
    const rows = plan.items.map(it => ({ ...common, date: it.date }));
    ({ error } = await supabaseClient.from('unscheduled_trucks').insert(rows));
  }
  if (error) { errEl.textContent = 'No se pudo guardar: ' + (error.message || 'error desconocido.'); btn.disabled = false; return; }
  await Promise.all([loadAppointments(), loadUnscheduled()]);
  closeModal(); renderTab();
}

function renderAttachmentList(){

  el.innerHTML = list.length === 0
    ? `<div style="font-size:11.5px;color:var(--mutedFaint);">Sin documentos adjuntos.</div>`
    : list.map(a => `

async function addAttachmentFiles(fileList){
  const files = Array.from(fileList || []);
  for (const file of files) {
    if (file.type !== 'application/pdf') { alert(`"${file.name}" no es un PDF.`); continue; }
    if (file.size > MAX_ATTACHMENT_MB*1024*1024) { alert(`"${file.name}" pesa demasiado (máx ${MAX_ATTACHMENT_MB}MB).`); continue; }
    const draftId = nextId();
    const path = `attachments/${draftId}-${file.name}`;
    const { error } = await supabaseClient.storage.from(DOCS_BUCKET).upload(path, file);
    if (error) { alert(`No se pudo subir "${file.name}".`); continue; }
    const url = await signedUrl(path);
    window.__attachmentsDraft.push({ id: draftId, name: file.name, size: file.size, storage_path: path, url });
    renderAttachmentList();
  }
  const input = document.getElementById('att-file-input');
  if (input) input.value = '';
}
async function removeAttachmentDraft(id){
  const a = (window.__attachmentsDraft||[]).find(x=>x.id===id);
  if (a && a.storage_path) await supabaseClient.storage.from(DOCS_BUCKET).remove([a.storage_path]);
  window.__attachmentsDraft = window.__attachmentsDraft.filter(x=>x.id!==id);
  renderAttachmentList();
}

async function unassignTime(id){
  const appt = appointments[currentWarehouseId].find(a=>a.id===id);
  if (!appt) return;
  const { data: row, error } = await supabaseClient.from('unscheduled_trucks').insert({
    warehouse_id: currentWarehouseId, client_id: appt.clientId, date: appt.date, status: appt.status,
    carrier: appt.carrier, plate: appt.plate, trailer_plate: appt.trailerPlate,
    cargo_ref: appt.cargoRef, type: appt.type, notes: appt.notes,
  }).select().single();
  if (error || !row) return;
  if ((appt.attachments||[]).length) {
    await supabaseClient.from('attachments').insert(appt.attachments.map(a => ({
      parent_type: 'unscheduled', parent_id: row.id, name: a.name, storage_path: a.storage_path, size: a.size,
    })));
  }
  await supabaseClient.from('attachments').delete().eq('parent_type','appointment').eq('parent_id', id);
  await supabaseClient.from('appointments').delete().eq('id', id);
  await Promise.all([loadAppointments(), loadUnscheduled()]);
  closeModal(); renderTab();
}
function refreshAppointmentTimeOptions(){
  const dateVal = document.getElementById('af-date').value;
  const sched = daySchedule(currentWarehouseId, dateVal);
  const startSel = document.getElementById('af-start');
  const prevVal = startSel.value;
  if (!sched.open) {
    startSel.innerHTML = `<option value="">Almacén cerrado ese día</option>`;
    startSel.disabled = true;
    return;
  }
  startSel.disabled = false;
  startSel.innerHTML = slotTimes(sched.ranges).map(m=>`<option value="${minToTime(m)}" ${minToTime(m)===prevVal?'selected':''}>${minToTime(m)}</option>`).join('');
}
async function submitAppointment(editId){
  const clientId = document.getElementById('af-client').value;
  const date = document.getElementById('af-date').value;
  const start = document.getElementById('af-start').value;
  const duration = Number(document.getElementById('af-duration').value);
  const errEl = document.getElementById('af-error');
  const startMin = timeToMin(start);
  const endMin = startMin + duration;

  const sched = daySchedule(currentWarehouseId, date);
  if (!sched.open) { errEl.textContent = 'El almacén está cerrado ese día. Elige otro.'; return; }
  if (!fitsInARange(sched.ranges, startMin, endMin)) { errEl.textContent = `Esa franja no cabe dentro del horario del día (${scheduleLabel(sched)}). No se puede reservar cruzando una pausa.`; return; }

  const dayAppts = appointments[currentWarehouseId].filter(a => a.date === date && a.id !== editId);
  const overlapCount = dayAppts.filter(a => {
    const aStart = timeToMin(a.start), aEnd = aStart + a.duration;
    return startMin < aEnd && endMin > aStart;
  }).length;
  if (overlapCount >= LANES) { errEl.textContent = `Ya hay ${LANES} camiones reservados en ese horario. Elige otra franja.`; return; }

  const data = {
    warehouse_id: currentWarehouseId, client_id: clientId, date, start_time: start, duration_min: duration,
    status: editId ? document.getElementById('af-status').value : 'planificado',
    carrier: document.getElementById('af-carrier').value.trim(),
    plate: document.getElementById('af-plate').value.trim(),
    trailer_plate: document.getElementById('af-trailer').value.trim(),
    cargo_ref: document.getElementById('af-cargoref').value.trim(),
    type: document.getElementById('af-type').value,
    notes: document.getElementById('af-notes').value.trim(),
  };

  let id = editId;
  if (editId) {
    await supabaseClient.from('appointments').update(data).eq('id', editId);
  } else {
    const { data: row, error } = await supabaseClient.from('appointments').insert(data).select().single();
    if (error || !row) { errEl.textContent = 'No se pudo guardar.'; return; }
    id = row.id;
  }
  await syncAttachments('appointment', id);
  const fromUnsched = document.getElementById('af-from-unscheduled')?.value;
  if (fromUnsched) {
    await supabaseClient.from('attachments').delete().eq('parent_type','unscheduled').eq('parent_id', fromUnsched);
    await supabaseClient.from('unscheduled_trucks').delete().eq('id', fromUnsched);
  }
  await Promise.all([loadAppointments(), loadUnscheduled()]);
  window.__citasDate = date; // saltar a ver el día donde ha quedado la reserva
  closeModal(); renderTab();
}

function tplDocumentos(){
  const filter = window.__docFilter || 'todos';
  const typeFilter = window.__docTypeFilter || 'todos';
  const search = (window.__docSearch || '').toLowerCase();
  if (window.__docRangeFrom === undefined) window.__docRangeFrom = today();
  if (window.__docRangeTo === undefined) { const d = new Date(today()+'T00:00:00'); d.setDate(d.getDate()+7); window.__docRangeTo = toDateStr(d); }
  const rangeMode = window.__docRangeMode || '7dias';

  const schedRows = appointments[currentWarehouseId].map(a => ({
    kind: 'appt', id: a.id, date: a.date, time: a.start, clientId: a.clientId,
    type: a.type, status: a.status || 'planificado', attachments: a.attachments || [],
  }));
  const unschedRows = unscheduled[currentWarehouseId].map(u => ({
    kind: 'unsched', id: u.id, date: u.date, time: null, clientId: u.clientId,
    type: u.type, status: u.status || 'planificado', attachments: u.attachments || [],
  }));
  let rows = [...schedRows, ...unschedRows];

  if (rangeMode !== 'todos') {
    if (window.__docRangeFrom) rows = rows.filter(r => r.date >= window.__docRangeFrom);
    if (window.__docRangeTo) rows = rows.filter(r => r.date <= window.__docRangeTo);
  }
  if (filter === 'con') rows = rows.filter(r => r.attachments.length > 0);
  if (filter === 'sin') rows = rows.filter(r => r.attachments.length === 0);
  if (typeFilter !== 'todos') rows = rows.filter(r => r.type === typeFilter);
  if (search) rows = rows.filter(r => clientName(r.clientId).toLowerCase().includes(search));

  rows.sort((a,b) => (a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));

  const inRange = rangeMode === 'todos' ? [...schedRows, ...unschedRows] : [...schedRows, ...unschedRows].filter(r =>
    (!window.__docRangeFrom || r.date >= window.__docRangeFrom) && (!window.__docRangeTo || r.date <= window.__docRangeTo));
  const countCon = inRange.filter(r=>r.attachments.length>0).length;
  const countSin = inRange.filter(r=>r.attachments.length===0).length;
  const countEntradas = inRange.filter(r=>r.type==='descarga').length;
  const countSalidas = inRange.filter(r=>r.type==='carga').length;

  return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn ${rangeMode==='hoy'?'btn-primary':'btn-ghost'}" onclick="setDocRange('hoy')">Hoy</button>
      <button class="btn ${rangeMode==='7dias'?'btn-primary':'btn-ghost'}" onclick="setDocRange('7dias')">Próximos 7 días</button>
      <button class="btn ${rangeMode==='30dias'?'btn-primary':'btn-ghost'}" onclick="setDocRange('30dias')">Próximos 30 días</button>
      <button class="btn ${rangeMode==='todos'?'btn-primary':'btn-ghost'}" onclick="setDocRange('todos')">Todos los días</button>
      <span style="color:var(--mutedFaint);font-size:12px;">o rango personalizado:</span>
      <input type="date" value="${window.__docRangeFrom}" onchange="window.__docRangeFrom=this.value; window.__docRangeMode='custom'; renderTab();" style="width:150px;" />
      <span style="color:var(--mutedFaint);">–</span>
      <input type="date" value="${window.__docRangeTo}" onchange="window.__docRangeTo=this.value; window.__docRangeMode='custom'; renderTab();" style="width:150px;" />
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">
      ${rangeMode==='todos' ? 'Mostrando todos los días registrados.' : `Mostrando del ${fmtDate(window.__docRangeFrom)} al ${fmtDate(window.__docRangeTo)}.`}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn ${filter==='todos'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='todos'; renderTab();">Todos (${inRange.length})</button>
      <button class="btn ${filter==='sin'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='sin'; renderTab();">📄 Sin adjunto (${countSin})</button>
      <button class="btn ${filter==='con'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='con'; renderTab();">📎 Con adjunto (${countCon})</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="btn ${typeFilter==='todos'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='todos'; renderTab();">Cargas y descargas</button>
      <button class="btn ${typeFilter==='descarga'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='descarga'; renderTab();">⬇ Descargas (${countEntradas})</button>
      <button class="btn ${typeFilter==='carga'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='carga'; renderTab();">⬆ Cargas (${countSalidas})</button>
      <div style="flex:1;min-width:160px;"><input placeholder="Buscar por cliente…" value="${esc(window.__docSearch||'')}" onkeyup="window.__docSearch=this.value; renderTab();" /></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table><thead><tr>${thSort('Fecha','date')}${thSort('Hora','text')}${thSort('Cliente','text')}${thSort('Tipo','text')}${thSort('Estado','text')}${thSort('Adjuntos','number')}</tr></thead><tbody>
        ${rows.map(r => `
          <tr onclick="openFromDocumentos('${r.kind}','${r.id}','${r.date}')" style="cursor:pointer;">
            <td data-sort-value="${esc(r.date||'')}">${fmtDate(r.date)}</td>
            <td style="color:var(--muted);">${r.time || '<span style="color:var(--mutedFaint);">sin hora</span>'}</td>
            <td>${esc(clientName(r.clientId))}</td>
            <td style="text-transform:capitalize;color:var(--muted);">${esc(r.type)}</td>
            <td><span style="text-transform:capitalize;color:${APPT_STATUS_COLORS[r.status]};font-weight:600;font-size:12px;">${esc(r.status)}</span></td>
            <td data-sort-value="${r.attachments.length}">${r.attachments.length ? `<span style="color:var(--primary);">📎 ${r.attachments.length}</span>` : `<span style="color:var(--mutedFaint);">— sin adjuntar</span>`}</td>
          </tr>`).join('') || `<tr><td colspan="6" style="color:var(--mutedFaint);text-align:center;padding:24px;">Sin resultados en este rango de fechas</td></tr>`}
      </tbody></table>
    </div>`;
}
function setDocRange(mode){
  window.__docRangeMode = mode;
  if (mode === 'hoy') { window.__docRangeFrom = today(); window.__docRangeTo = today(); }
  else if (mode === '7dias' || mode === '30dias') {
    window.__docRangeFrom = today();
    const d = new Date(today()+'T00:00:00'); d.setDate(d.getDate() + (mode==='7dias'?7:30));
    window.__docRangeTo = toDateStr(d);
  }
  renderTab();
}

async function submitPallet(){
  const desc = document.getElementById('pf-desc').value.trim();
  const clientId = document.getElementById('pf-client').value;

  if(!desc || !clientId || qty<=0){ alert('Rellena cliente, mercancía y una cantidad válida.'); return; }
  const { data: row, error } = await supabaseClient.from('pallets').insert({
    warehouse_id: currentWarehouseId, client_id: clientId,
    reference: document.getElementById('pf-ref').value.trim(),
    description: desc, quantity: qty, unit: 'palets',

    status: 'en almacén', date_in: today(),
  }).select().single();

  await supabaseClient.from('movements').insert({
    warehouse_id: currentWarehouseId, pallet_id: row.id, client_id: clientId, type: 'entrada', quantity: qty, date: today(), ref: 'Alta de palet',
  });

async function submitSalida(palletId){
  const p = palletById(palletId);
  const qty = Number(document.getElementById('sf-qty').value||0);
  if(qty<=0 || qty>p.quantity){ alert('Cantidad no válida.'); return; }
  const newQty = p.quantity - qty;
  const newStatus = newQty<=0 ? 'salido' : p.status;
  await supabaseClient.from('pallets').update({ quantity: newQty, status: newStatus }).eq('id', palletId);
  await supabaseClient.from('movements').insert({
    warehouse_id: currentWarehouseId, pallet_id: palletId, client_id: p.clientId, type: 'salida', quantity: qty, date: today(),
    ref: document.getElementById('sf-ref').value.trim()||'—',
  });
  await Promise.all([loadPallets(), loadMovements()]);
  closeModal(); renderTab();
}

function weekDateRange(year, week){
  const jan4 = new Date(year, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const monday = new Date(jan4);
  monday.setDate(jan4.getDate() - (jan4Day - 1) + (week-1)*7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return { monday: toDateStr(monday), sunday: toDateStr(sunday) };
}

async function submitFuelEntry(){
  const date = document.getElementById('fuel-date').value;

  const errEl = document.getElementById('fuel-error');
  const { monday, sunday } = weekDateRange(window.__fuelYear, window.__fuelWeek);
  if (!date || date < monday || date > sunday) { errEl.textContent = `La fecha debe estar entre ${fmtDate(monday)} y ${fmtDate(sunday)}.`; return; }

const DASH_PERIODS = {
  ayer: 'Ayer', semana: 'Esta semana', semana_anterior: 'Semana anterior',
  mes: 'Este mes', mes_anterior: 'Mes anterior', trimestre: 'Últimos 3 meses', personalizado: 'Personalizado',
};
function dashboardPeriodInfo(){
  const period = window.__dashPeriod || 'semana';
  const t = today();
  if (period === 'semana') return { kind:'weeks', weeks:[getISOWeek(t)] };
  if (period === 'ayer') {
    const d = new Date(t+'T00:00:00'); d.setDate(d.getDate()-1);
    return { kind:'weeks', weeks:[getISOWeek(toDateStr(d))] };
  }
  if (period === 'semana_anterior') {
    const d = new Date(t+'T00:00:00'); d.setDate(d.getDate()-7);
    return { kind:'weeks', weeks:[getISOWeek(toDateStr(d))] };
  }
  const now = new Date(t+'T00:00:00');
  if (period === 'mes') return { kind:'months', months:[{year:now.getFullYear(), month:now.getMonth()}] };
  if (period === 'mes_anterior') {
    let m = now.getMonth()-1, y = now.getFullYear();
    if (m<0){ m=11; y-=1; }
    return { kind:'months', months:[{year:y, month:m}] };
  }
  if (period === 'trimestre') {
    const months = [];
    for (let i=2;i>=0;i--){ let m=now.getMonth()-i, y=now.getFullYear(); while(m<0){m+=12;y-=1;} months.push({year:y,month:m}); }
    return { kind:'months', months };
  }
  // personalizado
  const from = window.__dashCustomFrom || t;
  const to = window.__dashCustomTo || t;
  const fromD = new Date(Math.min(new Date(from+'T00:00:00').getTime(), new Date(to+'T00:00:00').getTime()));
  const toD = new Date(Math.max(new Date(from+'T00:00:00').getTime(), new Date(to+'T00:00:00').getTime()));
  const weeks = []; const seen = new Set();
  for (let cursor=new Date(fromD); cursor<=toD; cursor.setDate(cursor.getDate()+1)) {
    const w = getISOWeek(toDateStr(cursor));
    const key = w.year+'-'+w.week;
    if (!seen.has(key)) { seen.add(key); weeks.push(w); }
  }
  return { kind:'weeks', weeks, from, to };
}
function dashboardWeeksInMonth(year, month){
  const result = [];
  for (let week=1; week<=53; week++){
    const thu = isoWeekThursday(year, week);
    if (thu.getFullYear()===year && thu.getMonth()===month) result.push({ year, week });
  }
  return result;
}
function dashboardWeekBuckets(info){
  if (info.kind === 'weeks') return info.weeks.map(w=>({ year:w.year, week:w.week }));
  const buckets = [];
  info.months.forEach(({year,month}) => {
    dashboardWeeksInMonth(year, month).forEach(w => buckets.push({ year:w.year, week:w.week, _month:month, _monthYear:year }));
  });
  return buckets;
}
let __dashMonthRowsCache = new Map();
function dashboardDriverWeekRow(driverId, bucket){
  if (bucket._month !== undefined) {
    const key = driverId+'|'+bucket._monthYear+'|'+bucket._month;
    let rows = __dashMonthRowsCache.get(key);
    if (!rows) { rows = buildMonthRows(driverId, bucket._monthYear, bucket._month); __dashMonthRowsCache.set(key, rows); }
    return rows.find(e=>e.week===bucket.week);
  }
  return weeklyEntries.find(e=>e.driverId===driverId && e.year===bucket.year && e.week===bucket.week);
}
// Recalcula, para una semana concreta de un conductor Plaza, los mismos
// importes que usa la ficha del conductor (mismas funciones, mismo
// criterio de indexación y de "solo se cobra el mayor extra") — así el
// dashboard nunca puede desviarse de lo que realmente se le paga.
function dashboardWeekFinancials(driverId, e){
  if (!e) return null;
  const m = e._splitMonth;
  const gasoil = computeGasoilForWeek(driverId, e.year, e.week, m);
  const peajes = computeExpenseForWeek(driverId, e.year, e.week, 'peaje', m);
  const otros = computeExpenseForWeek(driverId, e.year, e.week, 'otro', m);
  const supplements = computeSupplementsForWeek(driverId, e.year, e.week, m);
  const daysCount = computeDaysCountForWeek(driverId, e.year, e.week, m);
  const rates = getRatesForDate(driverId, e._rateDate || weekDateRange(e.year,e.week).monday);
  const c = computeWeek(rates, { ...e, gasoil, peajes, otros, supplements });
  const mm = e._splitMonth !== undefined ? e._splitMonth : weekMonth(e.year, e.week);
  const idxPct = rates.hasIndexation !== false ? getIndexPercent(driverId, e.year, mm) : 0;
  const idxAmount = c.dayAmount * (idxPct/100);
  const costeTotal = c.totalIngreso - c.gastosTotal + idxAmount;
  return {
    daysCount, km: e.km||0, hours: e.hours||0,
    kmExtra: Math.max(0, c.kmExtra), hoursExtra: Math.max(0, c.hoursExtra),
    kmExtraAmount: Math.max(0, c.kmExtraAmount), hoursExtraAmount: Math.max(0, c.hoursExtraAmount),
    costeBase: c.dayAmount, costeExtras: c.extraCharge, costeTotal,
  };
}
function dashboardDriverStats(d, info){
  if (d.modality === 'piso_movil') {
    if (info.kind !== 'months') return null;
    const entries = monthlyBillingEntries.filter(e => e.driverId===d.id && info.months.some(mo=>mo.year===e.year && mo.month===e.month));
    if (!entries.length) return null;
    let billing=0, km=0, commission=0;
    entries.forEach(e => {
      billing += e.billingAmount; km += e.km;
      const pct = getCommissionForDate(d.id, `${e.year}-${String(e.month+1).padStart(2,'0')}-01`);
      commission += e.billingAmount * (pct/100);
    });
    const costeTotal = billing - commission;
    return { driver:d, days:null, km, hours:null, kmExtra:0, hoursExtra:0, costeKmExtraPot:0, costeHorasExtraPot:0, costeBase:costeTotal, costeExtras:0, costeTotal, eurKm: km?costeTotal/km:null, eurHora:null };
  }
  const buckets = dashboardWeekBuckets(info);
  let found = false;
  let days=0, km=0, hours=0, kmExtra=0, hoursExtra=0, costeKmExtraPot=0, costeHorasExtraPot=0, costeBase=0, costeExtras=0, costeTotal=0;
  buckets.forEach(b => {
    const f = dashboardWeekFinancials(d.id, dashboardDriverWeekRow(d.id, b));
    if (!f) return;
    found = true;
    days += f.daysCount; km += f.km; hours += f.hours;
    kmExtra += f.kmExtra; hoursExtra += f.hoursExtra;
    costeKmExtraPot += f.kmExtraAmount; costeHorasExtraPot += f.hoursExtraAmount;
    costeBase += f.costeBase; costeExtras += f.costeExtras; costeTotal += f.costeTotal;
  });
  if (!found) return null;
  return { driver:d, days, km, hours, kmExtra, hoursExtra, costeKmExtraPot, costeHorasExtraPot, costeBase, costeExtras, costeTotal, eurKm: km?costeTotal/km:null, eurHora: hours?costeTotal/hours:null };
}
function dashboardExtrasBlock(stats, totalCoste){
  const totalKmExtra = stats.reduce((s,x)=>s+x.kmExtra,0);
  const totalHorasExtra = stats.reduce((s,x)=>s+x.hoursExtra,0);
  const costeKmExtraPot = stats.reduce((s,x)=>s+(x.costeKmExtraPot||0),0);
  const costeHorasExtraPot = stats.reduce((s,x)=>s+(x.costeHorasExtraPot||0),0);
  const totalExtras = stats.reduce((s,x)=>s+x.costeExtras,0);
  const pct = totalCoste ? (totalExtras/totalCoste*100) : 0;
  return `
    <div class="card">
      <div style="font-family:var(--display);text-transform:uppercase;font-size:12.5px;color:var(--muted);letter-spacing:.4px;margin-bottom:14px;">Extras generados</div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:13px;">Km extra</span><span style="font-family:var(--display);">${totalKmExtra.toLocaleString('es-ES',{maximumFractionDigits:0})} km</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:13px;">Coste km extra <span style="color:var(--mutedFaint);font-size:11px;">(potencial)</span></span><span style="font-family:var(--display);">${eur2(costeKmExtraPot)}</span></div>
        <div style="height:1px;background:var(--border);"></div>
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:13px;">Horas extra</span><span style="font-family:var(--display);">${fmtHoursMin(totalHorasExtra)}</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:13px;">Coste horas extra <span style="color:var(--mutedFaint);font-size:11px;">(potencial)</span></span><span style="font-family:var(--display);">${eur2(costeHorasExtraPot)}</span></div>
        <div style="height:1px;background:var(--border);"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-weight:700;">TOTAL EXTRAS</span>
          <span style="font-family:var(--display);font-size:18px;color:var(--danger);">${eur2(totalExtras)}</span>
        </div>
        <div style="font-size:11px;color:var(--mutedFaint);">${pct.toFixed(1)}% del coste total. Cada semana solo se cobra el mayor entre el extra de km y el de horas, nunca los dos a la vez — por eso "Coste km extra" y "Coste horas extra" son importes potenciales y no siempre suman TOTAL EXTRAS.</div>
      </div>
    </div>`;
}
const DASH_RANK_LABELS = { costeTotal:'Coste', km:'Km', hours:'Horas', kmExtra:'Km extra', hoursExtra:'Horas extra', eurKm:'€/km', eurHora:'€/hora' };
function dashboardRankFmt(sortKey, s){
  if (sortKey==='costeTotal') return eur2(s.costeTotal);
  if (sortKey==='km') return s.km.toLocaleString('es-ES',{maximumFractionDigits:0})+' km';
  if (sortKey==='hours') return s.hours!=null ? fmtHoursMin(s.hours) : '—';
  if (sortKey==='kmExtra') return s.kmExtra.toLocaleString('es-ES',{maximumFractionDigits:0})+' km';
  if (sortKey==='hoursExtra') return fmtHoursMin(s.hoursExtra);
  if (sortKey==='eurKm') return s.eurKm!=null ? eur2(s.eurKm) : '—';
  if (sortKey==='eurHora') return s.eurHora!=null ? eur2(s.eurHora) : '—';
  return '';
}
function dashboardRankingBlock(stats){
  const sortKey = DASH_RANK_LABELS[window.__dashRankSort] ? window.__dashRankSort : 'costeTotal';
  const sorted = stats.slice().sort((a,b)=> (b[sortKey]||0) - (a[sortKey]||0)).slice(0,6);
  const maxVal = Math.max(1, ...sorted.map(s=>s[sortKey]||0));
  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;">
        <div style="font-family:var(--display);text-transform:uppercase;font-size:12.5px;color:var(--muted);letter-spacing:.4px;">Ranking de autónomos</div>
        <select style="width:auto;min-width:140px;" onchange="window.__dashRankSort=this.value; renderTab();">
          ${Object.entries(DASH_RANK_LABELS).map(([k,l])=>`<option value="${k}" ${sortKey===k?'selected':''}>Por ${l}</option>`).join('')}
        </select>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${sorted.map((s,i) => {
          const val = s[sortKey]||0;
          const pct = maxVal ? Math.max(4, val/maxVal*100) : 0;
          return `
          <div style="display:flex;align-items:center;gap:10px;cursor:pointer;" onclick="openDriverDetail('${s.driver.id}')">
            <div style="width:18px;color:var(--mutedFaint);font-size:12px;text-align:right;">${i+1}</div>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;"><span style="font-weight:600;">${esc(s.driver.name)}</span><span style="color:var(--muted);">${dashboardRankFmt(sortKey,s)}</span></div>
              <div style="height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--primary);border-radius:99px;"></div></div>
            </div>
          </div>`;
        }).join('') || `<div style="color:var(--mutedFaint);font-size:12.5px;text-align:center;padding:16px;">Sin datos en este periodo.</div>`}
      </div>
    </div>`;
}
function setDashSort(key){
  if (window.__dashSort === key) window.__dashSortDir = window.__dashSortDir === 'desc' ? 'asc' : 'desc';
  else { window.__dashSort = key; window.__dashSortDir = 'desc'; }
  renderTab();
}
function dashboardTable(stats){
  const sortKey = window.__dashSort || 'costeTotal';
  const sortDir = window.__dashSortDir || 'desc';
  const sorted = stats.slice().sort((a,b) => {
    const av = a[sortKey], bv = b[sortKey];
    const an = (av==null?-Infinity:av), bn = (bv==null?-Infinity:bv);
    if (typeof an === 'string' || typeof bn === 'string') return String(an).localeCompare(String(bn),'es') * (sortDir==='asc'?1:-1);
    return (an-bn) * (sortDir==='asc'?1:-1);
  });
  const arrow = (key) => sortKey===key ? (sortDir==='desc'?' ↓':' ↑') : '';
  const th = (key,label) => `<th style="cursor:pointer;white-space:nowrap;" onclick="setDashSort('${key}')">${label}${arrow(key)}</th>`;
  return `
    <div class="card" style="padding:0;overflow-x:auto;">
      <table>
        <thead><tr>
          ${th('driverName','Conductor')}
          ${th('companyName','Empresa')}
          ${th('modalityLabel','Modalidad')}
          ${th('days','Días')}
          ${th('km','Km')}
          ${th('hours','Horas')}
          ${th('kmExtra','Km extra')}
          ${th('hoursExtra','Horas extra')}
          ${th('costeBase','Coste base')}
          ${th('costeExtras','Coste extras')}
          ${th('costeTotal','Coste total')}
          ${th('eurKm','€/km')}
          ${th('eurHora','€/hora')}
          ${th('archived','Estado')}
        </tr></thead>
        <tbody>
          ${sorted.map(s => {
            const d = s.driver;
            const co = companies.find(c=>c.id===d.companyId);
            const modalityLabel = d.modality==='piso_movil' ? 'Piso Móvil' : 'Plaza';
            return `
            <tr class="dr-row" style="cursor:pointer;${d.archived?'opacity:0.65;':''}" onclick="openDriverDetail('${d.id}')">
              <td style="font-weight:600;">${esc(d.name)}</td>
              <td style="color:var(--muted);">${esc(co?co.name:'—')}</td>
              <td style="color:var(--muted);">${modalityLabel}</td>
              <td style="color:var(--muted);">${s.days!=null?s.days:'—'}</td>
              <td style="color:var(--muted);">${s.km.toLocaleString('es-ES',{maximumFractionDigits:0})}</td>
              <td style="color:var(--muted);">${s.hours!=null?fmtHoursMin(s.hours):'—'}</td>
              <td style="color:var(--muted);">${s.kmExtra?s.kmExtra.toLocaleString('es-ES',{maximumFractionDigits:0}):'—'}</td>
              <td style="color:var(--muted);">${s.hoursExtra?fmtHoursMin(s.hoursExtra):'—'}</td>
              <td style="color:var(--muted);">${eur2(s.costeBase)}</td>
              <td style="color:${s.costeExtras?'var(--danger)':'var(--mutedFaint)'};">${s.costeExtras?eur2(s.costeExtras):'—'}</td>
              <td style="font-weight:700;">${eur2(s.costeTotal)}</td>
              <td style="color:var(--muted);">${s.eurKm!=null?eur2(s.eurKm):'—'}</td>
              <td style="color:var(--muted);">${s.eurHora!=null?eur2(s.eurHora):'—'}</td>
              <td>${d.archived?`<span style="color:var(--danger);font-size:12px;font-weight:600;">Inactivo</span>`:`<span style="color:var(--success);font-size:12px;font-weight:600;">Activo</span>`}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="14" style="color:var(--mutedFaint);text-align:center;padding:24px;">Sin datos en este periodo con los filtros aplicados.</td></tr>`}
        </tbody>
      </table>
    </div>`;
}
function tplAutonomosDashboardBody(){
  __dashMonthRowsCache = new Map();
  const period = window.__dashPeriod || 'semana';
  const info = dashboardPeriodInfo();
  const filterCompany = window.__dashFilterCompany || '';
  const filterModality = window.__dashFilterModality || '';
  const filterStatus = window.__dashFilterStatus || 'activos';
  const filterDriver = window.__dashFilterDriver || '';
  const filterExtras = window.__dashFilterExtras || '';
  const search = (window.__dashSearch||'').toLowerCase();

  let candidateDrivers = drivers.filter(d => filterStatus==='todos' || !!d.archived === (filterStatus==='archivados'));
  if (filterCompany) candidateDrivers = candidateDrivers.filter(d=>d.companyId===filterCompany);
  if (filterModality) candidateDrivers = candidateDrivers.filter(d=>d.modality===filterModality);
  if (filterDriver) candidateDrivers = candidateDrivers.filter(d=>d.id===filterDriver);
  if (search) candidateDrivers = candidateDrivers.filter(d=>d.name.toLowerCase().includes(search));

  let stats = candidateDrivers.map(d => {
    const s = dashboardDriverStats(d, info);
    if (!s) return null;
    const co = companies.find(c=>c.id===d.companyId);
    return { ...s, driverName: d.name, companyName: co ? co.name : '', modalityLabel: d.modality==='piso_movil' ? 'Piso Móvil' : 'Plaza', archived: !!d.archived };
  }).filter(Boolean);

  if (filterExtras==='con') stats = stats.filter(s=>s.kmExtra>0||s.hoursExtra>0);
  if (filterExtras==='sin') stats = stats.filter(s=>s.kmExtra<=0&&s.hoursExtra<=0);
  if (filterExtras==='km') stats = stats.filter(s=>s.kmExtra>0);
  if (filterExtras==='horas') stats = stats.filter(s=>s.hoursExtra>0);

  const totalActivos = stats.filter(s=>!s.driver.archived).length;
  const totalCoste = stats.reduce((s,x)=>s+x.costeTotal,0);
  const totalKm = stats.reduce((s,x)=>s+x.km,0);
  const totalHoras = stats.reduce((s,x)=>s+(x.hours||0),0);
  const totalKmExtra = stats.reduce((s,x)=>s+x.kmExtra,0);
  const totalHorasExtra = stats.reduce((s,x)=>s+x.hoursExtra,0);
  const totalCosteBase = stats.reduce((s,x)=>s+x.costeBase,0);
  const totalCosteExtras = stats.reduce((s,x)=>s+x.costeExtras,0);
  const costeKm = totalKm ? totalCoste/totalKm : null;
  const costeHora = totalHoras ? totalCoste/totalHoras : null;

  const companyOptions = companies.filter(co=>!co.archived).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  const driverOptions = drivers.filter(d=>!filterCompany || d.companyId===filterCompany).sort((a,b)=>a.name.localeCompare(b.name,'es'));

  return `
    <div class="card" style="margin-bottom:18px;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <label style="font-size:12.5px;color:var(--muted);font-weight:600;">📅 Periodo:</label>
        <select style="width:auto;min-width:170px;" onchange="window.__dashPeriod=this.value; renderTab();">
          ${Object.entries(DASH_PERIODS).map(([k,l])=>`<option value="${k}" ${period===k?'selected':''}>${l}</option>`).join('')}
        </select>
        ${period==='personalizado' ? `
        <label style="font-size:12.5px;color:var(--muted);">Desde</label>
        <input type="date" value="${window.__dashCustomFrom||today()}" onchange="window.__dashCustomFrom=this.value; renderTab();" style="width:150px;" />
        <label style="font-size:12.5px;color:var(--muted);">Hasta</label>
        <input type="date" value="${window.__dashCustomTo||today()}" onchange="window.__dashCustomTo=this.value; renderTab();" style="width:150px;" />
        ` : ''}
        <div style="flex:1;"></div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
        <div style="position:relative;flex:1;min-width:180px;max-width:260px;">
          <input placeholder="Buscar conductor…" value="${esc(window.__dashSearch||'')}" oninput="window.__dashSearch=this.value; renderTab();" style="padding-left:34px;" />
          <span style="position:absolute;left:11px;top:9px;color:var(--mutedFaint);font-size:13px;">🔍</span>
        </div>
        <select style="width:auto;min-width:150px;" onchange="window.__dashFilterCompany=this.value||''; renderTab();">
          <option value="">Empresa: Todas</option>
          ${companyOptions.map(co=>`<option value="${co.id}" ${filterCompany===co.id?'selected':''}>${esc(co.name)}</option>`).join('')}
        </select>
        <select style="width:auto;min-width:140px;" onchange="window.__dashFilterModality=this.value||''; renderTab();">
          <option value="">Modalidad: Todas</option>
          <option value="plaza" ${filterModality==='plaza'?'selected':''}>Plaza</option>
          <option value="piso_movil" ${filterModality==='piso_movil'?'selected':''}>Piso Móvil</option>
        </select>
        <select style="width:auto;min-width:140px;" onchange="window.__dashFilterStatus=this.value; renderTab();">
          <option value="activos" ${filterStatus==='activos'?'selected':''}>Estado: Activos</option>
          <option value="archivados" ${filterStatus==='archivados'?'selected':''}>Estado: Inactivos</option>
          <option value="todos" ${filterStatus==='todos'?'selected':''}>Estado: Todos</option>
        </select>
        <select style="width:auto;min-width:150px;" onchange="window.__dashFilterDriver=this.value||''; renderTab();">
          <option value="">Autónomo: Todos</option>
          ${driverOptions.map(d=>`<option value="${d.id}" ${filterDriver===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
        </select>
        <select style="width:auto;min-width:150px;" onchange="window.__dashFilterExtras=this.value; renderTab();">
          <option value="" ${filterExtras===''?'selected':''}>Extras: Todos</option>
          <option value="con" ${filterExtras==='con'?'selected':''}>Con extras</option>
          <option value="sin" ${filterExtras==='sin'?'selected':''}>Sin extras</option>
          <option value="km" ${filterExtras==='km'?'selected':''}>Con km extra</option>
          <option value="horas" ${filterExtras==='horas'?'selected':''}>Con horas extra</option>
        </select>
      </div>
    </div>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;">
      ${kpi('Autónomos activos', totalActivos, null, true)}
      ${kpi('Coste total', eur2(totalCoste), null, true)}
      ${kpi('Km realizados', totalKm.toLocaleString('es-ES',{maximumFractionDigits:0}), null, true)}
      ${kpi('Horas realizadas', fmtHoursMin(totalHoras), null, true)}
      ${kpi('Km extra', totalKmExtra.toLocaleString('es-ES',{maximumFractionDigits:0}), null, true)}
      ${kpi('Horas extra', fmtHoursMin(totalHorasExtra), null, true)}
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;">
      ${kpi('Coste medio €/km', costeKm!=null?eur2(costeKm):'—', null, true)}
      ${kpi('Coste medio €/hora', costeHora!=null?eur2(costeHora):'—', null, true)}
      ${kpi('Coste base', eur2(totalCosteBase), null, true)}
      ${kpi('Coste extras', eur2(totalCosteExtras), null, true)}
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:22px;">
      ${dashboardExtrasBlock(stats, totalCoste)}
      ${dashboardRankingBlock(stats)}
    </div>

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <div style="font-family:var(--display);text-transform:uppercase;font-size:12.5px;color:var(--muted);letter-spacing:.4px;">Detalle de autónomos</div>
    </div>
    ${dashboardTable(stats)}`;
}

              <td style="color:var(--muted);font-family:var(--mono);font-size:12.5px;">${esc(d.matriculaRemolque||'—')}</td>
              <td style="color:var(--muted);white-space:nowrap;" data-sort-value="${esc(d.mercanciaNaturaleza||'')}" title="${esc(d.mercanciaNaturaleza)}">${esc(truncateText(d.mercanciaNaturaleza, 22))}</td>
              <td style="white-space:nowrap;">
                <button onclick="event.stopPropagation(); openDecaViewModal('${d.id}');" title="Ver" style="background:none;border:none;color:var(--muted);font-size:14px;padding:2px 4px;">👁</button>
                <button onclick="event.stopPropagation(); downloadDecaPdf('${d.id}');" title="Descargar PDF (${esc(decaPdfFileName(d))})" style="background:none;border:none;color:var(--muted);padding:4px;border-radius:6px;display:inline-flex;align-items:center;">${homeIcon(HOME_ICON_PATHS.download, 15, 'currentColor', 2)}</button>
                <button onclick="event.stopPropagation(); openDecaForm('${d.id}');" title="Editar" style="background:none;border:none;color:var(--muted);padding:4px;border-radius:6px;display:inline-flex;align-items:center;">${homeIcon(HOME_ICON_PATHS.edit, 15, 'currentColor', 2)}</button>
                <button onclick="event.stopPropagation(); confirmDeleteDeca('${d.id}');" title="Eliminar" style="background:none;border:none;color:var(--mutedFaint);font-size:14px;padding:2px 4px;">🗑</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ---- DeCA: datos ---- */
let decaDocuments = [];
async function loadDecaDocuments(){
  const { data } = await supabaseClient.from('deca_documents').select('*').order('created_at', { ascending: false });
  decaDocuments = (data||[]).map(d => ({
    id: d.id, createdAt: d.created_at, codigo: d.codigo || '',
    cargadorNombre: d.cargador_nombre, cargadorNif: d.cargador_nif, cargadorDomicilio: d.cargador_domicilio || '',
    transportistaNombre: d.transportista_nombre, transportistaNif: d.transportista_nif, transportistaDomicilio: d.transportista_domicilio || '',
    origen: d.origen, destino: d.destino,
    mercanciaNaturaleza: d.mercancia_naturaleza, mercanciaPeso: d.mercancia_peso,
    fechaTransporte: d.fecha_transporte,
    matriculaTractora: d.matricula_tractora, matriculaRemolque: d.matricula_remolque || '', observaciones: d.observaciones || '',
    creacionFecha: d.creacion_fecha || '', creacionHora: d.creacion_hora ? String(d.creacion_hora).slice(0, 8) : '',
    pdfStoragePath: d.pdf_storage_path || null, pdfUrl: d.pdf_url || null,
  }));
}

/* ---- Direccion completa de un contacto (la usan la ficha y el DeCA) ---- */
function cargadorDireccionCompleta(c){
  const linea1 = [c.calle1, c.calle2].filter(Boolean).join(', ');
  const linea2 = [c.codigoPostal, c.ciudad].filter(Boolean).join(' ');
  const linea3 = [c.provincia, c.pais].filter(Boolean).join(', ');
  return [linea1, linea2, linea3].filter(Boolean).join(', ');
}
/* ---- DeCA: generación del PDF nativo + QR ---- */
function dataUrlToUint8Array(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
// qrcode-generator's propio createDataURL() exporta GIF (evita depender de
// <canvas>), pero pdf-lib solo puede embeber PNG/JPG — así que se dibuja a
// mano en un <canvas> a partir de isDark()/getModuleCount() y se exporta
// como PNG real, tanto para el PDF como para la vista previa en pantalla.
function qrDataUrl(text, cellSize, margin){
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const cs = cellSize || 6, m = margin != null ? margin : 4;
  const count = qr.getModuleCount();
  const size = (count + m*2) * cs;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000000';
  for (let row = 0; row < count; row++) {
    for (let col = 0; col < count; col++) {
      if (qr.isDark(row, col)) ctx.fillRect((col+m)*cs, (row+m)*cs, cs, cs);
    }
  }
  return canvas.toDataURL('image/png');
}
function wrapPdfText(text, font, size, maxWidth){
  const words = String(text||'').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (line && font.widthOfTextAtSize(test, size) > maxWidth) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines.length ? lines : ['—'];
}
// Genera el PDF nativo del DeCA (campos del art. 6 Orden FOM 2861/2012)
// con el QR que apunta a su URL de descarga, lo sube al bucket y
// devuelve la URL firmada guardada. La ruta de storage se reutiliza tal
// cual al editar, así el DeCA conserva la misma URL/QR durante el
// servicio (una de las dos vías que permite la resolución del 5 de junio
// para modificar datos durante el transporte).
async function buildAndUploadDecaPdf(fields, storagePath, existingUrl){
  // Supabase Storage exige que el objeto ya exista para poder firmar su URL
  // (createSignedUrl falla con "not found" sobre una ruta vacía), pero el
  // PDF necesita conocer esa URL de antemano para poder imprimir su QR.
  // Al crear un DeCA nuevo se sube primero un PDF marcador de posición para
  // reservar la ruta, se firma la URL sobre ese objeto ya existente, y
  // luego se sube el PDF definitivo (con el QR ya embebido) encima. Al
  // editar, se reutiliza la URL ya guardada — así el QR no cambia cada vez.
  let url = existingUrl;
  if (!url) {
    const placeholderDoc = await PDFLib.PDFDocument.create();
    placeholderDoc.addPage([100, 100]);
    const placeholderBytes = await placeholderDoc.save();
    const { error: placeholderError } = await supabaseClient.storage.from(DOCS_BUCKET).upload(storagePath, new Blob([placeholderBytes], { type: 'application/pdf' }), { upsert: true, contentType: 'application/pdf', cacheControl: '0' });
    if (placeholderError) throw new Error('No se pudo reservar el archivo.');
    const { data: signedData, error: signError } = await supabaseClient.storage.from(DOCS_BUCKET).createSignedUrl(storagePath, 90*24*3600);
    if (signError || !signedData) throw new Error('No se pudo generar la URL de descarga.');
    url = signedData.signedUrl;
  }
  const { infoBytes } = await decaBuildPdfs(fields, url);
  // Solo se guarda el PDF que abre el QR (misma ruta y URL de siempre). El
  // PDF del conductor no se guarda: se genera al momento, con los datos y el
  // diseño actuales, cada vez que se pulsa "PDF para el conductor".
  const { error: uploadError } = await supabaseClient.storage.from(DOCS_BUCKET).upload(storagePath, new Blob([infoBytes], { type: 'application/pdf' }), { upsert: true, contentType: 'application/pdf', cacheControl: '0' });
  if (uploadError) throw new Error('No se pudo subir el PDF.');
  return { url };
}
// Código de Verificación Electrónica (CVE), al estilo de los documentos
// oficiales españoles: no es un cifrado ni una firma, es un identificador
// corto y ESTABLE para este DeCA — sale siempre igual porque se calcula a
// partir de la URL del QR, que no cambia en toda la vida del documento (se
// reutiliza al editar). Sirve para que, a simple vista, se vea que el
// documento lleva un código de verificación — la comprobación real es el
// QR, que enlaza siempre a los datos vivos de este DeCA.
function decaCveCode(url){
  let h1 = 0, h2 = 0;
  const s = String(url || '');
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = (h1 * 31 + c) >>> 0;
    h2 = (h2 * 131 + c) >>> 0;
  }
  const hex = (h1.toString(16) + h2.toString(16)).toUpperCase().padStart(16, '0');
  return `QL-${hex.slice(0, 4)}-${hex.slice(4, 8)}`;
}
// Genera en memoria los dos PDF del DeCA: el de consulta (solo información,
// el que abre el QR) y el del conductor (página 1 solo el QR, página 2 la
// información). `url` es el enlace del QR.
async function decaBuildPdfs(fields, url){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  // Cada celdilla del QR se dibuja grande (12 px) para que quede nítido al
  // escalarlo a tamaño real en la primera página.
  const qrPng = dataUrlToUint8Array(qrDataUrl(url, 12));
  const cveCode = decaCveCode(url);

  // Página con toda la información del DeCA (sin QR): es lo que se ve al
  // escanear el código y también la segunda página del PDF del conductor.
  const drawInfoPage = async (pdfDoc) => {
    const page = pdfDoc.addPage([595.28, 841.89]);
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const bold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    const ink = rgb(0.08, 0.1, 0.14), gray = rgb(0.42, 0.45, 0.5), lineCol = rgb(0.2, 0.22, 0.27), accent = rgb(0.106, 0.227, 0.42);
    const mx = 36, W = 523.28, top = 806;
    let logo = null;
    try { const r = await fetch('logo-full.png'); if (r.ok) logo = await pdfDoc.embedPng(await r.arrayBuffer()); } catch (e) { /* sin logo */ }

    // Casilla numerada al estilo de la carta de porte CMR: recuadro con el
    // número y el título arriba a la izquierda y el dato debajo.
    const box = (x, yTop, w, h, num, label, items, opts) => {
      opts = opts || {};
      page.drawRectangle({ x, y: yTop - h, width: w, height: h, color: opts.fill, borderColor: opts.borderColor || lineCol, borderWidth: opts.borderWidth || 0.8 });
      let lx = x + 6;
      if (num) {
        page.drawRectangle({ x: x + 4, y: yTop - 16, width: 14, height: 12, color: accent });
        const nw = bold.widthOfTextAtSize(String(num), 8);
        page.drawText(String(num), { x: x + 4 + (14 - nw) / 2, y: yTop - 13.2, size: 8, font: bold, color: rgb(1, 1, 1) });
        lx = x + 23;
      }
      page.drawText(String(label).toUpperCase(), { x: lx, y: yTop - 13, size: 6.8, font: bold, color: opts.labelColor || gray });
      let y = yTop - 32;
      const bottom = yTop - h + 8;
      for (const it of items) {
        const size = it.size || 10.5, f = it.bold ? bold : font, lh = size + 3.5;
        const lines = wrapPdfText(it.text, f, size, w - 14);
        for (const ln of lines) {
          if (y < bottom) return;
          page.drawText(ln, { x: x + 7, y, size, font: f, color: it.color || ink });
          y -= lh;
        }
        y -= it.gap || 0;
      }
    };
    const dash = v => (v && String(v).trim()) ? String(v).trim() : '—';
    // Una dirección completa viene como "calle1, calle2, cp ciudad, provincia,
    // país" (formato de cargadorDireccionCompleta): se separa en dos líneas,
    // la de las calles y la del cp/provincia/país, para pintarlas una debajo
    // de la otra en la casilla.
    const splitDomicilioLineas = (s) => {
      const str = String(s || '').trim();
      if (!str) return [];
      const m = str.match(/^(.*?),\s*(\d[\d\s-]{3,7}[^,]*(?:,.*)?)$/);
      return m ? [m[1].trim(), m[2].trim()] : [str];
    };
    // Origen/destino se guardan como "Nombre, dirección completa": separa el
    // nombre de la empresa del resto de la dirección.
    const splitLugarNombreResto = (s) => {
      const str = String(s || '').trim();
      const i = str.indexOf(',');
      return i >= 0 ? [str.slice(0, i).trim(), str.slice(i + 1).trim()] : [str, ''];
    };
    // dd-mm-aaaa para las casillas 7 y 10 (fecha del transporte / de creación).
    const dmy = (s) => {
      if (!s) return '—';
      const dt = new Date(s + 'T00:00:00');
      if (isNaN(dt.getTime())) return '—';
      return `${String(dt.getDate()).padStart(2,'0')}-${String(dt.getMonth()+1).padStart(2,'0')}-${dt.getFullYear()}`;
    };
    const fecha = dmy(fields.fechaTransporte);
    // El peso se escribe libremente en el formulario (con o sin "kg", con o
    // sin puntos) — aquí se coge solo el número y se pinta siempre igual:
    // con separador de miles y "Kg" detrás.
    const pesoDigits = String(fields.mercanciaPeso || '').replace(/[^\d]/g, '');
    const pesoBruto = pesoDigits ? Number(pesoDigits).toLocaleString('es-ES') + ' Kg' : dash(fields.mercanciaPeso);

    // Cabecera: logo, título y número del DeCA
    const hH = 70, wLogo = 96, wCode = 112;
    const wTitle = W - wLogo - wCode;
    page.drawRectangle({ x: mx, y: top - hH, width: W, height: hH, borderColor: lineCol, borderWidth: 0.8 });
    page.drawLine({ start: { x: mx + wLogo, y: top }, end: { x: mx + wLogo, y: top - hH }, thickness: 0.8, color: lineCol });
    page.drawLine({ start: { x: mx + wLogo + wTitle, y: top }, end: { x: mx + wLogo + wTitle, y: top - hH }, thickness: 0.8, color: lineCol });
    // Logo completo (icono + "QUALIFIED LOGISTICS & TRANSPORT" ya incluido
    // en la imagen), centrado en su columna, respetando su proporción.
    if (logo) {
      const logoW = 82, logoH = logoW * (logo.height / logo.width);
      page.drawImage(logo, { x: mx + (wLogo - logoW) / 2, y: top - hH / 2 - logoH / 2, width: logoW, height: logoH });
    }
    const t1 = 'DOCUMENTO ELECTRÓNICO DE', t2 = 'CONTROL ADMINISTRATIVO';
    page.drawText(t1, { x: mx + wLogo + (wTitle - bold.widthOfTextAtSize(t1, 13)) / 2, y: top - 27, size: 13, font: bold, color: accent });
    page.drawText(t2, { x: mx + wLogo + (wTitle - bold.widthOfTextAtSize(t2, 13)) / 2, y: top - 43, size: 13, font: bold, color: accent });
    const t3 = 'DeCA · Transporte de mercancías por carretera';
    page.drawText(t3, { x: mx + wLogo + (wTitle - font.widthOfTextAtSize(t3, 7.5)) / 2, y: top - 58, size: 7.5, font, color: gray });
    page.drawText('DeCA Nº', { x: mx + wLogo + wTitle + 7, y: top - 13, size: 6.8, font: bold, color: gray });
    const code = dash(fields.codigo);
    page.drawText(code, { x: mx + wLogo + wTitle + (wCode - bold.widthOfTextAtSize(code, 15)) / 2, y: top - 46, size: 15, font: bold, color: ink });

    // Rejilla de casillas
    const half = W / 2;
    let y = top - hH;
    const r1 = 122, r2 = 92, r3 = 74, r4 = 66, r4b = 62, r5 = 150;
    const creacionFecha = dmy(fields.creacionFecha);
    const creacionHora = dash(fields.creacionHora ? (fields.creacionHora.length === 5 ? fields.creacionHora + ':00' : fields.creacionHora) : '');
    box(mx, y, half, r1, 1, 'Cargador contractual', [
      { text: dash(fields.cargadorNombre), bold: true, size: 11.5, gap: 4 },
      { text: 'NIF: ' + dash(fields.cargadorNif), size: 10, gap: 3 },
      ...splitDomicilioLineas(fields.cargadorDomicilio).map(t => ({ text: t, size: 9.5, color: gray })),
    ]);
    box(mx + half, y, half, r1, 2, 'Transportista efectivo', [
      { text: dash(fields.transportistaNombre), bold: true, size: 11.5, gap: 4 },
      { text: 'NIF: ' + dash(fields.transportistaNif), size: 10, gap: 3 },
      ...splitDomicilioLineas(fields.transportistaDomicilio).map(t => ({ text: t, size: 9.5, color: gray })),
    ]);
    y -= r1;
    const origenParts = splitLugarNombreResto(fields.origen), destinoParts = splitLugarNombreResto(fields.destino);
    box(mx, y, half, r2, 3, 'Lugar de origen (carga)', [
      { text: dash(origenParts[0]), bold: true, size: 11, gap: 3 },
      ...splitDomicilioLineas(origenParts[1]).map(t => ({ text: t, size: 9.5, color: gray })),
    ]);
    box(mx + half, y, half, r2, 4, 'Lugar de destino (descarga)', [
      { text: dash(destinoParts[0]), bold: true, size: 11, gap: 3 },
      ...splitDomicilioLineas(destinoParts[1]).map(t => ({ text: t, size: 9.5, color: gray })),
    ]);
    y -= r2;
    const w5 = half, w6 = (W - half) / 2;
    box(mx, y, w5, r3, 5, 'Naturaleza de la mercancía', [{ text: dash(fields.mercanciaNaturaleza), bold: true, size: 11 }]);
    box(mx + w5, y, w6, r3, 6, 'Peso bruto', [{ text: pesoBruto, bold: true, size: 12.5 }]);
    box(mx + w5 + w6, y, w6, r3, 7, 'Fecha del transporte', [{ text: fecha, bold: true, size: 11 }]);
    y -= r3;
    box(mx, y, half, r4, 8, 'Matrícula tractora', [{ text: dash(fields.matriculaTractora), bold: true, size: 15 }]);
    box(mx + half, y, half, r4, 9, 'Matrícula remolque', [{ text: fields.matriculaRemolque && fields.matriculaRemolque.trim() ? fields.matriculaRemolque.trim() : 'No aplica', bold: true, size: 15 }]);
    y -= r4;
    box(mx, y, half, r4b, 10, 'Fecha de creación', [{ text: creacionFecha, bold: true, size: 12.5 }]);
    box(mx + half, y, half, r4b, 11, 'Hora de creación', [{ text: creacionHora, bold: true, size: 12.5 }]);
    y -= r4b;
    box(mx, y, W, r5, 12, 'Observaciones', [{ text: dash(fields.observaciones), size: 10.5 }]);
    y -= r5;

    // Sello de verificación electrónica — no reemplaza al QR (que es la
    // comprobación real, siempre con los datos vivos), pero da al documento
    // ese "peso" de sellado oficial que se pide para presentarlo a una
    // autoridad: código estable + momento exacto de creación.
    const rStamp = 50;
    box(mx, y, W, rStamp, null, 'Sello de verificación electrónica', [
      { text: `CVE: ${cveCode}   ·   Verificado el ${creacionFecha}${creacionHora !== '—' ? ' a las ' + creacionHora : ''}`, bold: true, size: 10.5, color: accent, gap: 3 },
      { text: 'La autenticidad de este documento puede comprobarse escaneando el código QR de la portada.', size: 8.5, color: gray },
    ], { fill: rgb(0.94, 0.96, 0.99), borderColor: accent, borderWidth: 0.8, labelColor: accent });
    y -= rStamp;

    // Pie
    page.drawText('Art. 147 LOTT / art. 222 ROTT — Orden FOM 2861/2012', { x: mx, y: y - 18, size: 7.5, font, color: gray });
    page.drawText('Documento generado electrónicamente · Qualified Logistics', { x: mx, y: y - 29, size: 7.5, font, color: gray });
  };

  // 1) Lo que abre el QR: solo la información.
  const infoDoc = await PDFDocument.create();
  await drawInfoPage(infoDoc);
  const infoBytes = await infoDoc.save();

  // 2) El PDF que se entrega al conductor: página 1 solo el QR, centrado y a
  // un tamaño cómodo de escanear (unos 12 cm de lado con su margen blanco);
  // página 2 la información.
  const driverDoc = await PDFDocument.create();
  const qrPage = driverDoc.addPage([595.28, 841.89]);
  const qrImage = await driverDoc.embedPng(qrPng);
  const qrFont = await driverDoc.embedFont(StandardFonts.Helvetica);
  const qrBold = await driverDoc.embedFont(StandardFonts.HelveticaBold);
  const qrGray = rgb(0.42, 0.45, 0.5), qrAccent = rgb(0.106, 0.227, 0.42);
  const qrSize = 340;
  const qrY = (841.89 - qrSize) / 2;
  qrPage.drawImage(qrImage, { x: (595.28 - qrSize) / 2, y: qrY, width: qrSize, height: qrSize });
  const caption = 'Escanee este código para verificar la autenticidad del documento';
  qrPage.drawText(caption, { x: (595.28 - qrFont.widthOfTextAtSize(caption, 10)) / 2, y: qrY - 28, size: 10, font: qrFont, color: qrGray });
  const cveLine = `CVE: ${cveCode}`;
  qrPage.drawText(cveLine, { x: (595.28 - qrBold.widthOfTextAtSize(cveLine, 11)) / 2, y: qrY - 46, size: 11, font: qrBold, color: qrAccent });
  await drawInfoPage(driverDoc);
  const driverBytes = await driverDoc.save();
  return { infoBytes, driverBytes };
}
// El PDF del conductor vive junto al de consulta: mismo nombre + "-conductor".
function decaDriverPath(storagePath){ return String(storagePath).replace(/\.pdf$/i, '') + '-conductor.pdf'; }
// El archivo descargado se llama como el número del DeCA (p. ej. 2026-1000.pdf).
function decaPdfFileName(d){
  const base = String((d && d.codigo) || '').trim().replace(/[\\/:*?"<>|]+/g, '-');
  return (base || 'DeCA') + '.pdf';
}
async function downloadDecaPdf(id){
  const d = decaDocuments.find(x=>x.id===id);
  if (!d) return;
  try {
    if (!d.pdfUrl) throw new Error('este DeCA no tiene enlace de descarga.');
    const { driverBytes } = await decaBuildPdfs(d, d.pdfUrl);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([driverBytes], { type: 'application/pdf' }));
    a.download = decaPdfFileName(d);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (err) {
    alert('No se pudo descargar el PDF: ' + (err && err.message ? err.message : 'error desconocido.'));
  }
}
// El PDF del conductor se genera siempre al momento con los datos actuales
// del DeCA y el diseño vigente, y se abre desde el propio navegador: así nunca
// aparece una versión antigua guardada en caché o en el almacenamiento.
async function openDecaDriverPdf(id){
  const d = decaDocuments.find(x=>x.id===id);
  if (!d) return;
  const w = window.open('', '_blank');
  try {
    if (!d.pdfUrl) throw new Error('este DeCA no tiene enlace de descarga.');
    const { driverBytes } = await decaBuildPdfs(d, d.pdfUrl);
    const blobUrl = URL.createObjectURL(new Blob([driverBytes], { type: 'application/pdf' }));
    if (w) w.location = blobUrl; else window.location.href = blobUrl;
  } catch (err) {
    if (w) w.close();
    alert('No se pudo generar el PDF: ' + (err && err.message ? err.message : 'error desconocido.'));
  }
}
// Imagen (PNG) lista para enviar por WhatsApp o correo: solo el QR, con el
// número de DeCA y un texto explicativo — así, aunque se envíe suelta sin
// el resto de la app alrededor, quien la reciba (o el agente que la ve en
// la pantalla del conductor) entiende qué es y qué tiene que hacer.
async function decaQrShareBlob(d){
  const qrSize = 640, pad = 48, labelH = 130;
  const canvas = document.createElement('canvas');
  canvas.width = qrSize + pad * 2;
  canvas.height = qrSize + pad * 2 + labelH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const qrImg = new Image();
  await new Promise((resolve, reject) => { qrImg.onload = resolve; qrImg.onerror = reject; qrImg.src = qrDataUrl(d.pdfUrl, 14); });
  ctx.drawImage(qrImg, pad, pad, qrSize, qrSize);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#1B2430';
  ctx.font = 'bold 30px Arial';
  ctx.fillText(`DeCA ${d.codigo || ''}`.trim(), canvas.width / 2, pad + qrSize + 44);
  ctx.fillStyle = '#69727C';
  ctx.font = '20px Arial';
  ctx.fillText('Escanee este código para ver el documento', canvas.width / 2, pad + qrSize + 76);
  ctx.fillStyle = '#1B3A6B';
  ctx.font = 'bold 20px Arial';
  ctx.fillText(`CVE: ${decaCveCode(d.pdfUrl)}`, canvas.width / 2, pad + qrSize + 106);
  return await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}
// Envía solo la imagen del QR (no el PDF de dos páginas) — pensado para
// mandarla rápido por WhatsApp o correo al conductor: la enseña en la
// pantalla del móvil y el agente la escanea directamente desde ahí.
//   1) Móvil con panel de compartir nativo (aparece WhatsApp si está instalada).
//   2) Escritorio: SIEMPRE se descarga la imagen (es lo único 100% fiable
//      en cualquier navegador) y, si el navegador lo permite, además se
//      copia al portapapeles como atajo — pero sin abrir ninguna pestaña
//      nueva de WhatsApp Web (si se abre una sin sesión iniciada, pide
//      escanear un código y no hay donde pegar). Se usa la que ya tenga
//      abierta el propio usuario.
async function shareDecaQr(id){
  const d = decaDocuments.find(x=>x.id===id);
  if (!d) return;
  if (!d.pdfUrl) { alert('Este DeCA no tiene enlace de QR todavía.'); return; }
  try {
    const blob = await decaQrShareBlob(d);
    const fileName = `QR-${decaPdfFileName(d)}`.replace(/\.pdf$/i, '.png');
    const file = new File([blob], fileName, { type: 'image/png' });

    // El panel de compartir nativo (navigator.share) también existe en
    // Windows/Mac de escritorio, pero ahí no sirve para esto: no ofrece
    // "copiar" ni lleva a WhatsApp Web, y confunde. Solo se usa en el
    // móvil, donde SÍ aparece WhatsApp como una opción real para enviar.
    const esMovil = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent);
    if (esMovil && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: `QR DeCA ${d.codigo || ''}`.trim(), text: 'Escanee este código para ver el DeCA.' });
      return;
    }

    let copiedOk = false;
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); copiedOk = true; } catch (clipErr) { /* no pasa nada, se sigue solo con la descarga */ }
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    alert(
      (copiedOk
        ? 'Imagen del QR descargada (' + fileName + ') y copiada al portapapeles.\n\nVe a tu WhatsApp Web (la pestaña que ya tengas abierta, no hace falta abrir una nueva), entra en la conversación del conductor y pega con Ctrl+V.'
        : 'Imagen del QR descargada (' + fileName + ').')
      + '\n\nSi no se pega, adjúntala a mano: icono del clip 📎 → Fotos y vídeos → elige el archivo descargado.'
    );
  } catch (err) {
    if (err && err.name === 'AbortError') return; // el usuario cerró el panel de compartir
    alert('No se pudo compartir el QR: ' + (err && err.message ? err.message : 'error desconocido.'));
  }
}

async function submitQuickCargador(){
  const errEl = document.getElementById('qc-error');
  errEl.textContent = '';
  const v = id => document.getElementById(id).value.trim();
  const nombre = v('qc-nombre').toUpperCase(), nif = v('qc-nif').toUpperCase();
  if (!nombre) { errEl.textContent = 'Indica la razón social.'; return; }
  const fill = (c) => {
    document.getElementById('dc-cargador-nombre').value = c.nombre;
    document.getElementById('dc-cargador-nif').value = c.nif || '';
    document.getElementById('dc-cargador-domicilio').value = cargadorDireccionCompleta(c);
    const dl = document.getElementById('dc-cargadores-datalist');
    if (dl) dl.innerHTML = decaCargadoresOptionsHtml();
    window.__decaFormDirty = true;
    closeModal();
  };
  // Si ya existe un contacto con ese NIF o ese nombre no se duplica: se usa.
  const dup = contactos.find(c => !c.archived && ((nif && c.nif && c.nif.toUpperCase() === nif) || c.nombre.toUpperCase() === nombre));
  const btn = document.getElementById('qc-submit');
  btn.disabled = true;
  try {
    if (dup) {
      if (!dup.esClienteTransporte) {
        const { data, error } = await supabaseClient.from('contactos').update({ es_cliente_transporte: true }).eq('id', dup.id).select();
        if (error || !data || !data.length) throw (error || new Error('ya existe un contacto con ese nombre o NIF, pero no tienes permiso para marcarlo como cliente de transporte. Pídelo a Administración.'));
        dup.esClienteTransporte = true;
        await logContactoHistorial(dup.id, 'Marcado como Cliente de transporte (desde el DeCA).');
      }
      fill(dup);
      return;
    }
    const row = {
      nombre, nif: nif || null, calle1: v('qc-calle1') || null, calle2: v('qc-calle2') || null, codigo_postal: v('qc-cp') || null,
      ciudad: v('qc-ciudad') || null, provincia: v('qc-provincia') || null, pais: v('qc-pais') || null, es_cliente_transporte: true,
    };
    const { data, error } = await supabaseClient.from('contactos').insert(row).select().single();
    if (error || !data) throw (error || new Error('sin permiso o error desconocido.'));
    const c = { id: data.id, nombre, nombreComercial: '', nif, archived: false, esClienteAlmacen: false, esClienteTransporte: true, esTransportista: false, esAutonomos: false, warehouseIds: [],
      calle1: row.calle1 || '', calle2: row.calle2 || '', codigoPostal: row.codigo_postal || '', ciudad: row.ciudad || '', provincia: row.provincia || '', pais: row.pais || '', logoStoragePath: null };
    contactos.push(c);
    contactos.sort((a,b) => a.nombre.localeCompare(b.nombre));
    await logContactoHistorial(c.id, 'Contacto creado (alta rápida desde el DeCA) como Cliente de transporte.');
    fill(c);
  } catch (err) {
    errEl.textContent = 'No se pudo crear: ' + (err && err.message ? err.message : 'error desconocido.');
    btn.disabled = false;
  }
}

    mercanciaNaturaleza: document.getElementById('dc-mercancia-naturaleza').value.trim(),

    matriculaRemolque: document.getElementById('dc-matricula-remolque').value.trim(),
    observaciones: document.getElementById('dc-observaciones').value.trim(),
    creacionFecha: document.getElementById('dc-creacion-fecha').value,
    creacionHora: document.getElementById('dc-creacion-hora').value,
  };
  const required = ['cargadorNombre','cargadorNif','transportistaNombre','transportistaNif','origen','destino','mercanciaNaturaleza','mercanciaPeso','fechaTransporte','matriculaTractora'];
  if (required.some(k => !fields[k])) { errEl.textContent = 'Rellena todos los campos obligatorios.'; return; }
  btns.forEach(b => { b.disabled = true; b.textContent = 'Generando PDF…'; });
  // La pestaña del PDF se abre ya, dentro del clic (si se abriera después de
  // esperar al servidor, el navegador la bloquearía como ventana emergente).
  const pdfTab = window.open('', '_blank');
  try {
    const editing = editId ? decaDocuments.find(d=>d.id===editId) : null;
    const storagePath = editing && editing.pdfStoragePath ? editing.pdfStoragePath : `deca/${nextId()}.pdf`;
    const { url } = await buildAndUploadDecaPdf({ ...fields, codigo: editing ? editing.codigo : '' }, storagePath, editing ? editing.pdfUrl : null);
    const dbPayload = {
      cargador_nombre: fields.cargadorNombre, cargador_nif: fields.cargadorNif, cargador_domicilio: fields.cargadorDomicilio || null,
      transportista_nombre: fields.transportistaNombre, transportista_nif: fields.transportistaNif, transportista_domicilio: fields.transportistaDomicilio || null,
      origen: fields.origen, destino: fields.destino,
      mercancia_naturaleza: fields.mercanciaNaturaleza, mercancia_peso: fields.mercanciaPeso,
      fecha_transporte: fields.fechaTransporte,
      matricula_tractora: fields.matriculaTractora, matricula_remolque: fields.matriculaRemolque || null, observaciones: fields.observaciones || null,
      creacion_fecha: fields.creacionFecha || null,
      creacion_hora: fields.creacionHora ? (fields.creacionHora.length === 5 ? fields.creacionHora + ':00' : fields.creacionHora) : null,
      pdf_storage_path: storagePath, pdf_url: url, updated_at: new Date().toISOString(),
    };
    let newId = editId;
    if (editing) {
      const { error } = await supabaseClient.from('deca_documents').update(dbPayload).eq('id', editId);
      if (error) throw error;
      Object.assign(editing, { ...fields, pdfStoragePath: storagePath, pdfUrl: url });
    } else {
      const { data, error } = await supabaseClient.from('deca_documents').insert(dbPayload).select().single();
      if (error || !data) throw (error || new Error('sin datos'));
      newId = data.id;
      // El número lo asigna la base de datos al crear el DeCA: se vuelve a
      // generar el PDF (misma ruta y misma URL) para que lo lleve impreso.
      if (data.codigo) await buildAndUploadDecaPdf({ ...fields, codigo: data.codigo }, storagePath, url);
      decaDocuments.unshift({ id: data.id, codigo: data.codigo || '', ...fields, pdfStoragePath: storagePath, pdfUrl: url });
    }
    // Se muestra el PDF del conductor recién generado (QR + casillas).
    try {
      const saved = decaDocuments.find(d => d.id === newId);
      const { driverBytes } = await decaBuildPdfs(saved, saved.pdfUrl);
      if (pdfTab) pdfTab.location = URL.createObjectURL(new Blob([driverBytes], { type: 'application/pdf' }));
    } catch (e) { if (pdfTab) pdfTab.close(); }
    window.__decaFormDirty = false;
    window.__traficoView = 'deca';
    renderHeader(); renderTab();
    openDecaViewModal(newId);
  } catch (err) {
    if (pdfTab) pdfTab.close();
    errEl.textContent = 'No se pudo generar/guardar el DeCA: ' + (err && err.message ? err.message : 'error desconocido.');
    btns.forEach(b => { b.disabled = false; b.textContent = editId ? 'Guardar y regenerar PDF' : 'Generar DeCA'; });
  }
}

function billingTotalForDriverYear(driverId, year){
  return monthlyBillingEntries
    .filter(e=>e.driverId===driverId && e.year===year)
    .reduce((s,e) => {
      const pct = getCommissionForDate(driverId, `${e.year}-${String(e.month+1).padStart(2,'0')}-01`);
      return s + e.billingAmount - e.billingAmount*(pct/100);
    }, 0);
}
function netoForDriverYear(driverId, year){
  const d = drivers.find(x=>x.id===driverId);
  if (d && d.modality === 'piso_movil') return billingTotalForDriverYear(driverId, year);
  return weeklyEntries
    .filter(e=>e.driverId===driverId && e.year===year)
    .reduce((s,e) => {
      const rates = getRatesForDate(driverId, weekDateRange(e.year,e.week).monday);
      const c = computeWeek(rates, e);
      const idx = c.dayAmount * (getIndexPercent(driverId, e.year, weekMonth(e.year,e.week))/100);
      return s + c.neto + idx;
    }, 0);
}
