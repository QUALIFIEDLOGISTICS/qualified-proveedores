async function submitDriver(editId){
  const name = document.getElementById('dr-name').value.trim();
  if (!name) return;
  const data = {
    name,
    companyId: document.getElementById('dr-company').value,
    dni: document.getElementById('dr-dni').value.trim(),
    fleetNumber: document.getElementById('dr-fleet').value.trim(),
  };
  const dbData = { name: data.name, company_id: data.companyId, dni: data.dni, fleet_number: data.fleetNumber };
  if (editId) {
    await supabaseClient.from('drivers').update(dbData).eq('id', editId);
    const idx = drivers.findIndex(d=>d.id===editId);
    drivers[idx] = { ...drivers[idx], ...data };
  } else {
    const { data: row, error } = await supabaseClient.from('drivers').insert({ ...dbData, archived: false }).select().single();
    if (error || !row) return;
    drivers.push({ id: row.id, archived: false, ...data });
  }
  closeModal(); renderTab();
}
async function archiveDriver(id){
  await supabaseClient.from('drivers').update({ archived: true }).eq('id', id);
  const d = drivers.find(x=>x.id===id);
  if (d) d.archived = true;
  closeModal(); backToDriversList();
}

function openKiosk(driverId){
  window.__kioskMode = true;
  window.__kioskDriverId = driverId;
  window.__kioskStep = 'home';
  window.__kioskPhotoDraft = null;
  renderTab();
}
function closeKiosk(){
  window.__kioskMode = false;
  renderTab();
}
function openTodayEntry(driverId){
  return dailyEntries.find(f => f.driverId===driverId && f.date===today() && f.status==='abierta');
}
function tplKiosk(){
  const d = drivers.find(x=>x.id===window.__kioskDriverId);
  if (!d) { window.__kioskMode=false; return `<div class="card" style="text-align:center;color:var(--mutedFaint);padding:32px;">Conductor no encontrado.</div>`; }
  const openEntry = openTodayEntry(d.id);
  const closedToday = dailyEntries.find(f=>f.driverId===d.id && f.date===today() && f.status==='cerrada');
  const step = window.__kioskStep || 'home';

  const shell = (inner) => `
    <div style="max-width:420px;margin:0 auto;position:relative;">
      ${isDriverOnlyAccount() ? '' : `<button onclick="closeKiosk()" style="position:absolute;top:0;right:0;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;">✕ Salir</button>`}
      <div style="text-align:center;margin-bottom:24px;padding-top:${isDriverOnlyAccount() ? '0' : '38px'};">
        <div style="font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.3px;">${esc(d.name)}</div>
        <div style="font-size:13px;color:var(--muted);">${new Date().toLocaleDateString('es-ES',{weekday:'long', day:'2-digit', month:'long'})}</div>
      </div>
      ${inner}
    </div>`;

  if (step === 'start') return shell(tplKioskForm('start', d));
  if (step === 'close') return shell(tplKioskForm('close', openEntry ? d : d));
  if (step === 'history') {
    const closedEntries = dailyEntries.filter(f=>f.driverId===d.id && f.status==='cerrada').sort((a,b)=>b.date.localeCompare(a.date));
    return shell(`
      <button onclick="window.__kioskStep='home'; renderTab();" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;">← Volver</button>
      <div class="card" style="padding:0;overflow-x:auto;">
        <table><thead><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Km</th></tr></thead><tbody>
          ${closedEntries.map(f => `
            <tr>
              <td>${fmtDate(f.date)}</td>
              <td style="color:var(--muted);">${f.timeIn}</td>
              <td style="color:var(--muted);">${f.timeOut}</td>
              <td>${fmtHoursMin(fichajeHours(f))}</td>
              <td style="font-weight:600;">${f.km} km</td>
            </tr>`).join('') || `<tr><td colspan="5" style="color:var(--mutedFaint);text-align:center;padding:20px;">Todavía no tienes jornadas cerradas.</td></tr>`}
        </tbody></table>
      </div>`);
  }

  const historyLink = `<div style="text-align:center;margin-top:16px;"><button onclick="window.__kioskStep='history'; renderTab();" style="background:none;border:none;color:var(--primary);font-size:12.5px;cursor:pointer;padding:0;">Ver mi historial →</button></div>`;

  // HOME: un único botón grande según el estado del día
  if (closedToday && !openEntry) {
    return shell(`
      <div class="card" style="text-align:center;">
        <div style="font-size:32px;margin-bottom:10px;">✅</div>
        <div style="font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.3px;">Jornada de hoy ya fichada</div>
        <div style="font-size:12.5px;color:var(--muted);margin-top:8px;">${closedToday.timeIn} – ${closedToday.timeOut} · ${closedToday.km} km</div>
        <div style="font-size:12px;color:var(--mutedFaint);margin-top:10px;">Vuelve mañana para iniciar la siguiente jornada.</div>
      </div>` + historyLink);
  }
  if (!openEntry) {
    return shell(`
      <button onclick="window.__kioskStep='start'; window.__kioskPhotoDraft=null; renderTab();"
        style="width:100%;padding:40px 20px;border-radius:16px;border:none;background:var(--primary);color:var(--primary-text);cursor:pointer;">
        <div style="font-size:40px;margin-bottom:10px;">▶</div>
        <div style="font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.4px;">Iniciar jornada</div>
        <div style="font-size:12.5px;opacity:.85;margin-top:6px;">Foto del tacógrafo + km inicial</div>
      </button>` + historyLink);
  } else {
    return shell(`
      <div class="card" style="margin-bottom:18px;text-align:center;">
        <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;">Jornada en curso</div>
        <div style="font-family:var(--display);font-size:24px;">Iniciada a las ${openEntry.timeIn}</div>
        <div style="font-size:12.5px;color:var(--mutedFaint);margin-top:4px;">Km inicial: ${openEntry.kmStart}</div>
      </div>
      <button onclick="window.__kioskStep='close'; window.__kioskPhotoDraft=null; renderTab();"
        style="width:100%;padding:40px 20px;border-radius:16px;border:none;background:var(--danger);color:#fff;cursor:pointer;">
        <div style="font-size:40px;margin-bottom:10px;">⏹</div>
        <div style="font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.4px;">Cerrar jornada</div>
        <div style="font-size:12.5px;opacity:.85;margin-top:6px;">Foto del tacógrafo + km final</div>
      </button>` + historyLink);
  }
}
function tplKioskForm(mode, driver){
  const isStart = mode === 'start';
  return `
    <div class="card">
      <div style="font-family:var(--display);font-size:17px;text-transform:uppercase;margin-bottom:16px;">${isStart?'Iniciar jornada':'Cerrar jornada'}</div>
      <div class="field"><label style="font-size:14px;">${isStart?'Km inicial':'Km final'} (tacógrafo)</label>
        <input id="ks-km" type="number" step="0.1" style="font-size:18px;padding:14px;" />
      </div>
      <div class="field">
        <label style="font-size:14px;">Foto del tacógrafo</label>
        <div id="ks-dropzone"
          ondragover="event.preventDefault(); event.stopPropagation(); this.style.borderColor='var(--primary)';"
          ondragleave="event.preventDefault(); event.stopPropagation(); this.style.borderColor='var(--border)';"
          ondrop="event.preventDefault(); event.stopPropagation(); this.style.borderColor='var(--border)'; addKioskPhoto(event.dataTransfer.files[0]);"
          onclick="document.getElementById('ks-photo-input').click();"
          style="border:2px dashed var(--border);border-radius:12px;padding:28px 12px;text-align:center;cursor:pointer;">
          <div id="ks-photo-preview" style="font-size:14px;color:var(--muted);">📷 Toca para hacer la foto</div>
          <input type="file" id="ks-photo-input" accept="image/*" capture="environment" onclick="event.stopPropagation();" onchange="addKioskPhoto(this.files[0])" style="display:none;" />
        </div>
      </div>
      <div id="ks-error" style="color:var(--danger);font-size:13px;margin-bottom:10px;"></div>
      <button onclick="${isStart?'submitKioskStart':'submitKioskClose'}('${driver.id}')"
        style="width:100%;padding:16px;border-radius:10px;border:none;background:var(--primary);color:var(--primary-text);font-family:var(--display);font-size:16px;text-transform:uppercase;cursor:pointer;margin-bottom:10px;">
        Confirmar ${isStart?'inicio':'cierre'}
      </button>
      <button onclick="window.__kioskStep='home'; renderTab();" style="width:100%;background:none;border:none;color:var(--muted);font-size:13px;padding:8px;cursor:pointer;">Cancelar</button>
    </div>`;
}
async function addKioskPhoto(file){
  if (!file) return;
  if (!file.type.startsWith('image/')) { alert('Solo se admiten imágenes.'); return; }
  const path = `fichajes/${nextId()}-${file.name}`;
  const { error } = await supabaseClient.storage.from(DOCS_BUCKET).upload(path, file);
  if (error) { alert('No se pudo subir la foto.'); return; }
  const url = await signedUrl(path);
  window.__kioskPhotoDraft = { name: file.name, storage_path: path, url };
  document.getElementById('ks-photo-preview').innerHTML = `✅ Foto tomada <span style="color:var(--mutedFaint);">(toca para repetirla)</span>`;
}
async function submitKioskStart(driverId){
  const km = document.getElementById('ks-km').value;
  const errEl = document.getElementById('ks-error');
  if (km === '') { errEl.textContent = 'Indica el km inicial.'; return; }
  if (!window.__kioskPhotoDraft) { errEl.textContent = 'Haz la foto del tacógrafo antes de confirmar.'; return; }
  if (openTodayEntry(driverId)) { errEl.textContent = 'Ya hay una jornada abierta hoy.'; return; }
  if (dailyEntries.some(f=>f.driverId===driverId && f.date===today() && f.status==='cerrada')) { errEl.textContent = 'Hoy ya has fichado una jornada completa.'; return; }
  const timeIn = new Date().toTimeString().slice(0,5);
  const { data, error } = await supabaseClient.from('daily_entries').insert({
    driver_id: driverId, date: today(), status: 'abierta', time_in: timeIn,
    km_start: Number(km), photo_in_path: window.__kioskPhotoDraft.storage_path,
  }).select().single();
  if (error || !data) { errEl.textContent = 'No se pudo guardar.'; return; }
  dailyEntries.push({
    id: data.id, driverId, date: today(), status: 'abierta',
    timeIn, timeOut: null, kmStart: Number(km), kmEnd: null, km: null,
    photoIn: window.__kioskPhotoDraft, photoOut: null,
  });
  window.__kioskStep = 'home'; renderTab();
}
async function submitKioskClose(driverId){
  const km = document.getElementById('ks-km').value;
  const errEl = document.getElementById('ks-error');
  const entry = openTodayEntry(driverId);
  if (!entry) { errEl.textContent = 'No hay ninguna jornada abierta.'; return; }
  if (km === '') { errEl.textContent = 'Indica el km final.'; return; }
  if (Number(km) < entry.kmStart) { errEl.textContent = 'El km final no puede ser menor que el inicial.'; return; }
  if (!window.__kioskPhotoDraft) { errEl.textContent = 'Haz la foto del tacógrafo antes de confirmar.'; return; }
  const timeOut = new Date().toTimeString().slice(0,5);
  const kmEnd = Number(km);
  const kmTotal = Math.round((kmEnd - entry.kmStart)*10)/10;
  await supabaseClient.from('daily_entries').update({
    time_out: timeOut, km_end: kmEnd, km: kmTotal, status: 'cerrada', photo_out_path: window.__kioskPhotoDraft.storage_path,
  }).eq('id', entry.id);
  entry.timeOut = timeOut;
  entry.kmEnd = kmEnd;
  entry.km = kmTotal;
  entry.photoOut = window.__kioskPhotoDraft;
  entry.status = 'cerrada';
  const { year: wYear, week: wWeek } = getISOWeek(entry.date);
  await recalcWeeksFromFichajes(driverId, wYear);
  window.__autonomosYear = wYear;
  window.__autonomosMonth = weekMonth(wYear, wWeek);
  closeKiosk();
}
async function deleteFichaje(id){
  const f = dailyEntries.find(x=>x.id===id);
  await supabaseClient.from('daily_entries').delete().eq('id', id);
  dailyEntries = dailyEntries.filter(f=>f.id!==id);
  if (f) {
    const { year, week } = getISOWeek(f.date);
    await recalcWeeksFromFichajes(f.driverId, year, { year, week });
  }
  renderTab();
}

/* ============================= FICHAJES (pestaña independiente) ============================= */
function openFichajesDriverDetail(id){ window.__fichajesView='detalle'; window.__fichajesDriverId=id; window.__fichajesYear = window.__fichajesYear || new Date().getFullYear(); renderTab(); }
function backToFichajesDriversList(){ window.__fichajesView='lista'; window.__fichajesDriverId=null; renderTab(); }
function tplFichajes(){
  if (window.__fichajesView === 'detalle' && window.__fichajesDriverId) return tplFichajesDriverDetail();
  return tplFichajesDriversList();
}
function tplFichajesDriversList(){
  const activeDrivers = drivers.filter(d=>!d.archived);
  return `
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${activeDrivers.map(d => {
        const co = companies.find(c=>c.id===d.companyId);
        const count = dailyEntries.filter(f=>f.driverId===d.id).length;
        const openNow = openTodayEntry(d.id);
        return `
        <div class="card" style="cursor:pointer;" onclick="openFichajesDriverDetail('${d.id}')">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <div style="width:38px;height:38px;border-radius:99px;background:var(--primary);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px;flex-shrink:0;">${esc((d.name||'?').trim().charAt(0).toUpperCase())}</div>
              <div>
                <div style="font-family:var(--display);font-size:15.5px;">${esc(d.name)}</div>
                <div style="font-size:11.5px;color:var(--mutedFaint);">${esc(co?co.name:'')}${openNow?' · <span style="color:#D9A72C;font-weight:600;">jornada abierta</span>':''}</div>
              </div>
            </div>
            <span style="font-size:12px;color:var(--muted);">${count} fichaje${count!==1?'s':''}</span>
          </div>
        </div>`;
      }).join('') || `<div class="card" style="color:var(--mutedFaint);text-align:center;padding:32px;">Sin conductores activos todavía.</div>`}
    </div>`;
}
function tplFichajesDriverDetail(){
  const d = drivers.find(x=>x.id===window.__fichajesDriverId);
  if (!d) { window.__fichajesView='lista'; return tplFichajesDriversList(); }

async function submitAddFichaje(driverId){
  const errEl = document.getElementById('af-error');
  const btn = document.getElementById('af-submit-btn');
  errEl.textContent = '';
  const date = document.getElementById('af-date').value;
  const timeIn = document.getElementById('af-timein').value;
  const timeOut = document.getElementById('af-timeout').value || null;
  const kmStartRaw = document.getElementById('af-kmstart').value;
  const kmEndRaw = document.getElementById('af-kmend').value;
  if (!date) { errEl.textContent = 'Indica la fecha.'; return; }
  if (!timeIn) { errEl.textContent = 'Indica la hora de entrada.'; return; }
  if (kmStartRaw === '') { errEl.textContent = 'Indica el km inicial.'; return; }
  if (dailyEntries.some(f=>f.driverId===driverId && f.date===date)) { errEl.textContent = 'Ya existe un fichaje de este conductor en esa fecha. Corrígelo desde la tabla en vez de crear otro.'; return; }
  const kmStart = Number(kmStartRaw);
  const kmEnd = kmEndRaw === '' ? null : Number(kmEndRaw);
  if (kmEnd != null && kmEnd < kmStart) { errEl.textContent = 'El km final no puede ser menor que el inicial.'; return; }
  const km = kmEnd != null ? Math.round((kmEnd - kmStart)*10)/10 : null;
  const status = (timeOut && kmEnd != null) ? 'cerrada' : 'abierta';
  btn.disabled = true;
  try {
    const { data, error } = await supabaseClient.from('daily_entries').insert({
      driver_id: driverId, date, status, time_in: timeIn, time_out: timeOut,
      km_start: kmStart, km_end: kmEnd, km,
    }).select().single();
    if (error) throw error;
    dailyEntries.push({
      id: data.id, driverId, date, status, timeIn, timeOut,
      kmStart, kmEnd, km, photoIn: null, photoOut: null,
    });
    const { year } = getISOWeek(date);
    closeModal();
    await recalcWeeksFromFichajes(driverId, year);
  } catch (error) {
    errEl.textContent = 'No se pudo guardar: ' + (error.message || 'error desconocido.');
    btn.disabled = false;
  }
}

async function recalcWeeksFromFichajes(driverId, year, touchedWeek){
  const fichajes = dailyEntries.filter(f=>f.driverId===driverId && f.status==='cerrada');
  const byWeek = {};
  fichajes.forEach(f => {
    const { year: y, week } = getISOWeek(f.date);
    const key = y+'-'+week;
    if (!byWeek[key]) byWeek[key] = { year: y, week, days: 0, km: 0, hours: 0 };
    byWeek[key].days += 1;
    byWeek[key].km += Number(f.km||0);
    byWeek[key].hours += fichajeHours(f);
  });
  const rows = Object.values(byWeek).map(w => ({
    driver_id: driverId, year: w.year, week: w.week,
    days_worked: w.days, km: Math.round(w.km*10)/10, hours: Math.round(w.hours*100)/100,
  }));
  if (rows.length) {
    await supabaseClient.from('weekly_entries').upsert(rows, { onConflict: 'driver_id,year,week' });
  }
  // Si la semana que se acaba de tocar (borrar/editar un fichaje) se ha
  // quedado sin ningún fichaje cerrado, su fila en weekly_entries no
  // aparece en byWeek y el upsert de arriba nunca la toca — se queda
  // como un resto fantasma con datos viejos si no se borra aquí.
  if (touchedWeek && !byWeek[touchedWeek.year+'-'+touchedWeek.week]) {
    await supabaseClient.from('weekly_entries').delete()
      .eq('driver_id', driverId).eq('year', touchedWeek.year).eq('week', touchedWeek.week);
  }
  // Sin semana concreta (botón "Recalcular semanas"): repaso completo
  // del año — cualquier semana ya guardada que ya no tenga ningún
  // fichaje cerrado detrás se borra, para limpiar restos fantasma
  // acumulados antes de este arreglo.
  if (!touchedWeek) {
    const orphaned = weeklyEntries.filter(e => e.driverId===driverId && e.year===year && !byWeek[e.year+'-'+e.week]);
    for (const e of orphaned) {
      await supabaseClient.from('weekly_entries').delete()
        .eq('driver_id', driverId).eq('year', e.year).eq('week', e.week);
    }
  }
  await loadWeeklyEntries();
  window.__autonomosYear = year;
  renderTab();
}

async function submitWeek(driverId, editId){
  const year = Number(document.getElementById('wk-year').value||0);
  const week = Number(document.getElementById('wk-week').value||0);
  const errEl = document.getElementById('wk-error');
  if (!week || week<1 || week>53) { errEl.textContent = 'Indica un número de semana válido (1-53).'; return; }
  const dup = weeklyEntries.find(e => e.driverId===driverId && e.year===year && e.week===week && e.id!==editId);
  if (dup) { errEl.textContent = `Ya existe una entrada para la semana ${week} de ${year} en este conductor.`; return; }

  const daysInput = document.getElementById('wk-days');
  const kmInput = document.getElementById('wk-km');
  const hoursInput = document.getElementById('wk-hours');
  const existing = weeklyEntries.find(e=>e.id===editId);
  const data = {
    driverId, year, week,
    daysWorked: daysInput.disabled ? existing.daysWorked : Number(daysInput.value||0),
    km: kmInput.disabled ? existing.km : Number(kmInput.value||0),
    hours: hoursInput.disabled ? existing.hours : Number(hoursInput.value||0),
    supplements: existing.supplements,
    gasoil: existing.gasoil,
    peajes: existing.peajes,
    otros: existing.otros,
  };
  const dbData = { driver_id: driverId, year, week, days_worked: data.daysWorked, km: data.km, hours: data.hours };
  await supabaseClient.from('weekly_entries').update(dbData).eq('id', editId);
  const idx = weeklyEntries.findIndex(e=>e.id===editId);
  weeklyEntries[idx] = { ...weeklyEntries[idx], ...data };
  window.__autonomosYear = year;
  closeModal(); renderTab();
}

function driverLabel(d){ const co = companies.find(c=>c.id===d.companyId); return `${d.name}${co?' · '+co.name:''}`; }
// Sub-permisos anidados por pestaña: cada entrada añade un icono ⚙ junto a
// la casilla de esa pestaña que abre un mini-panel flotante con sus propias
// casillas. Añadir aquí una pestaña nueva es lo único que hace falta cuando
// surja otro sub-permiso (p.ej. Documentos → subir archivos).
const TAB_SUBPERMS = {
  citas: (p) => `
    <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap;">
      <input type="checkbox" ${(p.isAdmin||p.canEditSchedule)?'checked':''} ${(p.isAdmin || !p.allowedTabs.includes('citas'))?'disabled':''} onchange="toggleProfileSchedule('${p.id}', this.checked)" />
      Puede editar el horario del almacén
    </label>`,
};
function toggleSubpanel(userId, tabId){
  const key = userId+':'+tabId;
  window.__openSubpanel = (window.__openSubpanel === key) ? null : key;
  renderTab();
}
function tplAdmin(){
  return `
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:16px;line-height:1.5;">
      Para dar de alta un proveedor nuevo, créalo en <strong>Supabase → Authentication → Users</strong> — en cuanto exista, aparecerá aquí para marcarle qué pestañas ve. Las pestañas con un icono ⚙ tienen sub-permisos propios — pulsa el icono para abrirlos. Para que una cuenta solo pueda fichar su jornada, vincúlala a un conductor en la última columna (ignora las pestañas marcadas).
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table><thead><tr>
        <th>Correo</th><th style="text-align:center;">Admin</th>
        ${TABS.map(t=>`<th style="text-align:center;">${esc(tabLabelShort(t))}</th>`).join('')}
        <th>Conductor vinculado</th>
      </tr></thead><tbody>
        ${ALL_PROFILES.map(p => `
          <tr>
            <td>${esc(p.email)}${p.id===CURRENT_USER_ID?' <span style="color:var(--mutedFaint);font-size:11px;">(tú)</span>':''}</td>
            <td style="text-align:center;"><input type="checkbox" ${p.isAdmin?'checked':''} onchange="toggleProfileAdmin('${p.id}', this.checked)" /></td>
            ${TABS.map(t => `
              <td style="text-align:center;position:relative;">
                <input type="checkbox" ${(p.isAdmin||p.allowedTabs.includes(t.id))?'checked':''} ${p.isAdmin?'disabled':''} onchange="toggleProfileTab('${p.id}','${t.id}', this.checked)" />
                ${TAB_SUBPERMS[t.id] ? `
                  <button type="button" onclick="toggleSubpanel('${p.id}','${t.id}')" title="Sub-permisos de ${esc(tabLabelShort(t))}" style="background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;vertical-align:middle;margin-left:2px;padding:2px;">⚙</button>
                  ${window.__openSubpanel === (p.id+':'+t.id) ? `
                    <div onclick="event.stopPropagation();" style="position:absolute;top:100%;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;box-shadow:0 10px 28px rgba(0,0,0,0.14);z-index:30;text-align:left;margin-top:6px;">
                      <div style="font-size:10px;color:var(--mutedFaint);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;white-space:nowrap;">Sub-permisos de ${esc(tabLabelShort(t))}</div>
                      ${TAB_SUBPERMS[t.id](p)}
                      <button type="button" onclick="toggleSubpanel('${p.id}','${t.id}')" style="display:block;margin-top:10px;background:none;border:none;color:var(--primary);font-size:11.5px;cursor:pointer;padding:0;">Cerrar</button>
                    </div>` : ''}
                ` : ''}
              </td>`
            ).join('')}
            <td>
              <select onchange="setProfileDriver('${p.id}', this.value)" style="min-width:170px;">
                <option value="">— Ninguno —</option>
                ${drivers.map(d=>`<option value="${d.id}" ${p.driverId===d.id?'selected':''}>${esc(driverLabel(d))}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('') || `<tr><td colspan="${3+TABS.length}" style="color:var(--mutedFaint);text-align:center;padding:20px;">Sin usuarios todavía</td></tr>`}
      </tbody></table>
    </div>`;
}

/* ============================= INICIO ============================= */
async function loadWarehouseModuleData(){
  await Promise.all([loadClients(), loadPallets(), loadMovements(), loadAppointments(), loadUnscheduled(), loadSchedules(), loadWarehouseTasks()]);
}
async function loadAutonomosModuleData(){
  await Promise.all([loadCompanies(), loadDrivers(), loadDriverRates(), loadWeeklyEntries(), loadFuelEntries(), loadSupplementEntries(), loadExpenseEntries(), loadIndexationEntries(), loadDailyEntries()]);
}
let isRecoveryFlow = window.location.hash.includes('type=recovery') || window.location.search.includes('code=');
if (isRecoveryFlow) window.location.replace('reset-password.html' + window.location.search + window.location.hash);

(async function initApp(){
  if (isRecoveryFlow) return;
  const session = await getCurrentSession();
  if (isRecoveryFlow) return;
  if (!session) { window.location.href = 'index.html'; return; }
  document.getElementById('current-user-email').textContent = session.user.email;
  await loadProfile();

  if (isDriverOnlyAccount()) {
    document.getElementById('sidebar-aside').style.display = 'none';
    await Promise.all([loadDrivers(), loadDailyEntries()]);
    document.getElementById('app-root').style.display = '';
    document.getElementById('wh-title-row').innerHTML = '';
    document.getElementById('wh-sub').textContent = '';
    currentTab = 'autonomos';
    openKiosk(PROFILE.driverId);
    return;
  }

  await Promise.all([loadWarehouseModuleData(), loadAutonomosModuleData()]);
  const allowed = visibleTabs().map(t=>t.id);
  if (!allowed.includes(currentTab)) currentTab = allowed[0] || null;
  document.getElementById('app-root').style.display = '';
  if (currentTab) { renderSidebar(); renderHeader(); renderTab(); }
  else { document.getElementById('tab-content').innerHTML = '<div class="card" style="text-align:center;color:var(--mutedFaint);padding:32px;">Tu cuenta todavía no tiene ninguna pestaña activada. Contacta con el administrador.</div>'; renderSidebar(); }
})();

supabaseClient.auth.onAuthStateChange((event) => {
  if (event === 'SIGNED_OUT') window.location.href = 'index.html';
  if (event === 'PASSWORD_RECOVERY') { isRecoveryFlow = true; window.location.href = 'reset-password.html'; }
});
</script>
</body>
</html>
