<style>
  :root{
    --bg:#F4F6F8; --panel:#FFFFFF; --panel2:#F0F2F5; --border:#E1E5EA;
    --text:#1B2430; --muted:#69727C; --mutedFaint:#9AA2AB;
    --success:#3F8F5F; --danger:#C1443D;
    --primary:#1B3A6B; --primary-text:#FFFFFF;
    --display: 'Montserrat', 'Arial', sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);}
  table{border-collapse:collapse;width:100%;}
  th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);}
  td{padding:11px 12px;font-size:13.5px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .dr-row:hover td{background:var(--panel2);}
  .dr-table td{white-space:nowrap;}
  input,select,textarea{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);font-family:var(--body);font-size:14px;outline:none;}
  input[type="checkbox"]{all:revert;cursor:pointer;width:16px;height:16px;}
  textarea{resize:vertical;min-height:60px;}
  ::placeholder{color:var(--mutedFaint);}
  button{cursor:pointer;font-family:var(--body);}
  .btn{font-weight:600;font-size:13px;border-radius:6px;padding:9px 16px;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--primary);color:var(--primary-text);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn:hover{filter:brightness(1.15);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(27,58,107,0.04);}
  .home-module-card{transition:border-color .12s,box-shadow .12s;}
  .home-module-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(27,58,107,0.08);}
  .badge{font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:999px;color:#0F1216;text-transform:uppercase;white-space:nowrap;}
  .hidden{display:none !important;}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  .modal-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,8,10,.7);padding:16px;}
  .modal-box{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal-title{margin:0;font-family:var(--display);font-size:19px;letter-spacing:.3px;text-transform:uppercase;}
  .close-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}

  /* Tabla financiera (histórico semanal de autónomos) */
  .fin-table{
    --fin-jornada:106,124,140; --fin-ingresos:63,143,95;
    --fin-gastos:193,68,61; --fin-ajustes:196,143,26;
    border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;background:var(--panel);
  }
  .fin-table th, .fin-table td{white-space:nowrap;}
  .fin-table thead th{background:var(--panel);}
  .fin-table .fin-group-row th{
    font-size:8.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--mutedFaint);
    padding:6px 4px 4px;border-bottom:none;text-align:center;

  .fin-table .fin-group-row th.fin-g-jornada{color:rgb(var(--fin-jornada));}
  .fin-table .fin-group-row th.fin-g-ingresos{color:rgb(var(--fin-ingresos));}
  .fin-table .fin-group-row th.fin-g-gastos{color:rgb(var(--fin-gastos));}
  .fin-table .fin-group-row th.fin-g-ajustes{color:rgb(var(--fin-ajustes));}
  .fin-table .fin-col-row th{
    padding:3px 4px 6px;cursor:help;font-size:9.5px;font-weight:600;color:var(--muted);
    border-bottom:1px solid var(--border);
  }
  .fin-table td{padding:8px 4px;border-bottom:1px solid var(--border);color:var(--text);font-size:12px;}
  .fin-table td.fin-num, .fin-table th.fin-num{text-align:right;}
  .fin-table td.fin-center, .fin-table th.fin-center{text-align:center;}
  .fin-table td.fin-first, .fin-table th.fin-first{position:sticky;left:0;z-index:2;background:var(--panel);}
  .fin-table tbody tr.fin-row:hover{background:var(--panel2) !important;}
  .fin-table tbody tr.fin-row:hover td.fin-first{background:var(--panel2) !important;}
  .fin-table td.fin-neto, .fin-table th.fin-neto{
    background:var(--panel);border-left:2px solid var(--primary);
  }
  .fin-table td.fin-eurkm, .fin-table th.fin-eurkm{
    position:sticky;right:0;z-index:2;background:var(--panel);
  }
  .fin-table tbody tr.fin-row:hover td.fin-neto{background:var(--panel2) !important;}
  .fin-table tbody tr.fin-row:hover td.fin-eurkm{background:var(--panel2) !important;}
  /* Tinte muy sutil por apartado (Jornada/Ingresos/Gastos/Ajustes), para
     que se lea de un vistazo dónde acaba uno y empieza el siguiente,
     tanto en la cabecera como en el cuerpo de la tabla. */
  .fin-table .fin-g-jornada{background:rgba(var(--fin-jornada),.045);}
  .fin-table .fin-g-ingresos{background:rgba(var(--fin-ingresos),.055);}
  .fin-table .fin-g-gastos{background:rgba(var(--fin-gastos),.045);}
  .fin-table .fin-g-ajustes{background:rgba(var(--fin-ajustes),.06);}
  /* Filas "cebra": semanas alternas un poco más marcadas, para no
     perderse al leer de una fila a la siguiente. */
  .fin-table tbody tr.fin-row:nth-child(even) td.fin-first{background:var(--panel2);}
  .fin-table tbody tr.fin-row:nth-child(even) td.fin-neto{background:var(--panel2);}
  .fin-table tbody tr.fin-row:nth-child(even) td.fin-eurkm{background:var(--panel2);}
  .fin-table tbody tr.fin-row:nth-child(even) td.fin-g-jornada{background:rgba(var(--fin-jornada),.1);}
  .fin-table tbody tr.fin-row:nth-child(even) td.fin-g-ingresos{background:rgba(var(--fin-ingresos),.12);}
  .fin-table tbody tr.fin-row:nth-child(even) td.fin-g-gastos{background:rgba(var(--fin-gastos),.1);}
  .fin-table tbody tr.fin-row:nth-child(even) td.fin-g-ajustes{background:rgba(var(--fin-ajustes),.13);}
  .fin-table tbody tr.fin-row:hover td.fin-g-jornada{background:rgba(var(--fin-jornada),.09) !important;}
  .fin-table tbody tr.fin-row:hover td.fin-g-ingresos{background:rgba(var(--fin-ingresos),.1) !important;}
  .fin-table tbody tr.fin-row:hover td.fin-g-gastos{background:rgba(var(--fin-gastos),.09) !important;}
  .fin-table tbody tr.fin-row:hover td.fin-g-ajustes{background:rgba(var(--fin-ajustes),.11) !important;}
  .fin-table .fin-g-start{border-left:1px solid var(--border);}
  .fin-pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .fin-total-row td{background:#EEF1F5;border-top:2px solid var(--primary);border-bottom:none;font-weight:700;color:var(--text);}
  .fin-total-row td.fin-first{position:sticky;left:0;background:#EEF1F5;}
  .fin-total-row td.fin-neto{background:#EEF1F5;border-left:2px solid var(--primary);}
  .fin-total-row td.fin-eurkm{position:sticky;right:0;background:#EEF1F5;}
  @media (max-width: 768px){
    main{padding:16px !important;min-width:0 !important;}
    .fin-table{min-width:1220px;}
  }
</style>

<script>
/* =========================================================
   Conectado a Supabase (schema.sql). Los arrays/objetos de abajo
   se hidratan al arrancar (ver loadWarehouseModuleData()) y cada
   función que los modifica escribe primero en Supabase y solo
   actualiza la copia local si la escritura tuvo éxito.
========================================================= */

const WAREHOUSES = [
  { id: 'balsareny',       name: 'Balsareny',             subtitle: 'Zonas y estanterías', location_hint: 'Ej. Zona 3 · Estantería A2', location: 'Balsareny',             color: '#2E6F95' },
  { id: 'sant-fruitos',    name: 'Sant Fruitós de Bages',  subtitle: 'Zonas',                location_hint: 'Ej. Zona 5',                   location: 'Sant Fruitós de Bages',  color: '#C98A2E' },
  { id: 'pirelli-manresa', name: 'Pirelli Manresa',        subtitle: 'Naves y zonas',        location_hint: 'Ej. Nave 2 · Zona B',          location: 'Manresa',                 color: '#8A4A35' },
];

const nextId = (p) => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${p}-${Date.now()}-${Math.random().toString(16).slice(2)}`;

const EU_COUNTRIES = ['España','Alemania','Andorra','Austria','Bélgica','Bielorrusia','Bosnia y Herzegovina','Bulgaria','Chipre','Ciudad del Vaticano','Croacia','Dinamarca','Eslovaquia','Eslovenia','Estonia','Finlandia','Francia','Grecia','Hungría','Irlanda','Islandia','Italia','Kosovo','Letonia','Liechtenstein','Lituania','Luxemburgo','Macedonia del Norte','Malta','Moldavia','Mónaco','Montenegro','Noruega','Países Bajos','Polonia','Portugal','Reino Unido','República Checa','Rumanía','Rusia','San Marino','Serbia','Suecia','Suiza','Ucrania'];
function paisOptionsHtml(current){
  const options = EU_COUNTRIES.slice();
  if (current && !options.includes(current)) options.push(current);
  const selected = current || 'España';
  return options.map(p => `<option value="${esc(p)}" ${p===selected?'selected':''}>${esc(p)}</option>`).join('');
}

// Los 2 primeros dígitos de un código postal español son el código oficial
// de provincia (el mismo que usa el DNI/NIF) — es una tabla fija, no hace
// falta ninguna llamada externa para rellenar la provincia a partir del CP.
const CP_PROVINCIA = {
  '01':'Álava','02':'Albacete','03':'Alicante','04':'Almería','05':'Ávila','06':'Badajoz','07':'Baleares',
  '08':'Barcelona','09':'Burgos','10':'Cáceres','11':'Cádiz','12':'Castellón','13':'Ciudad Real','14':'Córdoba',
  '15':'A Coruña','16':'Cuenca','17':'Girona','18':'Granada','19':'Guadalajara','20':'Gipuzkoa','21':'Huelva',
  '22':'Huesca','23':'Jaén','24':'León','25':'Lleida','26':'La Rioja','27':'Lugo','28':'Madrid','29':'Málaga',
  '30':'Murcia','31':'Navarra','32':'Ourense','33':'Asturias','34':'Palencia','35':'Las Palmas','36':'Pontevedra',
  '37':'Salamanca','38':'Santa Cruz de Tenerife','39':'Cantabria','40':'Segovia','41':'Sevilla','42':'Soria',
  '43':'Tarragona','44':'Teruel','45':'Toledo','46':'Valencia','47':'Valladolid','48':'Bizkaia','49':'Zamora',
  '50':'Zaragoza','51':'Ceuta','52':'Melilla',
};
// Rellena Ciudad y Provincia a partir de la respuesta de zippopotam.us
// para países que no tienen tabla fija de provincia (Portugal, Francia):
// usa "state" (distrito/región) tal cual lo devuelve la API.
async function fillCiudadProvinciaFromApi(prefix, countryCode, cp){
  try {
    const res = await fetch(`https://api.zippopotam.us/${countryCode}/${cp}`);
    if (!res.ok) return;
    const data = await res.json();
    const place = data.places && data.places[0];
    if (!place) return;
    if (place['place name']) document.getElementById(`${prefix}-ciudad`).value = place['place name'];
    if (place['state']) document.getElementById(`${prefix}-provincia`).value = place['state'];
  } catch (e) { /* sin conexión o CP no existe: se deja para rellenar a mano */ }
}
// Al completar un CP español (5 dígitos), portugués (NNNN-NNN) o francés
// (5 dígitos), rellena Provincia al momento cuando hay tabla fija
// (España) y pide el resto a un servicio externo gratuito y sin clave
// (zippopotam.us); si no hay conexión o el CP no existe, no pasa nada y
// el usuario rellena el resto a mano.
async function autofillCiudadProvinciaFromCp(prefix){
  const paisEl = document.getElementById(`${prefix}-pais`);
  const pais = paisEl ? paisEl.value : 'España';
  const cpRaw = document.getElementById(`${prefix}-cp`).value.trim();
  if (pais === 'España') {
    if (!/^\d{5}$/.test(cpRaw)) return;
    const provincia = CP_PROVINCIA[cpRaw.slice(0,2)];
    if (provincia) document.getElementById(`${prefix}-provincia`).value = provincia;
    try {
      const res = await fetch(`https://api.zippopotam.us/es/${cpRaw}`);
      if (!res.ok) return;
      const data = await res.json();
      const place = data.places && data.places[0];
      if (place && place['place name']) document.getElementById(`${prefix}-ciudad`).value = place['place name'];
    } catch (e) { /* sin conexión o CP no encontrado: se deja para rellenar a mano */ }
    return;
  }
  if (pais === 'Portugal') {
    if (!/^\d{4}-\d{3}$/.test(cpRaw)) return;
    await fillCiudadProvinciaFromApi(prefix, 'pt', cpRaw);
    return;
  }
  if (pais === 'Francia') {
    if (!/^\d{5}$/.test(cpRaw)) return;
    await fillCiudadProvinciaFromApi(prefix, 'fr', cpRaw);
  }
}
function onContactoCpInput(){ return autofillCiudadProvinciaFromCp('ct'); }

const DOCS_BUCKET = 'qualified-docs';
async function signedUrl(path){
  if (!path) return null;
  const { data } = await supabaseClient.storage.from(DOCS_BUCKET).createSignedUrl(path, 21600);
  return data ? data.signedUrl : null;
}
async function loadAttachmentsFor(parentType, ids){
  if (!ids.length) return {};
  const { data } = await supabaseClient.from('attachments').select('*').eq('parent_type', parentType).in('parent_id', ids);
  const byParent = {};
  for (const row of (data||[])) {
    const url = await signedUrl(row.storage_path);
    (byParent[row.parent_id] = byParent[row.parent_id] || []).push({ id: row.id, name: row.name, size: row.size, storage_path: row.storage_path, url });
  }
  return byParent;
}
async function syncAttachments(parentType, parentId){
  await supabaseClient.from('attachments').delete().eq('parent_type', parentType).eq('parent_id', parentId);
  const draft = window.__attachmentsDraft || [];
  if (draft.length) {
    await supabaseClient.from('attachments').insert(draft.map(a => ({ parent_type: parentType, parent_id: parentId, name: a.name, storage_path: a.storage_path, size: a.size })));
  }
}

let clients = [];
async function loadClients(){
  const { data } = await supabaseClient.from('contactos').select('id,nombre,archived,contacto_warehouses(warehouse_id)').eq('es_cliente_almacen', true).order('nombre');
  clients = (data||[]).map(r => ({ id: r.id, name: r.nombre, archived: r.archived, warehouseIds: (r.contacto_warehouses||[]).map(cw=>cw.warehouse_id) }));
}

let pallets = {};
async function loadPallets(){
  const { data } = await supabaseClient.from('pallets').select('*').order('date_in', { ascending: false });
  pallets = {}; WAREHOUSES.forEach(w => pallets[w.id] = []);
  (data||[]).forEach(p => pallets[p.warehouse_id].push({
    id: p.id, clientId: p.client_id, reference: p.reference, description: p.description,
    quantity: Number(p.quantity), unit: p.unit, location: p.location, status: p.status, dateIn: p.date_in,
  }));
}

let movements = {};
async function loadMovements(){
  const { data } = await supabaseClient.from('movements').select('*').order('date', { ascending: false });
  movements = {}; WAREHOUSES.forEach(w => movements[w.id] = []);
  (data||[]).forEach(m => movements[m.warehouse_id].push({
    id: m.id, palletId: m.pallet_id, clientId: m.client_id, type: m.type, quantity: Number(m.quantity), date: m.date, ref: m.ref,
  }));
}

const fmtDate = (d) => new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
// Igual que fmtDate pero con el año — para históricos que viven años
// (tarifas, comisión), donde "05 ago" solo no basta para distinguir
// entre ediciones de distintos años.
const fmtDateY = (d) => new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toDateStr(d){
  // formatea en fecha LOCAL (evita el desfase de toISOString, que convierte a UTC)
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const today = () => toDateStr(new Date());

const APPT_STATUS_COLORS = { planificado: '#D9A72C', completado: '#3F8F5F' };
const APPT_STATUS_LABELS = { planificado: 'Planificada', completado: 'Completada' };

let appointments = {};
async function loadAppointments(){
  const { data } = await supabaseClient.from('appointments').select('*');
  appointments = {}; WAREHOUSES.forEach(w => appointments[w.id] = []);
  const ids = (data||[]).map(a=>a.id);
  const attByParent = await loadAttachmentsFor('appointment', ids);
  (data||[]).forEach(a => appointments[a.warehouse_id].push({
    id: a.id, clientId: a.client_id, date: a.date, start: a.start_time, duration: a.duration_min,
    status: a.status, carrier: a.carrier, plate: a.plate, trailerPlate: a.trailer_plate,
    cargoRef: a.cargo_ref, type: a.type, notes: a.notes, attachments: attByParent[a.id] || [],
  }));
}

const WEEKDAY_KEYS = ['dom','lun','mar','mie','jue','vie','sab']; // getDay(): 0=domingo
const WEEKDAY_LABELS = { lun:'Lunes', mar:'Martes', mie:'Miércoles', jue:'Jueves', vie:'Viernes', sab:'Sábado', dom:'Domingo' };
const WEEK_ORDER = ['lun','mar','mie','jue','vie','sab','dom'];

let schedules = {};
async function loadSchedules(){
  const { data } = await supabaseClient.from('warehouse_schedules').select('*');
  schedules = {}; WAREHOUSES.forEach(w => schedules[w.id] = {});
  (data||[]).forEach(row => { schedules[row.warehouse_id][row.weekday] = { open: row.open, ranges: row.ranges }; });
}
function weekdayKey(dateStr){ return WEEKDAY_KEYS[new Date(dateStr+'T00:00:00').getDay()]; }

async function loadWarehouseTasks(){

  warehouseTasks = {}; WAREHOUSES.forEach(w => warehouseTasks[w.id] = []);
  (data||[]).forEach(t => warehouseTasks[t.warehouse_id].push({

async function addWarehouseTask(){
  const input = document.getElementById('wt-input');
  const text = input.value.trim();
  if (!text) return;
  const { data, error } = await supabaseClient.from('warehouse_tasks').insert({
    warehouse_id: currentWarehouseId, date: window.__citasDate, text,
  }).select().single();
  if (error || !data) return;
  warehouseTasks[currentWarehouseId].push({ id: data.id, date: window.__citasDate, text, done: false });
  renderTab();
}
async function toggleWarehouseTask(id){
  const t = warehouseTasks[currentWarehouseId].find(x=>x.id===id);
  if (!t) return;
  const done = !t.done;
  await supabaseClient.from('warehouse_tasks').update({ done }).eq('id', id);
  t.done = done;
  renderTab();
}
async function deleteWarehouseTask(id){
  await supabaseClient.from('warehouse_tasks').delete().eq('id', id);
  warehouseTasks[currentWarehouseId] = warehouseTasks[currentWarehouseId].filter(x=>x.id!==id);
  renderTab();
}
async function moveWarehouseTaskDay(id, delta){
  const t = warehouseTasks[currentWarehouseId].find(x=>x.id===id);
  if (!t) return;
  const d = new Date(t.date+'T00:00:00');
  let newDate;
  for (let i = 0; i < 14; i++) {
    d.setDate(d.getDate()+delta);
    newDate = toDateStr(d);
    if (daySchedule(currentWarehouseId, newDate).open) break;
  }
  await supabaseClient.from('warehouse_tasks').update({ date: newDate }).eq('id', id);
  t.date = newDate;
  renderTab();
}
function moveWarehouseTaskToNextDay(id){ return moveWarehouseTaskDay(id, 1); }
function moveWarehouseTaskToPrevDay(id){ return moveWarehouseTaskDay(id, -1); }
function startEditWarehouseTask(id){ window.__editingTaskId = id; renderTab(); }
function cancelEditWarehouseTask(){ window.__editingTaskId = null; renderTab(); }

function timeToMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function slotTimes(ranges){ const arr=[]; ranges.forEach(r=>{ for(let m=timeToMin(r.start); m<timeToMin(r.end); m+=30) arr.push(m); }); return arr; }
function fitsInARange(ranges, startMin, endMin){ return ranges.some(r => startMin >= timeToMin(r.start) && endMin <= timeToMin(r.end)); }

/* ---- Direcciones: selector semanal de horarios ----
   Se elige por día (abierto/cerrado y hasta dos tramos) y se guarda como
   texto legible en la columna "horarios", p. ej.
   "Lun–Vie 8:00–14:00 y 15:00–18:00 · Sáb–Dom cerrado".
   Ese mismo formato se vuelve a leer al editar; un texto libre antiguo se
   respeta tal cual hasta que se elige algo en el selector. */
const HR_DAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const HR_TIMES = (() => { const a = []; for (let m = 0; m <= 1440; m += 30) a.push(String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0')); return a; })();

function hrShort(t){ return t.replace(/^0/, ''); }
function hrPad(t){ return t.length === 4 ? '0' + t : t; }
function hrFormatRanges(ranges){
  if (ranges.length === 1 && ranges[0][0] === '00:00' && ranges[0][1] === '24:00') return '24 h';
  return ranges.map(r => `${hrShort(r[0])}–${hrShort(r[1])}`).join(' y ');
}
function hrGenerate(state){
  if (!state.some(d => d.open)) return '';
  const labels = state.map(d => d.open && d.ranges.length ? hrFormatRanges(d.ranges) : 'cerrado');
  const parts = [];
  for (let i = 0; i < 7; ) {
    let j = i;
    while (j + 1 < 7 && labels[j+1] === labels[i]) j++;
    parts.push(`${i === j ? HR_DAYS[i] : HR_DAYS[i] + '–' + HR_DAYS[j]} ${labels[i]}`);
    i = j + 1;
  }
  return parts.join(' · ');
}
function hrParse(text){
  if (!text) return null;
  const state = HR_DAYS.map(() => ({ open: false, ranges: [['08:00','14:00']] }));
  const dayRe = HR_DAYS.join('|');
  const partRe = new RegExp(`^(${dayRe})(?:–(${dayRe}))? (.+)$`);
  for (const part of text.split(' · ')) {
    const m = part.match(partRe);
    if (!m) return null;
    const i = HR_DAYS.indexOf(m[1]);
    const j = m[2] ? HR_DAYS.indexOf(m[2]) : i;
    if (j < i) return null;
    let open = false, ranges = [['08:00','14:00']];
    if (m[3] === 'cerrado') { /* día cerrado */ }
    else if (m[3] === '24 h') { open = true; ranges = [['00:00','24:00']]; }
    else {
      const rs = m[3].split(' y ').map(s => s.match(/^(\d{1,2}:\d{2})–(\d{1,2}:\d{2})$/));
      if (!rs.length || rs.length > 2 || rs.some(r => !r)) return null;
      open = true; ranges = rs.map(r => [hrPad(r[1]), hrPad(r[2])]);
    }

function hrError(state){

    if (!d.open) continue;
    const [a, b] = d.ranges[0];
    if (!(a < b)) return `${HR_DAYS[i]}: la hora de cierre debe ser posterior a la de apertura.`;
    if (d.ranges[1]) {
      const [c, e] = d.ranges[1];
      if (!c || !e) return `${HR_DAYS[i]}: completa la apertura y el cierre del segundo tramo.`;
      if (!(c >= b)) return `${HR_DAYS[i]}: el segundo tramo debe empezar después de que acabe el primero.`;
      if (!(c < e)) return `${HR_DAYS[i]}: la hora de cierre del segundo tramo debe ser posterior a la de apertura.`;
    }
  }

function hrTimeSelect(dayIdx, slot, pos, value, allowBlank){

function hrRender(){

      <label style="display:flex;align-items:center;gap:6px;width:64px;font-size:13px;cursor:pointer;">
        <input type="checkbox" ${d.open?'checked':''} onchange="hrToggleDay(${i},this.checked)" style="width:auto;" /> ${HR_DAYS[i]}

      ${d.open ? `
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);">

          <span style="margin-left:6px;">y</span>

        </div>` : `<span style="font-size:12.5px;color:var(--mutedFaint);">Cerrado</span>`}
    </div>`).join('');
  const err = hrError(state);

  const prev = document.getElementById('hr-preview');

function hrToggleDay(i, checked){

    if (oldVal !== newVal) lines.push(`${DIRECCION_FIELD_LABELS[key]}: "${oldVal||'—'}" → "${newVal||'—'}"`);
  });
  return lines;
}

async function submitDireccionForm(editId){
  const errEl = document.getElementById('dr-error');
  errEl.textContent = '';
  const nombre = document.getElementById('dr-nombre').value.trim();
  if (!nombre) { errEl.textContent = 'Indica al menos el nombre del lugar.'; return; }
  const val = id => document.getElementById(id).value.trim();
  if (window.__hrError) { errEl.textContent = 'Revisa los horarios: ' + window.__hrError; return; }
  const mapsUrl = val('dr-maps');
  if (mapsUrl && !safeMapsUrl(mapsUrl)) { errEl.textContent = 'El enlace de Google Maps debe empezar por http:// o https://.'; return; }
  const payload = {
    nombre, calle1: val('dr-calle1') || null, calle2: val('dr-calle2') || null,
    codigo_postal: val('dr-cp') || null, ciudad: val('dr-ciudad') || null, provincia: val('dr-provincia') || null,
    pais: val('dr-pais') || null, telefono: val('dr-telefono') || null, horarios: val('dr-horarios') || null,
    observaciones: val('dr-observaciones') || null, google_maps_url: mapsUrl || null,
  };
  const btns = [...document.querySelectorAll('.dr-submit-btn')];
  btns.forEach(b => b.disabled = true);
  const before = editId ? { ...direcciones.find(d=>d.id===editId) } : null;
  const res = editId
    ? await supabaseClient.from('direcciones').update(payload).eq('id', editId).select()
    : await supabaseClient.from('direcciones').insert(payload).select();
  if (res.error || !res.data || !res.data.length) {
    errEl.textContent = 'No se pudo guardar: ' + (res.error && res.error.message ? res.error.message : 'sin permiso o error desconocido.');
    btns.forEach(b => b.disabled = false);
    return;
  }
  const after = {
    nombre, calle1: payload.calle1 || '', calle2: payload.calle2 || '', codigoPostal: payload.codigo_postal || '',
    ciudad: payload.ciudad || '', provincia: payload.provincia || '', pais: payload.pais || '',
    observaciones: payload.observaciones || '', mapsUrl: payload.google_maps_url || '', telefono: payload.telefono || '', horarios: payload.horarios || '',
  };
  const changeLines = before ? buildDireccionChangeSummary(before, after) : ['Dirección creada.'];
  if (changeLines.length) await logDireccionHistorial(editId || res.data[0].id, changeLines.join('\n'));
  await loadDirecciones();
  window.__direccionFormDirty = false;
  window.__administracionView = 'direcciones';
  renderHeader(); renderTab();
}
async function setDireccionArchived(id, archived){
  const errEl = document.getElementById('dr-error');
  const { data, error } = await supabaseClient.from('direcciones').update({ archived }).eq('id', id).select();
  if (error || !data || !data.length) { if (errEl) errEl.textContent = 'No se pudo actualizar: ' + (error && error.message ? error.message : 'sin permiso.'); return; }
  await logDireccionHistorial(id, archived ? 'Archivada.' : 'Restaurada.');
  await loadDirecciones();
  window.__direccionFormDirty = false;
  window.__administracionView = 'direcciones';
  renderHeader(); renderTab();
}
function archiveDireccion(id){ return setDireccionArchived(id, true); }
function unarchiveDireccion(id){ return setDireccionArchived(id, false); }
async function deleteDireccion(id){
  const d = direcciones.find(x=>x.id===id);
  if (!d || !confirm(`¿Eliminar definitivamente "${d.nombre}"? Esta acción no se puede deshacer.`)) return;
  const errEl = document.getElementById('dr-error');
  const { error } = await supabaseClient.from('direcciones').delete().eq('id', id);
  if (error) { if (errEl) errEl.textContent = 'No se pudo eliminar: ' + error.message; return; }
  await loadDirecciones();
  window.__direccionFormDirty = false;
  window.__administracionView = 'direcciones';
  renderHeader(); renderTab();
}

  const { data } = await supabaseClient.from('contacto_historial').insert({ contacto_id: contactoId, usuario, resumen }).select().single();
  if (!data) return;
  const entry = { id: data.id, createdAt: data.created_at, usuario, resumen };
  contactoHistorialCache[contactoId] = [entry, ...(contactoHistorialCache[contactoId]||[])];
  if (window.__contactoDetailId === contactoId) window.__contactoHistorial = contactoHistorialCache[contactoId];
}
const CONTACTO_FIELD_LABELS = {
  nombre: 'Razón social', nombreComercial: 'Nombre comercial', nif: 'NIF', calle1: 'Calle 1', calle2: 'Calle 2',
  codigoPostal: 'Código postal', ciudad: 'Ciudad', provincia: 'Provincia', pais: 'País',
};
function buildContactoChangeSummary(before, after){
  const lines = [];
  Object.keys(CONTACTO_FIELD_LABELS).forEach(key => {
    const oldVal = (before[key]||'').toString();
    const newVal = (after[key]||'').toString();
    if (oldVal !== newVal) lines.push(`${CONTACTO_FIELD_LABELS[key]}: "${oldVal||'—'}" → "${newVal||'—'}"`);
  });
  [['esClienteAlmacen','Cliente de almacén'], ['esTransportista','Transportista'], ['esAutonomos','Autónomos']].forEach(([key,label]) => {
    if (!!before[key] !== !!after[key]) lines.push(after[key] ? `Marcado como ${label}` : `Desmarcado como ${label}`);
  });
  const beforeWh = (before.warehouseIds||[]).slice().sort().join(',');
  const afterWh = (after.warehouseIds||[]).slice().sort().join(',');
  if (beforeWh !== afterWh) {
    const names = (after.warehouseIds||[]).map(id => (WAREHOUSES.find(w=>w.id===id)||{}).name).filter(Boolean).join(', ') || 'ninguno';
    lines.push(`Almacenes asignados: ${names}`);
  }
  return lines;
}
function fmtDateHora(iso){
  return new Date(iso).toLocaleString('es-ES', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

function openContactoModal(editId, presetRoles){

async function addContactoLogo(file){
  const editId = window.__contactoDetailId;
  if (!file || !editId) return;
  if (!file.type.startsWith('image/')) { alert('Solo se admiten imágenes.'); return; }
  const path = `logos/${editId}-${nextId()}-${file.name}`;
  const { error: uploadError } = await supabaseClient.storage.from(DOCS_BUCKET).upload(path, file, { upsert: true });
  if (uploadError) { alert('No se pudo subir el logo: ' + uploadError.message); return; }
  const { data, error } = await supabaseClient.from('contactos').update({ logo_storage_path: path }).eq('id', editId).select();
  if (error || !data || !data.length) { alert('No se pudo guardar el logo.'); return; }
  const c = contactos.find(x=>x.id===editId);
  if (c) c.logoStoragePath = path;
  window.__contactoDetailLogoUrl = await signedUrl(path);
  contactoLogoUrlCache[editId] = window.__contactoDetailLogoUrl;
  await logContactoHistorial(editId, 'Logo actualizado.');
  renderTab();
}
async function removeContactoLogo(){
  const editId = window.__contactoDetailId;
  const c = contactos.find(x=>x.id===editId);
  if (!c || !c.logoStoragePath) return;
  await supabaseClient.storage.from(DOCS_BUCKET).remove([c.logoStoragePath]);
  await supabaseClient.from('contactos').update({ logo_storage_path: null }).eq('id', editId);
  c.logoStoragePath = null;
  window.__contactoDetailLogoUrl = null;

function contactoNavGoto(offset){

async function submitContactoForm(editId){
  const errEl = document.getElementById('ct-error');
  errEl.textContent = '';
  const nombre = document.getElementById('ct-nombre').value.trim();
  const nombreComercial = document.getElementById('ct-nombre-comercial').value.trim();
  const nif = document.getElementById('ct-nif').value.trim();
  const esClienteAlmacen = document.getElementById('ct-rol-cliente').checked;
  const esAutonomos = document.getElementById('ct-rol-autonomos').checked;
  const esTransportista = document.getElementById('ct-rol-transportista').checked || esAutonomos;
  const warehouseIds = esClienteAlmacen ? [...document.querySelectorAll('.ct-warehouse:checked')].map(el=>el.value) : [];
  const calle1 = document.getElementById('ct-calle1').value.trim();
  const calle2 = document.getElementById('ct-calle2').value.trim();
  const codigoPostal = document.getElementById('ct-cp').value.trim();
  const ciudad = document.getElementById('ct-ciudad').value.trim();
  const provincia = document.getElementById('ct-provincia').value.trim();
  const pais = document.getElementById('ct-pais').value.trim();
  if (!nombre) { errEl.textContent = 'Indica al menos el nombre.'; return; }
  const fields = { nombre, nombreComercial, nif, esClienteAlmacen, esTransportista, esAutonomos, warehouseIds, calle1, calle2, codigoPostal, ciudad, provincia, pais };
  const dbPayload = {
    nombre, nombre_comercial: nombreComercial || null, nif: nif || null, calle1: calle1 || null, calle2: calle2 || null,
    codigo_postal: codigoPostal || null, ciudad: ciudad || null, provincia: provincia || null, pais: pais || null,
    es_cliente_almacen: esClienteAlmacen, es_transportista: esTransportista, es_autonomos: esAutonomos,
  };
  try {
    let contactoId = editId;
    let changeLines = [];
    if (editId) {
      const { data, error } = await supabaseClient.from('contactos').update(dbPayload).eq('id', editId).select();
      if (error || !data || !data.length) throw (error || new Error('sin permiso o error desconocido.'));
      const c = contactos.find(x=>x.id===editId);
      if (c) { changeLines = buildContactoChangeSummary(c, fields); Object.assign(c, fields); }
    } else {
      const { data, error } = await supabaseClient.from('contactos').insert(dbPayload).select().single();
      if (error || !data) throw (error || new Error('sin permiso o error desconocido.'));
      contactoId = data.id;
      contactos.push({ id: data.id, archived: false, ...fields });
      contactos.sort((a,b) => a.nombre.localeCompare(b.nombre));
      changeLines = ['Contacto creado.'];
    }
    let { error: whDeleteError } = await supabaseClient.from('contacto_warehouses').delete().eq('contacto_id', contactoId);
    if (whDeleteError) throw whDeleteError;
    if (warehouseIds.length) {
      const { error: whInsertError } = await supabaseClient.from('contacto_warehouses').insert(warehouseIds.map(wid=>({ contacto_id: contactoId, warehouse_id: wid })));
      if (whInsertError) throw whInsertError;
    }
    if (changeLines.length) await logContactoHistorial(contactoId, changeLines.join('\n'));
    await Promise.all([loadClients(), loadCompanies()]);
    openContactoModal(contactoId);
  } catch (error) {
    errEl.textContent = 'No se pudo guardar: ' + (error && error.message ? error.message : 'error desconocido.');
  }
}
// Un contacto puede ser a la vez cliente de almacén y/o autónomos — estos
// guards comprueban TODAS las tablas dependientes sin importar qué rol
// tenga marcado ahora mismo, porque la clave foránea sigue existiendo
// aunque el usuario desmarque la casilla después de acumular histórico.
function contactoHasWarehouseHistory(id){
  return Object.keys(pallets).some(wid => pallets[wid].some(p=>p.clientId===id))
    || Object.keys(movements).some(wid => movements[wid].some(m=>m.clientId===id))
    || Object.keys(appointments).some(wid => appointments[wid].some(a=>a.clientId===id))
    || Object.keys(unscheduled).some(wid => unscheduled[wid].some(u=>u.clientId===id));
}
function contactoHasAnyDrivers(id){
  return drivers.some(d=>d.companyId===id);
}
async function archiveContacto(id){
  const c = contactos.find(x=>x.id===id);
  const activeCount = drivers.filter(d=>d.companyId===id && !d.archived).length;
  if (activeCount) {
    const errEl = document.getElementById('ct-error');
    if (errEl) errEl.textContent = `No se puede archivar: tiene ${activeCount} conductor${activeCount!==1?'es':''} activo${activeCount!==1?'s':''}. ${activeCount!==1?'Archívalos o muévelos':'Archívalo o muévelo'} de empresa antes.`;
    return;
  }
  const { data, error } = await supabaseClient.from('contactos').update({ archived: true }).eq('id', id).select();
  if (error || !data || !data.length) { const errEl=document.getElementById('ct-error'); if(errEl) errEl.textContent='No se pudo archivar: '+(error&&error.message?error.message:'sin permiso.'); return; }
  if (c) c.archived = true;
  await logContactoHistorial(id, 'Archivado.');
  await Promise.all([loadClients(), loadCompanies()]);
  openContactoModal(id);
}
async function unarchiveContacto(id){
  const { data, error } = await supabaseClient.from('contactos').update({ archived: false }).eq('id', id).select();
  if (error || !data || !data.length) { const errEl=document.getElementById('ct-error'); if(errEl) errEl.textContent='No se pudo restaurar: '+(error&&error.message?error.message:'sin permiso.'); return; }
  const c = contactos.find(x=>x.id===id);
  if (c) c.archived = false;
  await logContactoHistorial(id, 'Restaurado.');
  await Promise.all([loadClients(), loadCompanies()]);
  openContactoModal(id);
}

// Cada reserva del día se coloca en una columna (0 o 1) fija para todo su
// horario, en vez de recalcularse franja a franja — si no, una reserva de
// varias franjas podía aparecer a la izquierda en una franja y saltar a la
// derecha en la siguiente en cuanto la reserva que tenía al lado terminaba
// antes, dando la sensación de que todo el timeline "se movía".
function assignApptColumns(dayAppts){
  const sorted = dayAppts.slice().sort((a,b)=> timeToMin(a.start)-timeToMin(b.start) || a.id.localeCompare(b.id));
  const colEndMin = [-Infinity, -Infinity];
  const colOf = {};
  sorted.forEach(a => {
    const s = timeToMin(a.start), e = s + a.duration;
    let col = colEndMin[0] <= s ? 0 : colEndMin[1] <= s ? 1 : (colEndMin[0] <= colEndMin[1] ? 0 : 1);
    colOf[a.id] = col;
    colEndMin[col] = Math.max(colEndMin[col], e);
  });
  return colOf;
}
function activeApptForColumn(dayAppts, startMin, colOf, col){
  return dayAppts.find(a => colOf[a.id]===col && (() => { const s=timeToMin(a.start), e=s+a.duration; return startMin>=s && startMin<e; })());
}

function emptyCell(startMin, compact){
  return `<button onclick="openAppointmentModal('${minToTime(startMin)}')" style="flex:1;text-align:left;display:flex;align-items:center;gap:6px;background:transparent;border:1px dashed var(--border);border-radius:8px;padding:${compact?'6px 10px':'10px 14px'};color:var(--mutedFaint);font-size:${compact?'11px':'12.5px'};min-width:0;">+ Reservar${compact?'':' franja'}</button>`;
}

function renderTimeline(dayAppts, wh, slots){
  const colOf = assignApptColumns(dayAppts);
  return slots.map((startMin, idx) => {
    const prev = slots[idx-1];
    const gapBefore = idx > 0 && startMin - prev > 30
      ? `<div style="text-align:center;font-size:11px;color:var(--mutedFaint);letter-spacing:.4px;margin:6px 0;">— pausa (${minToTime(prev+30)}–${minToTime(startMin)}) —</div>`
      : '';
    const a0 = activeApptForColumn(dayAppts, startMin, colOf, 0);
    const a1 = activeApptForColumn(dayAppts, startMin, colOf, 1);
    let cellsHtml;
    let rowContinues = false;
    if (!a0 && !a1) {
      cellsHtml = emptyCell(startMin, false);
    } else {
      cellsHtml = (a0 ? apptCellHtml(a0, wh, startMin) : emptyCell(startMin, true))
                + (a1 ? apptCellHtml(a1, wh, startMin) : emptyCell(startMin, true));
      rowContinues = [a0,a1].some(a => a && (timeToMin(a.start) + a.duration) > startMin + 30);
    }
    return gapBefore + `
      <div style="display:flex;gap:10px;align-items:stretch;min-height:98px;margin-bottom:${rowContinues?'0':'6px'};">
        <div style="width:58px;flex-shrink:0;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--muted);padding-top:10px;">${minToTime(startMin)}</div>
        <div style="flex:1;display:flex;gap:8px;min-width:0;">${cellsHtml}</div>
      </div>`;
  }).join('');
}

// Si un conductor se dejó una jornada de un día anterior sin cerrar, se
// cierra sola al máximo de horas/km de su tarifa de ese día — así nunca se
// le paga de más por un olvido — y se marca con auto_closed para que quien
// lleve las tarifas la revise (sale resaltada en rojo en Fichajes diarios).
async function autoCloseStaleFichajes(){
  const t = today();
  const stale = dailyEntries.filter(f => f.status==='abierta' && f.date < t);
  for (const f of stale) {
    const rates = getRatesForDate(f.driverId, f.date);
    const [h,m] = f.timeIn.split(':').map(Number);
    const endMin = (h*60 + m + Math.round((rates.maxHoursDay||0)*60)) % (24*60);
    const timeOut = `${String(Math.floor(endMin/60)).padStart(2,'0')}:${String(endMin%60).padStart(2,'0')}`;
    const km = Math.round((rates.maxKmDay||0)*10)/10;
    const kmEnd = (f.kmStart||0) + km;
    // .select() al final del update no es decorativo: es la única forma de
    // saber si Supabase realmente guardó el cambio. Si RLS bloquea la
    // escritura (p. ej. esta cuenta no tiene permiso sobre "fichajes"),
    // update() no da error — simplemente actualiza 0 filas en silencio —
    // así que sin este chequeo el fichaje se habría dado por cerrado en
    // memoria mientras en la base de datos seguía abierto.
    const { data, error } = await supabaseClient.from('daily_entries').update({
      status: 'cerrada', time_out: timeOut, km_end: kmEnd, km, auto_closed: true,
    }).eq('id', f.id).select();
    if (error || !data || !data.length) {
      console.error('No se pudo autocerrar el fichaje (revisa permisos de esta cuenta sobre daily_entries):', f.id, error);
      continue;
    }
    f.status = 'cerrada'; f.timeOut = timeOut; f.kmEnd = kmEnd; f.km = km; f.autoClosed = true;
  }
}
function getISOWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return { year: d.getFullYear(), week };
}
function isoWeekThursday(year, week){
  const jan4 = new Date(year, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const week1Monday = new Date(jan4);
  week1Monday.setDate(jan4.getDate() - (jan4Day - 1));
  const thursday = new Date(week1Monday);
  thursday.setDate(week1Monday.getDate() + (week-1)*7 + 3);
  return thursday;
}
function weekMonth(year, week){ return isoWeekThursday(year, week).getMonth(); }
function fichajeHours(f){
  if (!f.timeOut) return null;
  const [h1,m1] = f.timeIn.split(':').map(Number);
  const [h2,m2] = f.timeOut.split(':').map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if (mins < 0) mins += 24*60; // turno que cruza medianoche
  return Math.round((mins/60) * 100) / 100;
}
// Si se cerró sola a 0h/0km es casi seguro porque el conductor no tenía
// ninguna tarifa registrada para esa fecha (getRatesForDate no encontró
// nada y usó el valor por defecto) — se avisa de eso en concreto, porque
// si no, "0h/0km" parece un día sin problema en vez de un dato a corregir.
function autoClosedBadgeHtml(f){
  if (!f.autoClosed) return '';
  const noRate = !f.km && !fichajeHours(f);
  const msg = noRate
    ? 'Se cerró sola a 0h/0km porque este conductor no tenía ninguna tarifa registrada para esa fecha — ponle una tarifa y corrige este fichaje con la hora/km reales.'
    : 'Se cerró sola porque el conductor no la cerró — comprueba la hora de salida y los km antes de pagarla.';
  const label = noRate ? '⚠ Auto (sin tarifa)' : '⚠ Auto';
  return ` <span title="${esc(msg)}" style="cursor:help;color:var(--danger);font-size:10.5px;font-weight:700;">${label}</span>`;
}
function fmtHoursMin(decimalHours){
  if (decimalHours == null || isNaN(decimalHours)) return '—';
  const sign = decimalHours < 0 ? '-' : '';
  let totalMin = Math.round(Math.abs(decimalHours) * 60);
  let h = Math.floor(totalMin / 60);
  let m = totalMin % 60;
  return `${sign}${h}h ${String(m).padStart(2,'0')}m`;
}

// Jornadas de esa semana: cuenta los fichajes cerrados que no estén
// excluidos de días, más los que sí lo estén pero lleven un importe
// manual (para que ese día siga contando como trabajado). Se calcula
// siempre al vuelo desde los fichajes — nunca desde un valor guardado —
// para que no se quede desactualizado si cambia algo después.
function computeDaysCountForWeek(driverId, year, week, month){
  return dailyEntries
    .filter(f => f.driverId===driverId && f.status==='cerrada')
    .filter(f => { const w = getISOWeek(f.date); return w.year===year && w.week===week; })
    .filter(f => month===undefined || Number(f.date.slice(5,7))-1===month)
    .filter(f => !f.excludeDays || f.manualAmount)
    .length;
}
function computeGasoilForWeek(driverId, year, week, month){
  return fuelEntries
    .filter(f => f.driverId===driverId)
    .filter(f => { const w = getISOWeek(f.date); return w.year===year && w.week===week; })
    .filter(f => month===undefined || Number(f.date.slice(5,7))-1===month)
    .reduce((s,f) => s + Number(f.liters||0)*Number(f.pricePerLiter||0), 0);
}

function computeWeek(driver, e){
  const maxKm = driver.maxKmDay * e.daysWorked;
  const maxHours = driver.maxHoursDay * e.daysWorked;
  const kmExtra = e.km - maxKm;
  const hoursExtra = e.hours - maxHours;
  const dayAmount = e.daysWorked * driver.priceDay;
  const kmExtraAmount = kmExtra * driver.priceKmExtra;
  const hoursExtraAmount = hoursExtra * driver.priceHourExtra;
  const extraCharge = Math.max(kmExtraAmount, hoursExtraAmount, 0);
  const supplements = Number(e.supplements||0);
  const manualAmount = Number(e.manualAmount||0);
  const totalIngreso = dayAmount + extraCharge + supplements + manualAmount;
  const gastosTotal = Number(e.gasoil||0) + Number(e.peajes||0) + Number(e.otros||0);
  const neto = totalIngreso - gastosTotal;
  return { maxKm, maxHours, kmExtra, hoursExtra, dayAmount, kmExtraAmount, hoursExtraAmount, extraCharge, manualAmount, totalIngreso, gastosTotal, neto };
}
function eur2(n){ return Number(n||0).toLocaleString('es-ES', { style:'currency', currency:'EUR' }); }
function eurSigned(n){
  if (!n) return '—';
  return (n<0?'−':'+') + eur2(Math.abs(n));
}

function addScheduleRange(day){
  window.__schedDraft[day].ranges.push({ start:'15:00', end:'20:00' });
  renderScheduleModal();

function removeScheduleRange(day, idx){
  window.__schedDraft[day].ranges.splice(idx,1);

async function submitSchedule(){
  if (!PROFILE.isAdmin && !PROFILE.canEditSchedule) return;
  const errEl = document.getElementById('sch-error');
  const draft = window.__schedDraft;
  for (const day of WEEK_ORDER) {
    if (!draft[day].open) continue;
    const ranges = [...draft[day].ranges].sort((a,b)=>a.start.localeCompare(b.start));
    for (let i=0;i<ranges.length;i++){
      if (ranges[i].start >= ranges[i].end) { errEl.textContent = `En ${WEEKDAY_LABELS[day]}, cada tramo debe cerrar después de abrir.`; return; }
      if (i>0 && ranges[i].start < ranges[i-1].end) { errEl.textContent = `En ${WEEKDAY_LABELS[day]}, hay tramos que se solapan.`; return; }
    }
    draft[day].ranges = ranges;
  }
  await supabaseClient.from('warehouse_schedules').upsert(
    WEEK_ORDER.map(day => ({ warehouse_id: currentWarehouseId, weekday: day, open: draft[day].open, ranges: draft[day].ranges })),
    { onConflict: 'warehouse_id,weekday' }
  );
  schedules[currentWarehouseId] = draft;
  closeModal(); renderTab();
}

async function moveUnscheduledDay(id, delta){
  const u = unscheduled[currentWarehouseId].find(x=>x.id===id);
  if (!u) return;
  const d = new Date(u.date+'T00:00:00');
  let newDate;
  for (let i = 0; i < 14; i++) {
    d.setDate(d.getDate()+delta);
    newDate = toDateStr(d);

  }
  await supabaseClient.from('unscheduled_trucks').update({ date: newDate }).eq('id', id);
  u.date = newDate;
  renderTab();
}

      </div>
    </div>`;
  refreshQuickUnschedPreview();

function quickUnschedPlan(){
  const from = document.getElementById('qu-from').value;
  const to = document.getElementById('qu-to').value;
  const count = Math.max(0, Math.min(20, parseInt(document.getElementById('qu-count').value, 10) || 0));
  const weekdays = [...document.querySelectorAll('.qu-day:checked')].map(el=>Number(el.value));
  const dates = []; let closedSkipped = 0; let tooLong = false;
  if (from && to && from <= to) {
    const d = new Date(from + 'T00:00:00');
    const last = new Date(to + 'T00:00:00');
    for (let i = 0; d <= last; i++, d.setDate(d.getDate()+1)) {
      if (i >= 92) { tooLong = true; break; }
      if (!weekdays.includes(d.getDay())) continue;
      const ds = toDateStr(d);
      if (!daySchedule(currentWarehouseId, ds).open) { closedSkipped++; continue; }
      dates.push(ds);
    }
  }
  return { dates, count, closedSkipped, tooLong, valid: !!(from && to && from <= to) };
}
function refreshQuickUnschedPreview(){
  document.querySelectorAll('.qu-day').forEach(el => {
    const lbl = el.parentElement;
    lbl.style.background = el.checked ? 'var(--primary)' : 'var(--panel2)';
    lbl.style.color = el.checked ? 'var(--primary-text)' : 'var(--text)';
    lbl.style.borderColor = el.checked ? 'var(--primary)' : 'var(--border)';
  });
  const plan = quickUnschedPlan();
  const total = plan.dates.length * plan.count;
  const btn = document.getElementById('qu-submit');
  let msg;
  if (!plan.valid) msg = 'Elige un rango de fechas válido.';
  else if (!plan.dates.length) msg = 'Ningún día del rango coincide con los días marcados y con el almacén abierto.';
  else msg = `Se crearán <b>${total}</b> ${total!==1?'camiones':'camión'}: ${plan.count} al día durante ${plan.dates.length} día${plan.dates.length!==1?'s':''}.` + (plan.closedSkipped ? ` (${plan.closedSkipped} día${plan.closedSkipped!==1?'s':''} con el almacén cerrado omitido${plan.closedSkipped!==1?'s':''}.)` : '') + (plan.tooLong ? ' Solo se cubren los primeros 92 días.' : '');
  document.getElementById('qu-preview').innerHTML = msg;
  if (btn) {
    btn.disabled = !document.getElementById('qu-client').value || !total || total > QUICK_UNSCHED_MAX_ROWS;
    btn.textContent = total ? `Crear ${total}` : 'Crear';
  }
  if (total > QUICK_UNSCHED_MAX_ROWS) document.getElementById('qu-preview').innerHTML += ` <span style="color:var(--danger);">Máximo ${QUICK_UNSCHED_MAX_ROWS} de una vez.</span>`;
}
async function submitQuickUnscheduled(){
  const errEl = document.getElementById('qu-error');
  errEl.textContent = '';
  const clientId = document.getElementById('qu-client').value;
  const plan = quickUnschedPlan();
  if (!clientId || !plan.dates.length || !plan.count) return;
  const type = document.getElementById('qu-type').value;
  const notes = document.getElementById('qu-notes').value.trim();
  const rows = [];

    for (let i = 0; i < plan.count; i++) {

  const { error } = await supabaseClient.from('unscheduled_trucks').insert(rows);
  if (error) { errEl.textContent = 'No se pudo guardar: ' + (error.message || 'error desconocido.'); btn.disabled = false; return; }

async function addAttachmentFiles(fileList){
  const files = Array.from(fileList || []);
  for (const file of files) {
    if (file.type !== 'application/pdf') { alert(`"${file.name}" no es un PDF.`); continue; }
    if (file.size > MAX_ATTACHMENT_MB*1024*1024) { alert(`"${file.name}" pesa demasiado (máx ${MAX_ATTACHMENT_MB}MB).`); continue; }
    const draftId = nextId();
    const path = `attachments/${draftId}-${file.name}`;
    const { error } = await supabaseClient.storage.from(DOCS_BUCKET).upload(path, file);
    if (error) { alert(`No se pudo subir "${file.name}".`); continue; }
    const url = await signedUrl(path);
    window.__attachmentsDraft.push({ id: draftId, name: file.name, size: file.size, storage_path: path, url });
    renderAttachmentList();
  }
  const input = document.getElementById('att-file-input');
  if (input) input.value = '';
}
async function removeAttachmentDraft(id){
  const a = (window.__attachmentsDraft||[]).find(x=>x.id===id);

  window.__attachmentsDraft = window.__attachmentsDraft.filter(x=>x.id!==id);
  renderAttachmentList();
}

async function unassignTime(id){
  const appt = appointments[currentWarehouseId].find(a=>a.id===id);
  if (!appt) return;
  const { data: row, error } = await supabaseClient.from('unscheduled_trucks').insert({
    warehouse_id: currentWarehouseId, client_id: appt.clientId, date: appt.date, status: appt.status,
    carrier: appt.carrier, plate: appt.plate, trailer_plate: appt.trailerPlate,
    cargo_ref: appt.cargoRef, type: appt.type, notes: appt.notes,
  }).select().single();
  if (error || !row) return;
  if ((appt.attachments||[]).length) {
    await supabaseClient.from('attachments').insert(appt.attachments.map(a => ({
      parent_type: 'unscheduled', parent_id: row.id, name: a.name, storage_path: a.storage_path, size: a.size,
    })));
  }
  await supabaseClient.from('attachments').delete().eq('parent_type','appointment').eq('parent_id', id);
  await supabaseClient.from('appointments').delete().eq('id', id);
  await Promise.all([loadAppointments(), loadUnscheduled()]);
  closeModal(); renderTab();
}
function refreshAppointmentTimeOptions(){
  const dateVal = document.getElementById('af-date').value;
  const sched = daySchedule(currentWarehouseId, dateVal);
  const startSel = document.getElementById('af-start');
  const prevVal = startSel.value;
  if (!sched.open) {
    startSel.innerHTML = `<option value="">Almacén cerrado ese día</option>`;
    startSel.disabled = true;
    return;
  }
  startSel.disabled = false;
  startSel.innerHTML = slotTimes(sched.ranges).map(m=>`<option value="${minToTime(m)}" ${minToTime(m)===prevVal?'selected':''}>${minToTime(m)}</option>`).join('');
}
async function submitAppointment(editId){
  const clientId = document.getElementById('af-client').value;
  const date = document.getElementById('af-date').value;
  const start = document.getElementById('af-start').value;
  const duration = Number(document.getElementById('af-duration').value);
  const errEl = document.getElementById('af-error');
  const startMin = timeToMin(start);
  const endMin = startMin + duration;

  const sched = daySchedule(currentWarehouseId, date);
  if (!sched.open) { errEl.textContent = 'El almacén está cerrado ese día. Elige otro.'; return; }
  if (!fitsInARange(sched.ranges, startMin, endMin)) { errEl.textContent = `Esa franja no cabe dentro del horario del día (${scheduleLabel(sched)}). No se puede reservar cruzando una pausa.`; return; }

  const dayAppts = appointments[currentWarehouseId].filter(a => a.date === date && a.id !== editId);
  const overlapCount = dayAppts.filter(a => {
    const aStart = timeToMin(a.start), aEnd = aStart + a.duration;
    return startMin < aEnd && endMin > aStart;
  }).length;
  if (overlapCount >= LANES) { errEl.textContent = `Ya hay ${LANES} camiones reservados en ese horario. Elige otra franja.`; return; }

  const data = {
    warehouse_id: currentWarehouseId, client_id: clientId, date, start_time: start, duration_min: duration,
    status: editId ? document.getElementById('af-status').value : 'planificado',
    carrier: document.getElementById('af-carrier').value.trim(),
    plate: document.getElementById('af-plate').value.trim(),
    trailer_plate: document.getElementById('af-trailer').value.trim(),
    cargo_ref: document.getElementById('af-cargoref').value.trim(),
    type: document.getElementById('af-type').value,
    notes: document.getElementById('af-notes').value.trim(),
  };

  let id = editId;
  if (editId) {
    await supabaseClient.from('appointments').update(data).eq('id', editId);
  } else {
    const { data: row, error } = await supabaseClient.from('appointments').insert(data).select().single();
    if (error || !row) { errEl.textContent = 'No se pudo guardar.'; return; }
    id = row.id;
  }
  await syncAttachments('appointment', id);
  const fromUnsched = document.getElementById('af-from-unscheduled')?.value;
  if (fromUnsched) {
    await supabaseClient.from('attachments').delete().eq('parent_type','unscheduled').eq('parent_id', fromUnsched);
    await supabaseClient.from('unscheduled_trucks').delete().eq('id', fromUnsched);
  }
  await Promise.all([loadAppointments(), loadUnscheduled()]);
  window.__citasDate = date; // saltar a ver el día donde ha quedado la reserva
  closeModal(); renderTab();
}

function tplDocumentos(){
  const filter = window.__docFilter || 'todos';
  const typeFilter = window.__docTypeFilter || 'todos';
  const search = (window.__docSearch || '').toLowerCase();
  if (window.__docRangeFrom === undefined) window.__docRangeFrom = today();
  if (window.__docRangeTo === undefined) { const d = new Date(today()+'T00:00:00'); d.setDate(d.getDate()+7); window.__docRangeTo = toDateStr(d); }
  const rangeMode = window.__docRangeMode || '7dias';

  const schedRows = appointments[currentWarehouseId].map(a => ({
    kind: 'appt', id: a.id, date: a.date, time: a.start, clientId: a.clientId,
    type: a.type, status: a.status || 'planificado', attachments: a.attachments || [],
  }));
  const unschedRows = unscheduled[currentWarehouseId].map(u => ({
    kind: 'unsched', id: u.id, date: u.date, time: null, clientId: u.clientId,
    type: u.type, status: u.status || 'planificado', attachments: u.attachments || [],
  }));
  let rows = [...schedRows, ...unschedRows];

  if (rangeMode !== 'todos') {
    if (window.__docRangeFrom) rows = rows.filter(r => r.date >= window.__docRangeFrom);
    if (window.__docRangeTo) rows = rows.filter(r => r.date <= window.__docRangeTo);
  }
  if (filter === 'con') rows = rows.filter(r => r.attachments.length > 0);
  if (filter === 'sin') rows = rows.filter(r => r.attachments.length === 0);
  if (typeFilter !== 'todos') rows = rows.filter(r => r.type === typeFilter);
  if (search) rows = rows.filter(r => clientName(r.clientId).toLowerCase().includes(search));

  rows.sort((a,b) => (a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));

  const inRange = rangeMode === 'todos' ? [...schedRows, ...unschedRows] : [...schedRows, ...unschedRows].filter(r =>
    (!window.__docRangeFrom || r.date >= window.__docRangeFrom) && (!window.__docRangeTo || r.date <= window.__docRangeTo));
  const countCon = inRange.filter(r=>r.attachments.length>0).length;
  const countSin = inRange.filter(r=>r.attachments.length===0).length;
  const countEntradas = inRange.filter(r=>r.type==='descarga').length;
  const countSalidas = inRange.filter(r=>r.type==='carga').length;

  return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn ${rangeMode==='hoy'?'btn-primary':'btn-ghost'}" onclick="setDocRange('hoy')">Hoy</button>
      <button class="btn ${rangeMode==='7dias'?'btn-primary':'btn-ghost'}" onclick="setDocRange('7dias')">Próximos 7 días</button>
      <button class="btn ${rangeMode==='30dias'?'btn-primary':'btn-ghost'}" onclick="setDocRange('30dias')">Próximos 30 días</button>
      <button class="btn ${rangeMode==='todos'?'btn-primary':'btn-ghost'}" onclick="setDocRange('todos')">Todos los días</button>
      <span style="color:var(--mutedFaint);font-size:12px;">o rango personalizado:</span>
      <input type="date" value="${window.__docRangeFrom}" onchange="window.__docRangeFrom=this.value; window.__docRangeMode='custom'; renderTab();" style="width:150px;" />
      <span style="color:var(--mutedFaint);">–</span>
      <input type="date" value="${window.__docRangeTo}" onchange="window.__docRangeTo=this.value; window.__docRangeMode='custom'; renderTab();" style="width:150px;" />
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">
      ${rangeMode==='todos' ? 'Mostrando todos los días registrados.' : `Mostrando del ${fmtDate(window.__docRangeFrom)} al ${fmtDate(window.__docRangeTo)}.`}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn ${filter==='todos'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='todos'; renderTab();">Todos (${inRange.length})</button>
      <button class="btn ${filter==='sin'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='sin'; renderTab();">📄 Sin adjunto (${countSin})</button>
      <button class="btn ${filter==='con'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='con'; renderTab();">📎 Con adjunto (${countCon})</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="btn ${typeFilter==='todos'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='todos'; renderTab();">Cargas y descargas</button>
      <button class="btn ${typeFilter==='descarga'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='descarga'; renderTab();">⬇ Descargas (${countEntradas})</button>
      <button class="btn ${typeFilter==='carga'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='carga'; renderTab();">⬆ Cargas (${countSalidas})</button>
      <div style="flex:1;min-width:160px;"><input placeholder="Buscar por cliente…" value="${esc(window.__docSearch||'')}" onkeyup="window.__docSearch=this.value; renderTab();" /></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table><thead><tr><th>Fecha</th><th>Hora</th><th>Cliente</th><th>Tipo</th><th>Estado</th><th>Adjuntos</th></tr></thead><tbody>
        ${rows.map(r => `

      </tbody></table>

function weekDateRange(year, week){
  const jan4 = new Date(year, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const monday = new Date(jan4);
  monday.setDate(jan4.getDate() - (jan4Day - 1) + (week-1)*7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return { monday: toDateStr(monday), sunday: toDateStr(sunday) };
}

async function upsertIndexPercent(driverId, year, month, value, doRender=true){
  const existing = indexationEntries.find(x=>x.driverId===driverId && x.year===year && x.month===month);
  if (value === '') {
    if (existing) {
      await supabaseClient.from('indexation_entries').delete().eq('id', existing.id);
      indexationEntries = indexationEntries.filter(x=>x.id!==existing.id);
    }
  } else if (existing) {
    await supabaseClient.from('indexation_entries').update({ percent: Number(value) }).eq('id', existing.id);
    existing.percent = Number(value);
  } else {
    const { data } = await supabaseClient.from('indexation_entries').insert({ driver_id: driverId, year, month, percent: Number(value) }).select().single();
    if (data) indexationEntries.push({ id: data.id, driverId, year, month, percent: Number(value) });
  }
  if (doRender) renderTab();
}

async function submitIndex(driverId, editId){
  const month = Number(document.getElementById('idx-month').value);
  const year = Number(document.getElementById('idx-year').value);
  const percent = document.getElementById('idx-percent').value;
  const errEl = document.getElementById('idx-error');
  if (percent === '') { errEl.textContent = 'Indica el porcentaje de indexación.'; return; }
  const dup = indexationEntries.find(x=>x.driverId===driverId && x.year===year && x.month===month && x.id!==editId);
  if (dup) { errEl.textContent = `Ya hay una indexación guardada para ${MONTH_NAMES[month]} ${year}. Edítala en vez de duplicarla.`; return; }
  if (editId) {
    await supabaseClient.from('indexation_entries').update({ year, month, percent: Number(percent) }).eq('id', editId);
    const idx = indexationEntries.findIndex(x=>x.id===editId);
    indexationEntries[idx] = { ...indexationEntries[idx], year, month, percent: Number(percent) };
  } else {
    const { data, error } = await supabaseClient.from('indexation_entries').insert({ driver_id: driverId, year, month, percent: Number(percent) }).select().single();
    if (error || !data) { errEl.textContent = 'No se pudo guardar.'; return; }
    indexationEntries.push({ id: data.id, driverId, year, month, percent: Number(percent) });
  }
  closeModal(); renderTab();
}

async function submitRate(driverId, editId){
  const validFrom = document.getElementById('rt-from').value;
  const errEl = document.getElementById('rt-error');
  if (!validFrom) { errEl.textContent = 'Indica la fecha desde la que se aplica.'; return; }
  const dup = rateHistory.find(r=>r.driverId===driverId && r.validFrom===validFrom && r.id!==editId);
  if (dup) { errEl.textContent = 'Ya hay una tarifa que empieza justo ese día. Edítala en vez de duplicarla.'; return; }
  const data = {
    validFrom,
    priceDay: Number(document.getElementById('rt-priceday').value||0),
    priceKmExtra: Number(document.getElementById('rt-pricekm').value||0),
    priceHourExtra: Number(document.getElementById('rt-pricehour').value||0),
    maxKmDay: Number(document.getElementById('rt-maxkm').value||0),
    maxHoursDay: Number(document.getElementById('rt-maxhours').value||0),
    hasIndexation: document.getElementById('rt-indexation').checked,
    note: document.getElementById('rt-note').value.trim(),
  };
  const dbData = {
    valid_from: data.validFrom, price_day: data.priceDay, price_km_extra: data.priceKmExtra,
    price_hour_extra: data.priceHourExtra, max_km_day: data.maxKmDay, max_hours_day: data.maxHoursDay,
    has_indexation: data.hasIndexation, note: data.note || null,
  };
  if (editId) {
    await supabaseClient.from('driver_rates').update(dbData).eq('id', editId);
    const idx = rateHistory.findIndex(r=>r.id===editId);
    rateHistory[idx] = { ...rateHistory[idx], ...data };
  } else {
    const { data: row, error } = await supabaseClient.from('driver_rates').insert({ driver_id: driverId, ...dbData }).select().single();
    if (error || !row) { errEl.textContent = 'No se pudo guardar.'; return; }
    rateHistory.push({ id: row.id, driverId, ...data });
  }
  closeModal(); renderTab();
}
async function deleteRate(id){
  await supabaseClient.from('driver_rates').delete().eq('id', id);
  rateHistory = rateHistory.filter(r=>r.id!==id);
  closeModal(); renderTab();
}

const DASH_PERIODS = {
  ayer: 'Ayer', semana: 'Esta semana', semana_anterior: 'Semana anterior',
  mes: 'Este mes', mes_anterior: 'Mes anterior', trimestre: 'Últimos 3 meses', personalizado: 'Personalizado',
};
function dashboardPeriodInfo(){
  const period = window.__dashPeriod || 'semana';
  const t = today();
  if (period === 'semana') return { kind:'weeks', weeks:[getISOWeek(t)] };
  if (period === 'ayer') {
    const d = new Date(t+'T00:00:00'); d.setDate(d.getDate()-1);
    return { kind:'weeks', weeks:[getISOWeek(toDateStr(d))] };
  }
  if (period === 'semana_anterior') {
    const d = new Date(t+'T00:00:00'); d.setDate(d.getDate()-7);
    return { kind:'weeks', weeks:[getISOWeek(toDateStr(d))] };
  }
  const now = new Date(t+'T00:00:00');
  if (period === 'mes') return { kind:'months', months:[{year:now.getFullYear(), month:now.getMonth()}] };
  if (period === 'mes_anterior') {
    let m = now.getMonth()-1, y = now.getFullYear();
    if (m<0){ m=11; y-=1; }
    return { kind:'months', months:[{year:y, month:m}] };
  }
  if (period === 'trimestre') {
    const months = [];
    for (let i=2;i>=0;i--){ let m=now.getMonth()-i, y=now.getFullYear(); while(m<0){m+=12;y-=1;} months.push({year:y,month:m}); }
    return { kind:'months', months };
  }
  // personalizado
  const from = window.__dashCustomFrom || t;
  const to = window.__dashCustomTo || t;
  const fromD = new Date(Math.min(new Date(from+'T00:00:00').getTime(), new Date(to+'T00:00:00').getTime()));
  const toD = new Date(Math.max(new Date(from+'T00:00:00').getTime(), new Date(to+'T00:00:00').getTime()));
  const weeks = []; const seen = new Set();
  for (let cursor=new Date(fromD); cursor<=toD; cursor.setDate(cursor.getDate()+1)) {
    const w = getISOWeek(toDateStr(cursor));
    const key = w.year+'-'+w.week;
    if (!seen.has(key)) { seen.add(key); weeks.push(w); }
  }
  return { kind:'weeks', weeks, from, to };
}
function dashboardWeeksInMonth(year, month){
  const result = [];
  for (let week=1; week<=53; week++){
    const thu = isoWeekThursday(year, week);
    if (thu.getFullYear()===year && thu.getMonth()===month) result.push({ year, week });
  }
  return result;
}
function dashboardWeekBuckets(info){
  if (info.kind === 'weeks') return info.weeks.map(w=>({ year:w.year, week:w.week }));
  const buckets = [];
  info.months.forEach(({year,month}) => {
    dashboardWeeksInMonth(year, month).forEach(w => buckets.push({ year:w.year, week:w.week, _month:month, _monthYear:year }));
  });
  return buckets;
}
let __dashMonthRowsCache = new Map();
function dashboardDriverWeekRow(driverId, bucket){
  if (bucket._month !== undefined) {
    const key = driverId+'|'+bucket._monthYear+'|'+bucket._month;
    let rows = __dashMonthRowsCache.get(key);
    if (!rows) { rows = buildMonthRows(driverId, bucket._monthYear, bucket._month); __dashMonthRowsCache.set(key, rows); }
    return rows.find(e=>e.week===bucket.week);
  }
  return weeklyEntries.find(e=>e.driverId===driverId && e.year===bucket.year && e.week===bucket.week);
}
// Recalcula, para una semana concreta de un conductor Plaza, los mismos
// importes que usa la ficha del conductor (mismas funciones, mismo
// criterio de indexación y de "solo se cobra el mayor extra") — así el
// dashboard nunca puede desviarse de lo que realmente se le paga.
function dashboardWeekFinancials(driverId, e){
  if (!e) return null;
  const m = e._splitMonth;
  const gasoil = computeGasoilForWeek(driverId, e.year, e.week, m);
  const peajes = computeExpenseForWeek(driverId, e.year, e.week, 'peaje', m);
  const otros = computeExpenseForWeek(driverId, e.year, e.week, 'otro', m);
  const supplements = computeSupplementsForWeek(driverId, e.year, e.week, m);
  const daysCount = computeDaysCountForWeek(driverId, e.year, e.week, m);
  const rates = getRatesForDate(driverId, e._rateDate || weekDateRange(e.year,e.week).monday);
  const c = computeWeek(rates, { ...e, gasoil, peajes, otros, supplements });
  const mm = e._splitMonth !== undefined ? e._splitMonth : weekMonth(e.year, e.week);
  const idxPct = rates.hasIndexation !== false ? getIndexPercent(driverId, e.year, mm) : 0;
  const idxAmount = c.dayAmount * (idxPct/100);
  const costeTotal = c.totalIngreso - c.gastosTotal + idxAmount;
  return {
    daysCount, km: e.km||0, hours: e.hours||0,
    kmExtra: Math.max(0, c.kmExtra), hoursExtra: Math.max(0, c.hoursExtra),
    kmExtraAmount: Math.max(0, c.kmExtraAmount), hoursExtraAmount: Math.max(0, c.hoursExtraAmount),
    costeBase: c.dayAmount, costeExtras: c.extraCharge, costeTotal,
  };
}
function dashboardDriverStats(d, info){
  if (d.modality === 'piso_movil') {
    if (info.kind !== 'months') return null;
    const entries = monthlyBillingEntries.filter(e => e.driverId===d.id && info.months.some(mo=>mo.year===e.year && mo.month===e.month));
    if (!entries.length) return null;
    let billing=0, km=0, commission=0;
    entries.forEach(e => {
      billing += e.billingAmount; km += e.km;
      const pct = getCommissionForDate(d.id, `${e.year}-${String(e.month+1).padStart(2,'0')}-01`);
      commission += e.billingAmount * (pct/100);
    });
    const costeTotal = billing - commission;
    return { driver:d, days:null, km, hours:null, kmExtra:0, hoursExtra:0, costeKmExtraPot:0, costeHorasExtraPot:0, costeBase:costeTotal, costeExtras:0, costeTotal, eurKm: km?costeTotal/km:null, eurHora:null };
  }
  const buckets = dashboardWeekBuckets(info);
  let found = false;
  let days=0, km=0, hours=0, kmExtra=0, hoursExtra=0, costeKmExtraPot=0, costeHorasExtraPot=0, costeBase=0, costeExtras=0, costeTotal=0;
  buckets.forEach(b => {
    const f = dashboardWeekFinancials(d.id, dashboardDriverWeekRow(d.id, b));
    if (!f) return;
    found = true;
    days += f.daysCount; km += f.km; hours += f.hours;
    kmExtra += f.kmExtra; hoursExtra += f.hoursExtra;
    costeKmExtraPot += f.kmExtraAmount; costeHorasExtraPot += f.hoursExtraAmount;
    costeBase += f.costeBase; costeExtras += f.costeExtras; costeTotal += f.costeTotal;
  });
  if (!found) return null;
  return { driver:d, days, km, hours, kmExtra, hoursExtra, costeKmExtraPot, costeHorasExtraPot, costeBase, costeExtras, costeTotal, eurKm: km?costeTotal/km:null, eurHora: hours?costeTotal/hours:null };
}

function tplAutonomosDashboardBody(){
  __dashMonthRowsCache = new Map();
  const period = window.__dashPeriod || 'semana';

  const filterModality = window.__dashFilterModality || '';
  const filterStatus = window.__dashFilterStatus || 'activos';
  const filterDriver = window.__dashFilterDriver || '';
  const filterExtras = window.__dashFilterExtras || '';
  const search = (window.__dashSearch||'').toLowerCase();

/* ---- DeCA: generación del PDF nativo + QR ---- */
function dataUrlToUint8Array(dataUrl){
  const base64 = dataUrl.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}
// qrcode-generator's propio createDataURL() exporta GIF (evita depender de
// <canvas>), pero pdf-lib solo puede embeber PNG/JPG — así que se dibuja a
// mano en un <canvas> a partir de isDark()/getModuleCount() y se exporta
// como PNG real, tanto para el PDF como para la vista previa en pantalla.
function qrDataUrl(text, cellSize, margin){
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const cs = cellSize || 6, m = margin != null ? margin : 4;
  const count = qr.getModuleCount();
  const size = (count + m*2) * cs;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000000';
  for (let row = 0; row < count; row++) {
    for (let col = 0; col < count; col++) {
      if (qr.isDark(row, col)) ctx.fillRect((col+m)*cs, (row+m)*cs, cs, cs);
    }
  }
  return canvas.toDataURL('image/png');
}
function wrapPdfText(text, font, size, maxWidth){
  const words = String(text||'').split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (line && font.widthOfTextAtSize(test, size) > maxWidth) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  return lines.length ? lines : ['—'];
}
// Genera el PDF nativo del DeCA (campos del art. 6 Orden FOM 2861/2012)
// con el QR que apunta a su URL de descarga, lo sube al bucket y
// devuelve la URL firmada guardada. La ruta de storage se reutiliza tal
// cual al editar, así el DeCA conserva la misma URL/QR durante el
// servicio (una de las dos vías que permite la resolución del 5 de junio
// para modificar datos durante el transporte).
async function buildAndUploadDecaPdf(fields, storagePath, existingUrl){
  // Supabase Storage exige que el objeto ya exista para poder firmar su URL
  // (createSignedUrl falla con "not found" sobre una ruta vacía), pero el
  // PDF necesita conocer esa URL de antemano para poder imprimir su QR.
  // Al crear un DeCA nuevo se sube primero un PDF marcador de posición para
  // reservar la ruta, se firma la URL sobre ese objeto ya existente, y
  // luego se sube el PDF definitivo (con el QR ya embebido) encima. Al
  // editar, se reutiliza la URL ya guardada — así el QR no cambia cada vez.
  let url = existingUrl;
  if (!url) {
    const placeholderDoc = await PDFLib.PDFDocument.create();
    placeholderDoc.addPage([100, 100]);
    const placeholderBytes = await placeholderDoc.save();
    const { error: placeholderError } = await supabaseClient.storage.from(DOCS_BUCKET).upload(storagePath, new Blob([placeholderBytes], { type: 'application/pdf' }), { upsert: true, contentType: 'application/pdf' });
    if (placeholderError) throw new Error('No se pudo reservar el archivo.');
    const { data: signedData, error: signError } = await supabaseClient.storage.from(DOCS_BUCKET).createSignedUrl(storagePath, 90*24*3600);
    if (signError || !signedData) throw new Error('No se pudo generar la URL de descarga.');
    url = signedData.signedUrl;
  }
  const qrPngDataUrl = qrDataUrl(url, 6);

  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const pdfDoc = await PDFDocument.create();
  const page = pdfDoc.addPage([595.28, 841.89]);
  const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
  const bold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
  const marginX = 50, contentWidth = 495.28;
  let y = 790;

  const drawTitle = (text, size) => { page.drawText(text, { x: marginX, y, size, font: bold, color: rgb(0.1,0.1,0.1) }); y -= size + 8; };
  const drawSection = (text) => { y -= 6; page.drawText(text, { x: marginX, y, size: 11, font: bold, color: rgb(0.75,0.27,0.24) }); y -= 16; };
  const drawField = (label, value) => {
    page.drawText(label + ':', { x: marginX, y, size: 10, font: bold, color: rgb(0.3,0.3,0.3) });
    const lines = wrapPdfText(value || '—', font, 10, contentWidth - 160);
    lines.forEach((line, i) => {
      page.drawText(line, { x: marginX + 160, y: y - i*13, size: 10, font, color: rgb(0.1,0.1,0.1) });
    });
    y -= Math.max(13, lines.length*13) + 6;
  };

  drawTitle('Documento electrónico de Control Administrativo (DeCA)', 15);
  page.drawText('Art. 147 LOTT / art. 222 ROTT — Orden FOM 2861/2012', { x: marginX, y, size: 9, font, color: rgb(0.5,0.5,0.5) });
  y -= 26;

  drawSection('CARGADOR CONTRACTUAL');
  drawField('Nombre / razón social', fields.cargadorNombre);
  drawField('NIF', fields.cargadorNif);
  drawField('Domicilio', fields.cargadorDomicilio);

  drawSection('TRANSPORTISTA EFECTIVO');
  drawField('Nombre / razón social', fields.transportistaNombre);
  drawField('NIF', fields.transportistaNif);

  drawSection('ENVÍO');
  drawField('Origen', fields.origen);
  drawField('Destino', fields.destino);
  drawField('Naturaleza de la mercancía', fields.mercanciaNaturaleza);
  drawField('Peso de la mercancía', fields.mercanciaPeso);
  drawField('Fecha del transporte', fields.fechaTransporte ? fmtDateY(fields.fechaTransporte) : '—');
  drawField('Matrícula tractora', fields.matriculaTractora);
  drawField('Matrícula remolque', fields.matriculaRemolque || 'No aplica');
  drawField('Observaciones', fields.observaciones || '—');

  y -= 10;
  page.drawText(`Generado el ${new Date().toLocaleString('es-ES')} · Qualified Logistics`, { x: marginX, y, size: 8, font, color: rgb(0.6,0.6,0.6) });

  const qrImage = await pdfDoc.embedPng(dataUrlToUint8Array(qrPngDataUrl));
  const qrSize = 110;
  page.drawImage(qrImage, { x: 595.28 - marginX - qrSize, y: 60, width: qrSize, height: qrSize });
  page.drawText('Escanea para descargar el documento:', { x: 595.28 - marginX - qrSize, y: 60 + qrSize + 6, size: 8, font, color: rgb(0.4,0.4,0.4) });
  const urlLines = wrapPdfText(url, font, 7, qrSize);
  urlLines.forEach((line,i) => page.drawText(line, { x: 595.28 - marginX - qrSize, y: 50 - i*9, size: 7, font, color: rgb(0.4,0.4,0.4) }));

  const pdfBytes = await pdfDoc.save();
  const { error: uploadError } = await supabaseClient.storage.from(DOCS_BUCKET).upload(storagePath, new Blob([pdfBytes], { type: 'application/pdf' }), { upsert: true, contentType: 'application/pdf' });
  if (uploadError) throw new Error('No se pudo subir el PDF.');
  return { url };
}
