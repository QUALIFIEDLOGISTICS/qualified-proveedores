<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Qualified Logistics · Panel de Gestión</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#173E8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F4F6F8; --panel:#FFFFFF; --panel2:#F0F2F5; --border:#E1E5EA;
    --text:#1B2430; --muted:#69727C; --mutedFaint:#9AA2AB;
    --success:#3F8F5F; --danger:#C1443D;
    --primary:#1B3A6B; --primary-text:#FFFFFF;
    --display: 'Montserrat', 'Arial', sans-serif;
    --body: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);}
  table{border-collapse:collapse;width:100%;}
  th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);}
  td{padding:11px 12px;font-size:13.5px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  input,select,textarea{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);font-family:var(--body);font-size:14px;outline:none;}
  input[type="checkbox"]{all:revert;cursor:pointer;width:16px;height:16px;}
  textarea{resize:vertical;min-height:60px;}
  ::placeholder{color:var(--mutedFaint);}
  button{cursor:pointer;font-family:var(--body);}
  .btn{font-weight:600;font-size:13px;border-radius:6px;padding:9px 16px;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--primary);color:var(--primary-text);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn:hover{filter:brightness(1.15);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(27,58,107,0.04);}
  .badge{font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 9px;border-radius:999px;color:#0F1216;text-transform:uppercase;white-space:nowrap;}
  .hidden{display:none !important;}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}
  .modal-overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,8,10,.7);padding:16px;}
  .modal-box{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal-title{margin:0;font-family:var(--display);font-size:19px;letter-spacing:.3px;text-transform:uppercase;}
  .close-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;}
  .sidebar-btn{display:block;width:100%;text-align:left;margin-bottom:8px;padding:11px 12px;border-radius:8px;cursor:pointer;background:var(--panel);border:1px solid var(--border);}

  /* ---------- Sidebar ---------- */
  #sidebar-aside{
    width:230px;min-width:230px;border-right:1px solid var(--border);
    padding:18px 14px;
  }
  .sb-group-title{font-size:10.5px;color:var(--mutedFaint);text-transform:uppercase;letter-spacing:.6px;font-weight:600;margin:18px 0 8px;}
  .sb-group-title:first-child{margin-top:0;}
  .tab-btn{display:block;width:100%;text-align:left;margin-bottom:2px;padding:10px 12px;border-radius:6px;cursor:pointer;border:none;border-left:2px solid transparent;background:transparent;color:var(--muted);font-size:13.5px;font-weight:500;}
  .tab-btn:hover{background:var(--panel2);color:var(--text);}
  .tab-btn.active{background:var(--panel2);color:var(--primary);font-weight:600;border-left:2px solid var(--primary);}

  /* Tabla financiera (histórico semanal de autónomos) */
  .fin-table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;background:var(--panel);}
  .fin-table th, .fin-table td{white-space:nowrap;}
  .fin-table thead th{background:var(--panel);}
  .fin-table .fin-group-row th{
    font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--mutedFaint);
    padding:10px 14px 3px;border-bottom:none;
  }
  .fin-table .fin-col-row th{
    padding:4px 14px 10px;cursor:help;font-size:10.5px;font-weight:600;color:var(--muted);
    border-bottom:1px solid var(--border);
  }
  .fin-table td{padding:16px 14px;border-bottom:1px solid var(--border);color:var(--text);}
  .fin-table td.fin-num, .fin-table th.fin-num{text-align:right;}
  .fin-table td.fin-center, .fin-table th.fin-center{text-align:center;}
  .fin-table td.fin-first, .fin-table th.fin-first{position:sticky;left:0;z-index:2;background:var(--panel);}
  .fin-table tbody tr.fin-row:hover{background:var(--panel2);}
  .fin-table tbody tr.fin-row:hover td.fin-first{background:var(--panel2);}
  .fin-table td.fin-neto, .fin-table th.fin-neto{
    position:sticky;right:0;z-index:2;background:var(--panel);border-left:2px solid var(--primary);
  }
  .fin-table tbody tr.fin-row:hover td.fin-neto{background:var(--panel2);}
  .fin-pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .fin-total-row td{background:#EEF1F5;border-top:2px solid var(--primary);border-bottom:none;font-weight:700;color:var(--text);}
  .fin-total-row td.fin-first{position:sticky;left:0;background:#EEF1F5;}
  .fin-total-row td.fin-neto{position:sticky;right:0;background:#EEF1F5;border-left:2px solid var(--primary);}
  @media (max-width: 768px){
    #mobile-menu-btn{display:inline-flex !important;}
    #sidebar-aside{display:none;width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);}
    #sidebar-aside.mobile-open{display:block;}
    main{padding:16px !important;min-width:0 !important;}
    .fin-table{min-width:1220px;}
  }
</style>
</head>
<body>

<!-- ==================== APP (detrás de login real, ver final del archivo) ==================== -->
<div id="app-root" style="display:none;">
  <header style="border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <img src="logo-mark.png" alt="Qualified Logistics" style="height:26px;width:26px;" />
        <div style="line-height:1.1;">
          <div style="font-family:var(--display);font-weight:800;font-size:13px;color:var(--primary);letter-spacing:.2px;">QUALIFIED</div>
          <div style="font-family:var(--display);font-weight:700;font-size:7px;color:#5B7099;letter-spacing:1px;">LOGISTICS &amp; TRANSPORT</div>
        </div>
      </div>
      <div style="width:1px;height:26px;background:var(--border);"></div>
      <div>
        <div style="font-family:var(--display);font-size:13.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);">Panel de Gestión Qualified Logistics</div>
        <div style="font-size:11.5px;color:var(--mutedFaint);" id="current-user-email">Cargando…</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <button id="mobile-menu-btn" onclick="toggleMobileSidebar()" style="display:none;background:none;border:1px solid var(--border);border-radius:6px;padding:7px 11px;color:var(--text);font-size:15px;cursor:pointer;">☰</button>
      <button onclick="handleLogout()" style="background:none;border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--muted);font-size:12.5px;cursor:pointer;">Cerrar sesión</button>
    </div>
  </header>

  <div style="display:flex;flex-wrap:wrap;">
    <aside id="sidebar-aside"></aside>

    <main style="flex:1;min-width:320px;padding:24px;">
      <div style="margin-bottom:22px;">
        <div id="wh-title-row" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;"></div>
        <div id="wh-sub" style="font-size:12.5px;color:var(--muted);margin-top:4px;"></div>
      </div>
      <div id="tab-content"></div>
    </main>
  </div>
</div>

<div id="modal-slot"></div>

<script src="assets/js/supabase-init.js"></script>
<script src="assets/js/auth.js"></script>
<script>
/* =========================================================
   Conectado a Supabase (schema.sql). Los arrays/objetos de abajo
   se hidratan al arrancar (ver loadWarehouseModuleData()) y cada
   función que los modifica escribe primero en Supabase y solo
   actualiza la copia local si la escritura tuvo éxito.
========================================================= */

const WAREHOUSES = [
  { id: 'balsareny',       name: 'Balsareny',             subtitle: 'Zonas y estanterías', location_hint: 'Ej. Zona 3 · Estantería A2', location: 'Balsareny',             color: '#2E6F95' },
  { id: 'sant-fruitos',    name: 'Sant Fruitós de Bages',  subtitle: 'Zonas',                location_hint: 'Ej. Zona 5',                   location: 'Sant Fruitós de Bages',  color: '#C98A2E' },
  { id: 'pirelli-manresa', name: 'Pirelli Manresa',        subtitle: 'Naves y zonas',        location_hint: 'Ej. Nave 2 · Zona B',          location: 'Manresa',                 color: '#8A4A35' },
];

const nextId = (p) => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : `${p}-${Date.now()}-${Math.random().toString(16).slice(2)}`;

const DOCS_BUCKET = 'qualified-docs';
async function signedUrl(path){
  if (!path) return null;
  const { data } = await supabaseClient.storage.from(DOCS_BUCKET).createSignedUrl(path, 21600);
  return data ? data.signedUrl : null;
}
async function loadAttachmentsFor(parentType, ids){
  if (!ids.length) return {};
  const { data } = await supabaseClient.from('attachments').select('*').eq('parent_type', parentType).in('parent_id', ids);
  const byParent = {};
  for (const row of (data||[])) {
    const url = await signedUrl(row.storage_path);
    (byParent[row.parent_id] = byParent[row.parent_id] || []).push({ id: row.id, name: row.name, size: row.size, storage_path: row.storage_path, url });
  }
  return byParent;
}
async function syncAttachments(parentType, parentId){
  await supabaseClient.from('attachments').delete().eq('parent_type', parentType).eq('parent_id', parentId);
  const draft = window.__attachmentsDraft || [];
  if (draft.length) {
    await supabaseClient.from('attachments').insert(draft.map(a => ({ parent_type: parentType, parent_id: parentId, name: a.name, storage_path: a.storage_path, size: a.size })));
  }
}

let clients = [];
async function loadClients(){
  const { data } = await supabaseClient.from('clients').select('id,name,archived,client_warehouses(warehouse_id)').order('name');
  clients = (data||[]).map(r => ({ id: r.id, name: r.name, archived: r.archived, warehouseIds: (r.client_warehouses||[]).map(cw=>cw.warehouse_id) }));
}

let pallets = {};
async function loadPallets(){
  const { data } = await supabaseClient.from('pallets').select('*').order('date_in', { ascending: false });
  pallets = {}; WAREHOUSES.forEach(w => pallets[w.id] = []);
  (data||[]).forEach(p => pallets[p.warehouse_id].push({
    id: p.id, clientId: p.client_id, reference: p.reference, description: p.description,
    quantity: Number(p.quantity), unit: p.unit, location: p.location, status: p.status, dateIn: p.date_in,
  }));
}

let movements = {};
async function loadMovements(){
  const { data } = await supabaseClient.from('movements').select('*').order('date', { ascending: false });
  movements = {}; WAREHOUSES.forEach(w => movements[w.id] = []);
  (data||[]).forEach(m => movements[m.warehouse_id].push({
    id: m.id, palletId: m.pallet_id, clientId: m.client_id, type: m.type, quantity: Number(m.quantity), date: m.date, ref: m.ref,
  }));
}

const fmtDate = (d) => new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'short'});
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toDateStr(d){
  // formatea en fecha LOCAL (evita el desfase de toISOString, que convierte a UTC)
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const today = () => toDateStr(new Date());

const APPT_STATUS_COLORS = { planificado: '#D9A72C', completado: '#3F8F5F' };

let appointments = {};
async function loadAppointments(){
  const { data } = await supabaseClient.from('appointments').select('*');
  appointments = {}; WAREHOUSES.forEach(w => appointments[w.id] = []);
  const ids = (data||[]).map(a=>a.id);
  const attByParent = await loadAttachmentsFor('appointment', ids);
  (data||[]).forEach(a => appointments[a.warehouse_id].push({
    id: a.id, clientId: a.client_id, date: a.date, start: a.start_time, duration: a.duration_min,
    status: a.status, carrier: a.carrier, plate: a.plate, trailerPlate: a.trailer_plate,
    cargoRef: a.cargo_ref, type: a.type, notes: a.notes, attachments: attByParent[a.id] || [],
  }));
}

const WEEKDAY_KEYS = ['dom','lun','mar','mie','jue','vie','sab']; // getDay(): 0=domingo
const WEEKDAY_LABELS = { lun:'Lunes', mar:'Martes', mie:'Miércoles', jue:'Jueves', vie:'Viernes', sab:'Sábado', dom:'Domingo' };
const WEEK_ORDER = ['lun','mar','mie','jue','vie','sab','dom'];

let schedules = {};
async function loadSchedules(){
  const { data } = await supabaseClient.from('warehouse_schedules').select('*');
  schedules = {}; WAREHOUSES.forEach(w => schedules[w.id] = {});
  (data||[]).forEach(row => { schedules[row.warehouse_id][row.weekday] = { open: row.open, ranges: row.ranges }; });
}
function weekdayKey(dateStr){ return WEEKDAY_KEYS[new Date(dateStr+'T00:00:00').getDay()]; }
function daySchedule(warehouseId, dateStr){ return schedules[warehouseId][weekdayKey(dateStr)]; }
function scheduleLabel(sched){ return sched.ranges.map(r=>`${r.start}–${r.end}`).join(', '); }

let warehouseTasks = {};
async function loadWarehouseTasks(){
  const { data } = await supabaseClient.from('warehouse_tasks').select('*').order('created_at');
  warehouseTasks = {}; WAREHOUSES.forEach(w => warehouseTasks[w.id] = []);
  (data||[]).forEach(t => warehouseTasks[t.warehouse_id].push({
    id: t.id, date: t.date, text: t.text, done: t.done,
  }));
}
async function addWarehouseTask(){
  const input = document.getElementById('wt-input');
  const text = input.value.trim();
  if (!text) return;
  const { data, error } = await supabaseClient.from('warehouse_tasks').insert({
    warehouse_id: currentWarehouseId, date: window.__citasDate, text,
  }).select().single();
  if (error || !data) return;
  warehouseTasks[currentWarehouseId].push({ id: data.id, date: window.__citasDate, text, done: false });
  renderTab();
}
async function toggleWarehouseTask(id){
  const t = warehouseTasks[currentWarehouseId].find(x=>x.id===id);
  if (!t) return;
  const done = !t.done;
  await supabaseClient.from('warehouse_tasks').update({ done }).eq('id', id);
  t.done = done;
  renderTab();
}
async function deleteWarehouseTask(id){
  await supabaseClient.from('warehouse_tasks').delete().eq('id', id);
  warehouseTasks[currentWarehouseId] = warehouseTasks[currentWarehouseId].filter(x=>x.id!==id);
  renderTab();
}
async function moveWarehouseTaskDay(id, delta){
  const t = warehouseTasks[currentWarehouseId].find(x=>x.id===id);
  if (!t) return;
  const d = new Date(t.date+'T00:00:00');
  let newDate;
  for (let i = 0; i < 14; i++) {
    d.setDate(d.getDate()+delta);
    newDate = toDateStr(d);
    if (daySchedule(currentWarehouseId, newDate).open) break;
  }
  await supabaseClient.from('warehouse_tasks').update({ date: newDate }).eq('id', id);
  t.date = newDate;
  renderTab();
}
function moveWarehouseTaskToNextDay(id){ return moveWarehouseTaskDay(id, 1); }
function moveWarehouseTaskToPrevDay(id){ return moveWarehouseTaskDay(id, -1); }
function startEditWarehouseTask(id){ window.__editingTaskId = id; renderTab(); }
function cancelEditWarehouseTask(){ window.__editingTaskId = null; renderTab(); }
async function saveWarehouseTaskEdit(id){
  const input = document.getElementById('wt-edit-input');
  const text = input.value.trim();
  if (!text) return;
  const t = warehouseTasks[currentWarehouseId].find(x=>x.id===id);
  if (!t) return;
  await supabaseClient.from('warehouse_tasks').update({ text }).eq('id', id);
  t.text = text;
  window.__editingTaskId = null;
  renderTab();
}
function tplWarehouseTasks(){
  const list = (warehouseTasks[currentWarehouseId]||[]).filter(t => t.date === window.__citasDate);
  return `
    <div class="card" style="margin-top:14px;">
      <div style="font-family:var(--display);text-transform:uppercase;font-size:12.5px;color:var(--muted);margin-bottom:10px;">Tareas del almacén — recordatorio</div>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input id="wt-input" placeholder="Escribe una tarea y pulsa Añadir…" onkeydown="if(event.key==='Enter'){event.preventDefault(); addWarehouseTask();}" style="flex:1;" />
        <button class="btn btn-primary" onclick="addWarehouseTask()">+ Añadir</button>
      </div>
      ${list.length === 0 ? `<div style="color:var(--mutedFaint);font-size:12.5px;">Sin tareas apuntadas para este día.</div>` : list.map(t => {
        if (window.__editingTaskId === t.id) return `
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);">
          <input id="wt-edit-input" value="${esc(t.text)}" onkeydown="if(event.key==='Enter'){event.preventDefault(); saveWarehouseTaskEdit('${t.id}');} if(event.key==='Escape'){cancelEditWarehouseTask();}" style="flex:1;" />
          <button class="btn btn-primary" onclick="saveWarehouseTaskEdit('${t.id}')">Guardar</button>
          <button class="btn btn-ghost" onclick="cancelEditWarehouseTask()">Cancelar</button>
        </div>`;
        return `
        <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);">
          <input type="checkbox" ${t.done?'checked':''} onchange="toggleWarehouseTask('${t.id}')" />
          <div style="flex:1;font-size:13px;${t.done?'text-decoration:line-through;color:var(--mutedFaint);':''}">${esc(t.text)}</div>
          <button title="Editar" onclick="startEditWarehouseTask('${t.id}')" style="background:none;border:none;color:var(--muted);">✏️</button>
          <button title="Mover al día anterior" onclick="moveWarehouseTaskToPrevDay('${t.id}')" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12.5px;padding:5px 10px;">← Ayer</button>
          <button title="Mover al día siguiente" onclick="moveWarehouseTaskToNextDay('${t.id}')" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12.5px;padding:5px 10px;">→ Mañana</button>
          <button onclick="deleteWarehouseTask('${t.id}')" style="background:none;border:none;color:var(--mutedFaint);">🗑</button>
        </div>`;
      }).join('')}
    </div>`;
}

let unscheduled = {};
async function loadUnscheduled(){
  const { data } = await supabaseClient.from('unscheduled_trucks').select('*');
  unscheduled = {}; WAREHOUSES.forEach(w => unscheduled[w.id] = []);
  const ids = (data||[]).map(u=>u.id);
  const attByParent = await loadAttachmentsFor('unscheduled', ids);
  (data||[]).forEach(u => unscheduled[u.warehouse_id].push({
    id: u.id, clientId: u.client_id, date: u.date, status: u.status, carrier: u.carrier, plate: u.plate,
    trailerPlate: u.trailer_plate, cargoRef: u.cargo_ref, type: u.type, notes: u.notes, attachments: attByParent[u.id] || [],
  }));
}

const LANES = 2; // camiones que se pueden atender a la vez en cada almacén

function timeToMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function slotTimes(ranges){ const arr=[]; ranges.forEach(r=>{ for(let m=timeToMin(r.start); m<timeToMin(r.end); m+=30) arr.push(m); }); return arr; }
function fitsInARange(ranges, startMin, endMin){ return ranges.some(r => startMin >= timeToMin(r.start) && endMin <= timeToMin(r.end)); }
window.__citasDate = today();
window.__calOpen = false;

let currentWarehouseId = 'balsareny';
let currentTab = 'citas';

const TABS = [
  {id:'clientes', label:'Clientes', group:'Vista'},
  {id:'citas', label:'Franjas horarias', group:'Vista'},
  {id:'documentos', label:'Documentos de almacén', group:'Vista'},
  {id:'trafico', label:'Tráfico', group:'Empresa'},
  {id:'autonomos', label:'Autónomos', group:'Empresa'},
  {id:'fichajes', label:'Fichajes', group:'Empresa'},
];
const ADMIN_TAB = {id:'admin', label:'Administración', group:'Configuración'};

let PROFILE = null;
let CURRENT_USER_ID = null;
async function loadProfile(){
  const { data } = await supabaseClient.auth.getUser();
  CURRENT_USER_ID = data && data.user ? data.user.id : null;
  const { data: row } = await supabaseClient.from('profiles').select('*').eq('id', CURRENT_USER_ID).maybeSingle();
  PROFILE = row ? { isAdmin: row.is_admin, allowedTabs: row.allowed_tabs || [], driverId: row.driver_id || null, canEditSchedule: row.can_edit_schedule || false } : { isAdmin: false, allowedTabs: [], driverId: null, canEditSchedule: false };
}
function isDriverOnlyAccount(){ return !!PROFILE.driverId && !PROFILE.isAdmin; }
function visibleTabs(){
  return PROFILE.isAdmin ? TABS : TABS.filter(t => PROFILE.allowedTabs.includes(t.id));
}

function currentWh(){ return WAREHOUSES.find(w=>w.id===currentWarehouseId); }
function clientName(cid){ return (clients.find(c=>c.id===cid)||{}).name || '—'; }
function palletById(pid){ return pallets[currentWarehouseId].find(p=>p.id===pid); }

function toggleMobileSidebar(){
  document.getElementById('sidebar-aside').classList.toggle('mobile-open');
}
function closeMobileSidebar(){
  document.getElementById('sidebar-aside').classList.remove('mobile-open');
}

function switchWarehouse(id){
  currentWarehouseId = id; window.__invSearch='';
  closeMobileSidebar();
  renderSidebar(); renderHeader(); renderTab();
}
async function setTab(id){
  const allowed = visibleTabs().map(t=>t.id);
  if (id !== 'admin' && !allowed.includes(id)) return;
  if (id === 'admin' && !PROFILE.isAdmin) return;
  currentTab = id;
  closeMobileSidebar();
  if (id === 'admin') await loadAllProfiles();
  renderSidebar(); renderHeader(); renderTab();
}

function renderSidebar(){
  const items = visibleTabs().concat(PROFILE.isAdmin ? [ADMIN_TAB] : []);
  const groups = [];
  items.forEach(t => {
    let g = groups.find(g => g.name === t.group);
    if (!g) { g = { name: t.group, items: [] }; groups.push(g); }
    g.items.push(t);
  });
  const navHtml = groups.map(g => `
    <div class="sb-group-title">${esc(g.name)}</div>
    ${g.items.map(t => `<button class="tab-btn ${t.id===currentTab?'active':''}" onclick="setTab('${t.id}')">${esc(t.label)}</button>`).join('')}
  `).join('');

  document.getElementById('sidebar-aside').innerHTML = navHtml;
}
const PLAIN_TITLE_STYLE = 'font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.4px;';
function renderHeader(){
  const titleRow = document.getElementById('wh-title-row');
  if (currentTab === 'admin') {
    titleRow.innerHTML = `<div style="${PLAIN_TITLE_STYLE}">Administración</div>`;
    document.getElementById('wh-sub').textContent = 'Usuarios y pestañas visibles para cada uno · Qualified Logistics';
    return;
  }
  if (currentTab === 'trafico') {
    titleRow.innerHTML = `<div style="${PLAIN_TITLE_STYLE}">Dashboard Tráfico</div>`;
    document.getElementById('wh-sub').textContent = 'Estado semanal de km y horas de cada autónomo, para decidir hoy · Qualified Logistics';
    return;
  }
  if (currentTab === 'autonomos') {
    titleRow.innerHTML = `<div style="${PLAIN_TITLE_STYLE}">Panel de Control Autónomos</div>`;
    document.getElementById('wh-sub').textContent = 'Empresas colaboradoras y liquidación semanal · Qualified Logistics';
    return;
  }
  if (currentTab === 'fichajes') {
    titleRow.innerHTML = `<div style="${PLAIN_TITLE_STYLE}">Fichajes</div>`;
    document.getElementById('wh-sub').textContent = 'Jornadas fichadas por cada conductor, con opción de corregirlas · Qualified Logistics';
    return;
  }
  const wh = currentWh();
  titleRow.innerHTML = `
    <select onchange="switchWarehouse(this.value)" style="${PLAIN_TITLE_STYLE}font-size:20px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);cursor:pointer;max-width:100%;">
      ${WAREHOUSES.map(w=>`<option value="${w.id}" ${w.id===currentWarehouseId?'selected':''}>${esc(w.name)}</option>`).join('')}
    </select>`;
  document.getElementById('wh-sub').textContent = `${wh.location} · ${wh.subtitle}`;
}

function renderTab(){
  const el = document.getElementById('tab-content');
  if (window.__kioskMode) { el.innerHTML = tplKiosk(); return; }
  if (currentTab === 'resumen') el.innerHTML = tplResumen();
  if (currentTab === 'mercancia') el.innerHTML = tplMercancia();
  if (currentTab === 'clientes') el.innerHTML = tplClientes();
  if (currentTab === 'movimientos') el.innerHTML = tplMovimientos();
  if (currentTab === 'citas') el.innerHTML = tplCitas();
  if (currentTab === 'documentos') el.innerHTML = tplDocumentos();
  if (currentTab === 'autonomos') el.innerHTML = tplAutonomos();
  if (currentTab === 'trafico') el.innerHTML = tplTrafico();
  if (currentTab === 'admin') el.innerHTML = tplAdmin();
  if (currentTab === 'fichajes') el.innerHTML = tplFichajes();
}

function tplResumen(){
  const activos = pallets[currentWarehouseId].filter(p=>p.status==='en almacén');
  const porCliente = {};
  activos.forEach(p => porCliente[p.clientId] = (porCliente[p.clientId]||0) + Number(p.quantity));
  const rows = Object.entries(porCliente).map(([cid,qty])=>({name:clientName(cid), qty})).sort((a,b)=>b.qty-a.qty);
  const movs = [...movements[currentWarehouseId]].sort((a,b)=>b.date.localeCompare(a.date));
  return `
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px;">
      ${kpi('Palets en almacén', activos.length)}
      ${kpi('Clientes activos', rows.length)}
      ${kpi('Movimientos (total)', movements[currentWarehouseId].length)}
    </div>
    <div class="card" style="margin-bottom:22px;">
      <div style="font-family:var(--display);text-transform:uppercase;font-size:13.5px;margin-bottom:12px;">Mercancía por cliente</div>
      <table><thead><tr><th>Cliente</th><th>Palets en almacén</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.qty}</td></tr>`).join('') || `<tr><td colspan="2" style="color:var(--mutedFaint);text-align:center;padding:20px;">Sin mercancía todavía</td></tr>`}
      </tbody></table>
    </div>
    <div class="card">
      <div style="font-family:var(--display);text-transform:uppercase;font-size:13.5px;margin-bottom:12px;">Últimos movimientos</div>
      <table><thead><tr><th>Tipo</th><th>Palet</th><th>Cliente</th><th>Fecha</th></tr></thead><tbody>
        ${movs.slice(0,5).map(m=>{
          const p = palletById(m.palletId);
          return `<tr>
            <td style="color:${m.type==='entrada'?'var(--success)':'var(--danger)'};text-transform:capitalize;">${m.type==='entrada'?'↑':'↓'} ${esc(m.type)}</td>
            <td>${esc(p ? (p.reference||p.description) : '—')}</td>
            <td>${esc(clientName(m.clientId))}</td>
            <td style="color:var(--muted);">${fmtDate(m.date)}</td>
          </tr>`;
        }).join('') || `<tr><td colspan="4" style="color:var(--mutedFaint);text-align:center;padding:20px;">Sin movimientos todavía</td></tr>`}
      </tbody></table>
    </div>`;
}

  if (view === 'archivados') list = clients.filter(c => c.warehouseIds.includes(currentWarehouseId) && c.archived);
  else if (view === 'sinasignar') list = clients.filter(c => c.warehouseIds.length === 0 && !c.archived);
  else list = clients.filter(c => c.warehouseIds.includes(currentWarehouseId) && !c.archived);

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">

        <button class="btn ${view==='sinasignar'?'btn-primary':'btn-ghost'}" onclick="window.__clientsView='sinasignar'; renderTab();">⚠ Sin asignar (${unassignedCount})</button>
        <button class="btn ${view==='archivados'?'btn-primary':'btn-ghost'}" onclick="window.__clientsView='archivados'; renderTab();">🗄 Archivados</button>
      </div>
      ${view==='archivados' ? '' : `<button class="btn btn-primary" onclick="openClientModal()">+ Nuevo cliente</button>`}
    </div>
    ${view==='sinasignar' ? `<div style="font-size:12px;color:var(--muted);margin-bottom:14px;">Estos clientes todavía no están asignados a ningún almacén. Ábrelos para marcarles uno o varios.</div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;">
      ${list.map(c=>{
        const activos = view==='sinasignar' ? 0 : pallets[currentWarehouseId].filter(p=>p.clientId===c.id && p.status==='en almacén').length;
        return `<div class="card" style="position:relative;${view==='archivados'?'opacity:0.7;':''}">
          <div onclick="openClientModal('${c.id}')" style="cursor:pointer;">
            <div style="font-family:var(--display);font-size:15.5px;margin-bottom:4px;">${esc(c.name)}${view==='archivados'?' <span style="font-size:10.5px;color:var(--mutedFaint);text-transform:uppercase;">· archivado</span>':''}</div>
          </div>

        </div>`;
      }).join('') || `<div style="color:var(--mutedFaint);">${view==='archivados'?'No hay clientes archivados.':view==='sinasignar'?'Todos los clientes tienen almacén asignado.':'Sin clientes todavía'}</div>`}
    </div>`;
}

function activeApptsAt(dayAppts, startMin){
  return dayAppts
    .filter(a => { const s=timeToMin(a.start), e=s+a.duration; return startMin>=s && startMin<e; })
    .sort((a,b)=> timeToMin(a.start)-timeToMin(b.start) || a.id.localeCompare(b.id));
}

function apptCellHtml(appt, wh, rowStart){
  const color = APPT_STATUS_COLORS[appt.status || 'planificado'];
  const startMin = timeToMin(appt.start);
  const endMin = startMin + appt.duration;
  const isFirst = rowStart === startMin;
  const isLast = rowStart + 30 >= endMin;
  const radius = isFirst && isLast ? '6px' : isFirst ? '6px 6px 0 0' : isLast ? '0 0 6px 6px' : '0';
  if (!isFirst) {
    return `<div onclick="openAppointmentModal(null,'${appt.id}')" style="flex:1;background:${color}1A;border-left:3px solid ${color};border-radius:${radius};min-height:14px;cursor:pointer;min-width:0;"></div>`;
  }
  const c = clients.find(x=>x.id===appt.clientId);
  const isDone = appt.status === 'completado';
  return `
    <div onclick="openAppointmentModal(null,'${appt.id}')" style="flex:1;background:${color}1A;border-left:3px solid ${color};border-radius:${radius};padding:8px 10px;cursor:pointer;min-width:0;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:4px;">
        <div style="font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c?c.name:'—')}${(appt.attachments&&appt.attachments.length)?` <span title="${appt.attachments.length} documento(s) adjunto(s)" style="font-size:10.5px;color:var(--muted);font-weight:500;">📎${appt.attachments.length}</span>`:''}</div>
        <div style="display:flex;gap:4px;flex-shrink:0;">
          <button title="${isDone?'Volver a planificado':'Marcar como completado'}" onclick="event.stopPropagation(); toggleApptStatus('${appt.id}')" style="background:none;border:none;color:${isDone?APPT_STATUS_COLORS.completado:'var(--mutedFaint)'};">${isDone?'✓':'○'}</button>
          <button onclick="event.stopPropagation(); deleteAppointment('${appt.id}')" style="background:none;border:none;color:var(--mutedFaint);">🗑</button>
        </div>
      </div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.5;">
        ${minToTime(startMin)}–${minToTime(endMin)} · <span style="text-transform:capitalize;">${esc(appt.type)}</span> · <span style="text-transform:capitalize;color:${color};font-weight:600;">${esc(appt.status||'planificado')}</span><br>
        ${appt.carrier ? '🏢 '+esc(appt.carrier)+'<br>' : ''}
        🚚 ${esc(appt.plate||'—')}${appt.trailerPlate ? ' · 🔗 '+esc(appt.trailerPlate) : ''}
        ${appt.cargoRef ? '<br>Ref: '+esc(appt.cargoRef) : ''}
        ${appt.notes ? '<br>'+esc(appt.notes) : ''}
      </div>
    </div>`;
}
function emptyCell(startMin, compact){
  return `<button onclick="openAppointmentModal('${minToTime(startMin)}')" style="flex:1;text-align:left;background:transparent;border:1px dashed var(--border);border-radius:6px;padding:${compact?'6px 8px':'8px 12px'};color:var(--mutedFaint);font-size:${compact?'11px':'12px'};min-width:0;">+ Reservar${compact?'':' franja'}</button>`;
}

function renderTimeline(dayAppts, wh, slots){
  return slots.map((startMin, idx) => {
    const prev = slots[idx-1];
    const gapBefore = idx > 0 && startMin - prev > 30
      ? `<div style="text-align:center;font-size:11px;color:var(--mutedFaint);letter-spacing:.4px;margin:6px 0;">— pausa (${minToTime(prev+30)}–${minToTime(startMin)}) —</div>`
      : '';
    const active = activeApptsAt(dayAppts, startMin);
    let cellsHtml;
    let rowContinues = false;
    if (active.length === 0) {
      cellsHtml = emptyCell(startMin, false);
    } else if (active.length === 1) {
      const a0 = active[0];
      cellsHtml = apptCellHtml(a0, wh, startMin) + emptyCell(startMin, true);
      rowContinues = (timeToMin(a0.start) + a0.duration) > startMin + 30;
    } else {
      const [a0, a1] = active;
      cellsHtml = apptCellHtml(a0, wh, startMin) + apptCellHtml(a1, wh, startMin);
      rowContinues = active.some(a => (timeToMin(a.start) + a.duration) > startMin + 30);
    }
    return gapBefore + `
      <div style="display:flex;gap:10px;align-items:stretch;margin-bottom:${rowContinues?'0':'4px'};">
        <div style="width:52px;flex-shrink:0;font-family:var(--mono);font-size:11.5px;color:var(--mutedFaint);padding-top:8px;">${minToTime(startMin)}</div>
        <div style="flex:1;display:flex;gap:6px;min-width:0;">${cellsHtml}</div>
      </div>`;
  }).join('');
}

  const dayAppts = appointments[currentWarehouseId].filter(a => a.date === dateStr);
  const slots = sched.open ? slotTimes(sched.ranges) : [];

  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;position:relative;">
      <button class="btn btn-ghost" onclick="changeCitasDate(-1)">← Día anterior</button>
      <button onclick="toggleCalendar()" style="background:none;border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.3px;min-width:200px;text-align:center;color:var(--text);">
        📅 ${new Date(dateStr+'T00:00:00').toLocaleDateString('es-ES',{weekday:'long', day:'2-digit', month:'long'})}

      <button class="btn btn-ghost" onclick="changeCitasDate(1)">Día siguiente →</button>

      <button class="btn btn-primary" onclick="openAppointmentModal()" ${sched.open?'':'disabled'}>+ Nueva reserva</button>
      ${window.__calOpen ? `<div onclick="window.__calOpen=false; renderTab();" style="position:fixed;inset:0;z-index:39;"></div>` + calendarPopoverHtml() : ''}

    </div>`}

}

let companies = [];
async function loadCompanies(){
  const { data } = await supabaseClient.from('companies').select('*').order('name');
  companies = (data||[]).map(c => ({ id: c.id, name: c.name }));
}
let drivers = [];
async function loadDrivers(){
  const { data } = await supabaseClient.from('drivers').select('*').order('name');
  drivers = (data||[]).map(d => ({ id: d.id, companyId: d.company_id, name: d.name, dni: d.dni, fleetNumber: d.fleet_number, archived: d.archived }));
}
let rateHistory = [];
async function loadDriverRates(){
  const { data } = await supabaseClient.from('driver_rates').select('*');

function getISOWeek(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return { year: d.getFullYear(), week };
}
function isoWeekThursday(year, week){
  const jan4 = new Date(year, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const week1Monday = new Date(jan4);
  week1Monday.setDate(jan4.getDate() - (jan4Day - 1));
  const thursday = new Date(week1Monday);
  thursday.setDate(week1Monday.getDate() + (week-1)*7 + 3);
  return thursday;
}
function weekMonth(year, week){ return isoWeekThursday(year, week).getMonth(); }
function fichajeHours(f){
  if (!f.timeOut) return null;
  const [h1,m1] = f.timeIn.split(':').map(Number);
  const [h2,m2] = f.timeOut.split(':').map(Number);
  let mins = (h2*60+m2) - (h1*60+m1);
  if (mins < 0) mins += 24*60; // turno que cruza medianoche
  return Math.round((mins/60) * 100) / 100;
}
function fmtHoursMin(decimalHours){
  if (decimalHours == null || isNaN(decimalHours)) return '—';
  const sign = decimalHours < 0 ? '-' : '';
  let totalMin = Math.round(Math.abs(decimalHours) * 60);
  let h = Math.floor(totalMin / 60);
  let m = totalMin % 60;
  return `${sign}${h}h ${String(m).padStart(2,'0')}m`;
}

function computeGasoilForWeek(driverId, year, week, month){
  return fuelEntries
    .filter(f => f.driverId===driverId)
    .filter(f => { const w = getISOWeek(f.date); return w.year===year && w.week===week; })
    .filter(f => month===undefined || Number(f.date.slice(5,7))-1===month)
    .reduce((s,f) => s + Number(f.liters||0)*Number(f.pricePerLiter||0), 0);
}

function computeWeek(driver, e){
  const maxKm = driver.maxKmDay * e.daysWorked;
  const maxHours = driver.maxHoursDay * e.daysWorked;
  const kmExtra = e.km - maxKm;
  const hoursExtra = e.hours - maxHours;
  const dayAmount = e.daysWorked * driver.priceDay;
  const kmExtraAmount = kmExtra * driver.priceKmExtra;
  const hoursExtraAmount = hoursExtra * driver.priceHourExtra;
  const extraCharge = Math.max(kmExtraAmount, hoursExtraAmount, 0);
  const supplements = Number(e.supplements||0);
  const totalIngreso = dayAmount + extraCharge + supplements;
  const gastosTotal = Number(e.gasoil||0) + Number(e.peajes||0) + Number(e.otros||0);
  const neto = totalIngreso - gastosTotal;
  return { maxKm, maxHours, kmExtra, hoursExtra, dayAmount, kmExtraAmount, hoursExtraAmount, extraCharge, totalIngreso, gastosTotal, neto };
}
function eur2(n){ return Number(n||0).toLocaleString('es-ES', { style:'currency', currency:'EUR' }); }
function eurSigned(n){
  if (!n) return '—';
  return (n<0?'−':'+') + eur2(Math.abs(n));
}

async function submitSchedule(){
  if (!PROFILE.isAdmin && !PROFILE.canEditSchedule) return;
  const errEl = document.getElementById('sch-error');
  const draft = window.__schedDraft;
  for (const day of WEEK_ORDER) {
    if (!draft[day].open) continue;
    const ranges = [...draft[day].ranges].sort((a,b)=>a.start.localeCompare(b.start));
    for (let i=0;i<ranges.length;i++){
      if (ranges[i].start >= ranges[i].end) { errEl.textContent = `En ${WEEKDAY_LABELS[day]}, cada tramo debe cerrar después de abrir.`; return; }
      if (i>0 && ranges[i].start < ranges[i-1].end) { errEl.textContent = `En ${WEEKDAY_LABELS[day]}, hay tramos que se solapan.`; return; }
    }
    draft[day].ranges = ranges;
  }
  await supabaseClient.from('warehouse_schedules').upsert(
    WEEK_ORDER.map(day => ({ warehouse_id: currentWarehouseId, weekday: day, open: draft[day].open, ranges: draft[day].ranges })),
    { onConflict: 'warehouse_id,weekday' }
  );
  schedules[currentWarehouseId] = draft;
  closeModal(); renderTab();
}

function renderAttachmentList(){

async function addAttachmentFiles(fileList){
  const files = Array.from(fileList || []);
  for (const file of files) {
    if (file.type !== 'application/pdf') { alert(`"${file.name}" no es un PDF.`); continue; }
    if (file.size > MAX_ATTACHMENT_MB*1024*1024) { alert(`"${file.name}" pesa demasiado (máx ${MAX_ATTACHMENT_MB}MB).`); continue; }
    const draftId = nextId();
    const path = `attachments/${draftId}-${file.name}`;
    const { error } = await supabaseClient.storage.from(DOCS_BUCKET).upload(path, file);
    if (error) { alert(`No se pudo subir "${file.name}".`); continue; }
    const url = await signedUrl(path);
    window.__attachmentsDraft.push({ id: draftId, name: file.name, size: file.size, storage_path: path, url });
    renderAttachmentList();
  }
  const input = document.getElementById('att-file-input');
  if (input) input.value = '';
}
async function removeAttachmentDraft(id){
  const a = (window.__attachmentsDraft||[]).find(x=>x.id===id);
  if (a && a.storage_path) await supabaseClient.storage.from(DOCS_BUCKET).remove([a.storage_path]);
  window.__attachmentsDraft = window.__attachmentsDraft.filter(x=>x.id!==id);
  renderAttachmentList();
}

async function unassignTime(id){
  const appt = appointments[currentWarehouseId].find(a=>a.id===id);
  if (!appt) return;
  const { data: row, error } = await supabaseClient.from('unscheduled_trucks').insert({
    warehouse_id: currentWarehouseId, client_id: appt.clientId, date: appt.date, status: appt.status,
    carrier: appt.carrier, plate: appt.plate, trailer_plate: appt.trailerPlate,
    cargo_ref: appt.cargoRef, type: appt.type, notes: appt.notes,
  }).select().single();
  if (error || !row) return;
  if ((appt.attachments||[]).length) {
    await supabaseClient.from('attachments').insert(appt.attachments.map(a => ({
      parent_type: 'unscheduled', parent_id: row.id, name: a.name, storage_path: a.storage_path, size: a.size,
    })));
  }
  await supabaseClient.from('attachments').delete().eq('parent_type','appointment').eq('parent_id', id);
  await supabaseClient.from('appointments').delete().eq('id', id);
  await Promise.all([loadAppointments(), loadUnscheduled()]);
  closeModal(); renderTab();
}
function refreshAppointmentTimeOptions(){
  const dateVal = document.getElementById('af-date').value;
  const sched = daySchedule(currentWarehouseId, dateVal);
  const startSel = document.getElementById('af-start');
  const prevVal = startSel.value;
  if (!sched.open) {
    startSel.innerHTML = `<option value="">Almacén cerrado ese día</option>`;
    startSel.disabled = true;
    return;
  }
  startSel.disabled = false;
  startSel.innerHTML = slotTimes(sched.ranges).map(m=>`<option value="${minToTime(m)}" ${minToTime(m)===prevVal?'selected':''}>${minToTime(m)}</option>`).join('');
}
async function submitAppointment(editId){
  const clientId = document.getElementById('af-client').value;
  const date = document.getElementById('af-date').value;
  const start = document.getElementById('af-start').value;
  const duration = Number(document.getElementById('af-duration').value);
  const errEl = document.getElementById('af-error');
  const startMin = timeToMin(start);
  const endMin = startMin + duration;

  const sched = daySchedule(currentWarehouseId, date);
  if (!sched.open) { errEl.textContent = 'El almacén está cerrado ese día. Elige otro.'; return; }
  if (!fitsInARange(sched.ranges, startMin, endMin)) { errEl.textContent = `Esa franja no cabe dentro del horario del día (${scheduleLabel(sched)}). No se puede reservar cruzando una pausa.`; return; }

  const dayAppts = appointments[currentWarehouseId].filter(a => a.date === date && a.id !== editId);
  const overlapCount = dayAppts.filter(a => {
    const aStart = timeToMin(a.start), aEnd = aStart + a.duration;
    return startMin < aEnd && endMin > aStart;
  }).length;
  if (overlapCount >= LANES) { errEl.textContent = `Ya hay ${LANES} camiones reservados en ese horario. Elige otra franja.`; return; }

  const data = {
    warehouse_id: currentWarehouseId, client_id: clientId, date, start_time: start, duration_min: duration,
    status: editId ? document.getElementById('af-status').value : 'planificado',
    carrier: document.getElementById('af-carrier').value.trim(),
    plate: document.getElementById('af-plate').value.trim(),
    trailer_plate: document.getElementById('af-trailer').value.trim(),
    cargo_ref: document.getElementById('af-cargoref').value.trim(),
    type: document.getElementById('af-type').value,
    notes: document.getElementById('af-notes').value.trim(),
  };

  let id = editId;
  if (editId) {
    await supabaseClient.from('appointments').update(data).eq('id', editId);
  } else {
    const { data: row, error } = await supabaseClient.from('appointments').insert(data).select().single();
    if (error || !row) { errEl.textContent = 'No se pudo guardar.'; return; }
    id = row.id;
  }
  await syncAttachments('appointment', id);
  const fromUnsched = document.getElementById('af-from-unscheduled')?.value;
  if (fromUnsched) {
    await supabaseClient.from('attachments').delete().eq('parent_type','unscheduled').eq('parent_id', fromUnsched);
    await supabaseClient.from('unscheduled_trucks').delete().eq('id', fromUnsched);
  }
  await Promise.all([loadAppointments(), loadUnscheduled()]);
  window.__citasDate = date; // saltar a ver el día donde ha quedado la reserva
  closeModal(); renderTab();
}

function tplDocumentos(){
  const filter = window.__docFilter || 'todos';
  const typeFilter = window.__docTypeFilter || 'todos';
  const search = (window.__docSearch || '').toLowerCase();
  if (window.__docRangeFrom === undefined) window.__docRangeFrom = today();
  if (window.__docRangeTo === undefined) { const d = new Date(today()+'T00:00:00'); d.setDate(d.getDate()+7); window.__docRangeTo = toDateStr(d); }
  const rangeMode = window.__docRangeMode || '7dias';

  const schedRows = appointments[currentWarehouseId].map(a => ({
    kind: 'appt', id: a.id, date: a.date, time: a.start, clientId: a.clientId,
    type: a.type, status: a.status || 'planificado', attachments: a.attachments || [],
  }));
  const unschedRows = unscheduled[currentWarehouseId].map(u => ({
    kind: 'unsched', id: u.id, date: u.date, time: null, clientId: u.clientId,
    type: u.type, status: u.status || 'planificado', attachments: u.attachments || [],
  }));
  let rows = [...schedRows, ...unschedRows];

  if (rangeMode !== 'todos') {
    if (window.__docRangeFrom) rows = rows.filter(r => r.date >= window.__docRangeFrom);
    if (window.__docRangeTo) rows = rows.filter(r => r.date <= window.__docRangeTo);
  }
  if (filter === 'con') rows = rows.filter(r => r.attachments.length > 0);
  if (filter === 'sin') rows = rows.filter(r => r.attachments.length === 0);
  if (typeFilter !== 'todos') rows = rows.filter(r => r.type === typeFilter);
  if (search) rows = rows.filter(r => clientName(r.clientId).toLowerCase().includes(search));

  rows.sort((a,b) => (a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));

  const inRange = rangeMode === 'todos' ? [...schedRows, ...unschedRows] : [...schedRows, ...unschedRows].filter(r =>
    (!window.__docRangeFrom || r.date >= window.__docRangeFrom) && (!window.__docRangeTo || r.date <= window.__docRangeTo));
  const countCon = inRange.filter(r=>r.attachments.length>0).length;
  const countSin = inRange.filter(r=>r.attachments.length===0).length;
  const countEntradas = inRange.filter(r=>r.type==='descarga').length;
  const countSalidas = inRange.filter(r=>r.type==='carga').length;

  return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn ${rangeMode==='hoy'?'btn-primary':'btn-ghost'}" onclick="setDocRange('hoy')">Hoy</button>
      <button class="btn ${rangeMode==='7dias'?'btn-primary':'btn-ghost'}" onclick="setDocRange('7dias')">Próximos 7 días</button>
      <button class="btn ${rangeMode==='30dias'?'btn-primary':'btn-ghost'}" onclick="setDocRange('30dias')">Próximos 30 días</button>
      <button class="btn ${rangeMode==='todos'?'btn-primary':'btn-ghost'}" onclick="setDocRange('todos')">Todos los días</button>
      <span style="color:var(--mutedFaint);font-size:12px;">o rango personalizado:</span>
      <input type="date" value="${window.__docRangeFrom}" onchange="window.__docRangeFrom=this.value; window.__docRangeMode='custom'; renderTab();" style="width:150px;" />
      <span style="color:var(--mutedFaint);">–</span>
      <input type="date" value="${window.__docRangeTo}" onchange="window.__docRangeTo=this.value; window.__docRangeMode='custom'; renderTab();" style="width:150px;" />
    </div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">
      ${rangeMode==='todos' ? 'Mostrando todos los días registrados.' : `Mostrando del ${fmtDate(window.__docRangeFrom)} al ${fmtDate(window.__docRangeTo)}.`}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
      <button class="btn ${filter==='todos'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='todos'; renderTab();">Todos (${inRange.length})</button>
      <button class="btn ${filter==='sin'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='sin'; renderTab();">📄 Sin adjunto (${countSin})</button>
      <button class="btn ${filter==='con'?'btn-primary':'btn-ghost'}" onclick="window.__docFilter='con'; renderTab();">📎 Con adjunto (${countCon})</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="btn ${typeFilter==='todos'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='todos'; renderTab();">Cargas y descargas</button>
      <button class="btn ${typeFilter==='descarga'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='descarga'; renderTab();">⬇ Descargas (${countEntradas})</button>
      <button class="btn ${typeFilter==='carga'?'btn-primary':'btn-ghost'}" onclick="window.__docTypeFilter='carga'; renderTab();">⬆ Cargas (${countSalidas})</button>
      <div style="flex:1;min-width:160px;"><input placeholder="Buscar por cliente…" value="${esc(window.__docSearch||'')}" onkeyup="window.__docSearch=this.value; renderTab();" /></div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table><thead><tr><th>Fecha</th><th>Hora</th><th>Cliente</th><th>Tipo</th><th>Estado</th><th>Adjuntos</th></tr></thead><tbody>
        ${rows.map(r => `
          <tr onclick="openFromDocumentos('${r.kind}','${r.id}','${r.date}')" style="cursor:pointer;">
            <td>${fmtDate(r.date)}</td>
            <td style="color:var(--muted);">${r.time || '<span style="color:var(--mutedFaint);">sin hora</span>'}</td>
            <td>${esc(clientName(r.clientId))}</td>

            <td><span style="text-transform:capitalize;color:${APPT_STATUS_COLORS[r.status]};font-weight:600;font-size:12px;">${esc(r.status)}</span></td>
            <td>${r.attachments.length ? `<span style="color:var(--primary);">📎 ${r.attachments.length}</span>` : `<span style="color:var(--mutedFaint);">— sin adjuntar</span>`}</td>
          </tr>`).join('') || `<tr><td colspan="6" style="color:var(--mutedFaint);text-align:center;padding:24px;">Sin resultados en este rango de fechas</td></tr>`}
      </tbody></table>
    </div>`;
}
function setDocRange(mode){
  window.__docRangeMode = mode;

    window.__docRangeFrom = today();
    const d = new Date(today()+'T00:00:00'); d.setDate(d.getDate() + (mode==='7dias'?7:30));
    window.__docRangeTo = toDateStr(d);
  }
  renderTab();
}

function deleteClientForever(id){
  const hasHistory = Object.keys(pallets).some(wid => pallets[wid].some(p=>p.clientId===id))
    || Object.keys(movements).some(wid => movements[wid].some(m=>m.clientId===id))
    || Object.keys(appointments).some(wid => appointments[wid].some(a=>a.clientId===id))
    || Object.keys(unscheduled).some(wid => unscheduled[wid].some(u=>u.clientId===id));
  if (hasHistory) {
    document.getElementById('modal-slot').innerHTML = `
      <div class="modal-overlay">
        <div class="modal-box" style="max-width:360px;">
          <h3 class="modal-title" style="margin-bottom:10px;">No se puede eliminar</h3>
          <div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">
            Este cliente tiene mercancía o movimientos registrados en el histórico. Para conservar la trazabilidad no se puede eliminar de forma permanente — puedes dejarlo archivado.
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="closeModal()">Entendido</button>
        </div>
      </div>`;
    return;
  }
  const c = clients.find(x=>x.id===id);
  document.getElementById('modal-slot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box" style="max-width:360px;">
        <h3 class="modal-title" style="margin-bottom:10px;">Eliminar definitivamente</h3>
        <div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">¿Seguro que quieres eliminar a ${esc(c?c.name:'este cliente')}? Esta acción no se puede deshacer.</div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" style="flex:1;justify-content:center;background:var(--danger);" onclick="confirmDeleteClientForever('${id}')">Sí, eliminar</button>
        </div>
      </div>
    </div>`;
}
async function confirmDeleteClientForever(id){
  await supabaseClient.from('clients').delete().eq('id', id);
  clients = clients.filter(x=>x.id!==id);
  closeModal(); renderTab();
}
async function submitClient(editId){
  const errEl = document.getElementById('cf-error');
  const btn = document.getElementById('cf-submit-btn');
  errEl.textContent = '';
  const name = document.getElementById('cf-name').value.trim();
  if(!name){ errEl.textContent = 'Escribe el nombre del cliente.'; return; }
  const warehouseIds = [...document.querySelectorAll('.cf-warehouse:checked')].map(el=>el.value);
  btn.disabled = true;
  try {
    if (editId) {
      let { error } = await supabaseClient.from('clients').update({ name }).eq('id', editId);
      if (error) throw error;
      ({ error } = await supabaseClient.from('client_warehouses').delete().eq('client_id', editId));
      if (error) throw error;
      if (warehouseIds.length) {
        ({ error } = await supabaseClient.from('client_warehouses').insert(warehouseIds.map(wid=>({client_id:editId, warehouse_id:wid}))));
        if (error) throw error;
      }
    } else {
      const { data, error } = await supabaseClient.from('clients').insert({ name }).select().single();
      if (error) throw error;
      if (warehouseIds.length) {
        const { error: whError } = await supabaseClient.from('client_warehouses').insert(warehouseIds.map(wid=>({client_id:data.id, warehouse_id:wid})));
        if (whError) throw whError;
      }
    }
    await loadClients();
    closeModal(); renderTab();
  } catch (error) {
    errEl.textContent = 'No se pudo guardar: ' + (error.message || 'error desconocido.');
    btn.disabled = false;
  }
}

async function submitPallet(){
  const desc = document.getElementById('pf-desc').value.trim();
  const clientId = document.getElementById('pf-client').value;
  const qty = Number(document.getElementById('pf-qty').value||0);
  if(!desc || !clientId || qty<=0){ alert('Rellena cliente, mercancía y una cantidad válida.'); return; }
  const { data: row, error } = await supabaseClient.from('pallets').insert({
    warehouse_id: currentWarehouseId, client_id: clientId,
    reference: document.getElementById('pf-ref').value.trim(),
    description: desc, quantity: qty, unit: 'palets',
    location: document.getElementById('pf-loc').value.trim(),
    status: 'en almacén', date_in: today(),
  }).select().single();
  if (error || !row) { alert('No se pudo guardar.'); return; }
  await supabaseClient.from('movements').insert({
    warehouse_id: currentWarehouseId, pallet_id: row.id, client_id: clientId, type: 'entrada', quantity: qty, date: today(), ref: 'Alta de palet',
  });
  await Promise.all([loadPallets(), loadMovements()]);
  closeModal(); renderTab();
}

function openSalidaModal(palletId){

  if(!p) return;
  document.getElementById('modal-slot').innerHTML = `

      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;">

        </div>

          ${esc(clientName(p.clientId))} · ${esc(p.description)}<br>
          Disponible: <strong style="color:var(--text);">${p.quantity} ${esc(p.unit)}</strong> en ${esc(p.location||'sin ubicación')}
        </div>
        <div class="field"><label>Cantidad que sale</label><input id="sf-qty" type="number" value="${p.quantity}" max="${p.quantity}" /></div>
        <div class="field"><label>Referencia / motivo</label><input id="sf-ref" placeholder="Ej. Albarán 4521, recogida transportista" /></div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-primary" style="flex:1;justify-content:center;" onclick="submitSalida('${palletId}')">Confirmar salida</button>
        </div>
      </div>
    </div>`;
}
async function submitSalida(palletId){
  const p = palletById(palletId);
  const qty = Number(document.getElementById('sf-qty').value||0);
  if(qty<=0 || qty>p.quantity){ alert('Cantidad no válida.'); return; }
  const newQty = p.quantity - qty;
  const newStatus = newQty<=0 ? 'salido' : p.status;
  await supabaseClient.from('pallets').update({ quantity: newQty, status: newStatus }).eq('id', palletId);
  await supabaseClient.from('movements').insert({
    warehouse_id: currentWarehouseId, pallet_id: palletId, client_id: p.clientId, type: 'salida', quantity: qty, date: today(),
    ref: document.getElementById('sf-ref').value.trim()||'—',
  });
  await Promise.all([loadPallets(), loadMovements()]);
  closeModal(); renderTab();
}

function weekDateRange(year, week){
  const jan4 = new Date(year, 0, 4);
  const jan4Day = jan4.getDay() || 7;
  const monday = new Date(jan4);
  monday.setDate(jan4.getDate() - (jan4Day - 1) + (week-1)*7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
  return { monday: toDateStr(monday), sunday: toDateStr(sunday) };
}

async function submitFuelEntry(){
  const date = document.getElementById('fuel-date').value;
  const liters = Number(document.getElementById('fuel-liters').value||0);
  const price = Number(document.getElementById('fuel-price').value||0);
  const errEl = document.getElementById('fuel-error');
  const { monday, sunday } = weekDateRange(window.__fuelYear, window.__fuelWeek);
  if (!date || date < monday || date > sunday) { errEl.textContent = `La fecha debe estar entre ${fmtDate(monday)} y ${fmtDate(sunday)}.`; return; }
  if (liters <= 0 || price <= 0) { errEl.textContent = 'Indica litros y precio por litro válidos.'; return; }
  const { data, error } = await supabaseClient.from('fuel_entries').insert({ driver_id: window.__fuelDriverId, date, liters, price_per_liter: price }).select().single();
  if (error || !data) { errEl.textContent = 'No se pudo guardar.'; return; }
  fuelEntries.push({ id: data.id, driverId: window.__fuelDriverId, date, liters, pricePerLiter: price });
  renderFuelModal();
}
async function deleteFuelEntry(id){
  await supabaseClient.from('fuel_entries').delete().eq('id', id);
  fuelEntries = fuelEntries.filter(f=>f.id!==id);
  renderFuelModal();
}

async function upsertIndexPercent(driverId, year, month, value, doRender=true){
  const existing = indexationEntries.find(x=>x.driverId===driverId && x.year===year && x.month===month);
  if (value === '') {
    if (existing) {
      await supabaseClient.from('indexation_entries').delete().eq('id', existing.id);
      indexationEntries = indexationEntries.filter(x=>x.id!==existing.id);
    }
  } else if (existing) {
    await supabaseClient.from('indexation_entries').update({ percent: Number(value) }).eq('id', existing.id);
    existing.percent = Number(value);
  } else {
    const { data } = await supabaseClient.from('indexation_entries').insert({ driver_id: driverId, year, month, percent: Number(value) }).select().single();
    if (data) indexationEntries.push({ id: data.id, driverId, year, month, percent: Number(value) });
  }
  if (doRender) renderTab();
}

/* ============================= DASHBOARD TRÁFICO ============================= */
function driverWeekStatus(d){
  const rates = getRatesForDate(d.id, today());
  const { year, week } = getISOWeek(today());
  const closedThisWeek = dailyEntries.filter(f => f.driverId===d.id && f.status==='cerrada' && (()=>{ const w=getISOWeek(f.date); return w.year===year && w.week===week; })());
  const daysSoFar = closedThisWeek.length;
  const kmSoFar = closedThisWeek.reduce((s,f)=> s + Number(f.km||0), 0);
  const hoursSoFar = closedThisWeek.reduce((s,f)=> s + fichajeHours(f), 0);
  const allowedKm = rates.maxKmDay * daysSoFar;
  const allowedHours = rates.maxHoursDay * daysSoFar;
  const kmDelta = kmSoFar - allowedKm;   // positivo = ya pasado en el acumulado
  const hoursDelta = hoursSoFar - allowedHours;
  const kmMarginDays = rates.maxKmDay ? (allowedKm - kmSoFar) / rates.maxKmDay : 0;
  const hoursMarginDays = rates.maxHoursDay ? (allowedHours - hoursSoFar) / rates.maxHoursDay : 0;

  // Días sueltos que se pasaron de su propio máximo diario, aunque el acumulado de la semana
  // no lo refleje todavía (un día muy cargado se puede "esconder" si otros días compensan a la baja).
  const heavyDays = closedThisWeek
    .map(f => ({ date: f.date, km: Number(f.km||0), hours: fichajeHours(f),
      kmOver: Number(f.km||0) - rates.maxKmDay, hoursOver: fichajeHours(f) - rates.maxHoursDay }))
    .filter(x => x.kmOver > 0 || x.hoursOver > 0);

  let level = 'sin-actividad', reasons = [];
  if (daysSoFar > 0) {
    if (kmDelta > 0) { level = 'rojo'; reasons.push(`+${Math.round(kmDelta)} km de más`); }
    if (hoursDelta > 0) { level = 'rojo'; reasons.push(`+${fmtHoursMin(hoursDelta)} de más`); }
    if (level !== 'rojo') {
      if (kmMarginDays < 1 || hoursMarginDays < 1) {
        level = 'ambar';
        if (kmMarginDays < 1) reasons.push(`quedan ${Math.max(0,Math.round(allowedKm-kmSoFar))} km de margen`);
        if (hoursMarginDays < 1) reasons.push(`quedan ${fmtHoursMin(Math.max(0,(allowedHours-hoursSoFar)))} de margen`);
      } else {
        level = 'verde';
      }
    }
    if (heavyDays.length && level !== 'rojo') {
      level = 'ambar';
      heavyDays.forEach(hd => {
        const parts = [];
        if (hd.kmOver > 0) parts.push(`+${Math.round(hd.kmOver)} km`);
        if (hd.hoursOver > 0) parts.push(`+${fmtHoursMin(hd.hoursOver)}`);
        reasons.push(`${fmtDate(hd.date)} se pasó del máximo diario (${parts.join(', ')}), aunque la semana acumulada aún no lo refleje`);
      });
    }
  }
  return { rates, daysSoFar, kmSoFar, hoursSoFar, allowedKm, allowedHours, kmDelta, hoursDelta, heavyDays, level, reasons, openNow: openTodayEntry(d.id) };
}

function netoForDriverYear(driverId, year){
  return weeklyEntries
    .filter(e=>e.driverId===driverId && e.year===year)
    .reduce((s,e) => {
      const rates = getRatesForDate(driverId, weekDateRange(e.year,e.week).monday);
      const c = computeWeek(rates, e);
      const idx = c.dayAmount * (getIndexPercent(driverId, e.year, weekMonth(e.year,e.week))/100);
      return s + c.neto + idx;
    }, 0);
}
function brutoForDriverYear(driverId, year){
  return weeklyEntries
    .filter(e=>e.driverId===driverId && e.year===year)
    .reduce((s,e) => {
      const rates = getRatesForDate(driverId, weekDateRange(e.year,e.week).monday);
      const c = computeWeek(rates, e);
      return s + c.totalIngreso;
    }, 0);
}

// Semanas que cruzan de mes: si hay fichajes diarios de respaldo, se
// reparte esa semana en un trozo por mes (días, km y horas SOLO de
// ese mes; el máximo de km/horas extra se prorratea a esos días, no a
// la semana completa) para que la liquidación mensual sea correcta.
// Si no hay fichajes de respaldo (semana metida a mano) no hay manera
// de saber qué días caen en qué mes, así que se deja como hasta ahora
// (la semana entera cuenta para el mes del jueves de esa semana).
function buildMonthRows(driverId, year, month){
  const weeksForYear = weeklyEntries.filter(e=>e.driverId===driverId && e.year===year);
  if (month === 'todos') return weeksForYear.slice().sort((a,b)=>a.week-b.week);
  const targetMonth = Number(month);
  const rows = [];
  weeksForYear.forEach(e => {
    const { monday, sunday } = weekDateRange(e.year, e.week);
    const mondayMonth = new Date(monday+'T00:00:00').getMonth();
    const sundayMonth = new Date(sunday+'T00:00:00').getMonth();
    if (mondayMonth === sundayMonth) {
      if (mondayMonth === targetMonth) rows.push(e);
      return;
    }
    const weekFichajes = dailyEntries.filter(f => f.driverId===driverId && f.status==='cerrada' && f.date>=monday && f.date<=sunday);
    if (weekFichajes.length === 0) {
      if (weekMonth(e.year, e.week) === targetMonth) rows.push(e);
      return;
    }
    const monthFichajes = weekFichajes.filter(f => Number(f.date.slice(5,7))-1 === targetMonth).sort((a,b)=>a.date.localeCompare(b.date));
    if (monthFichajes.length === 0) return;
    rows.push({
      ...e,
      daysWorked: monthFichajes.length,
      km: Math.round(monthFichajes.reduce((s,f)=>s+Number(f.km||0),0)*10)/10,
      hours: Math.round(monthFichajes.reduce((s,f)=>s+fichajeHours(f),0)*100)/100,
      _splitMonth: targetMonth,
      _rateDate: monthFichajes[0].date,
    });
  });
  return rows.sort((a,b)=>a.week-b.week);
}

function openDriverModal(editId){
